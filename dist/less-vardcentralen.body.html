            { text: 'Det står utmattning i remissen, men det är någon annans hypotes, inte en diagnos. Jag vill börja om från början och höra hur tröttheten faktiskt ser ut. Sedan bestämmer vi vad det här besöket ska bli.',
              tid: 3, ok: true, princip: 'bedda-b',
              humor: 'oppen', reaktion: 'Katrin tittar upp för första gången.',
              svar: 'Tack. Jag kände mig lite dum som satt här och tänkte att det inte stämmer.',
              fx: { allians: 10, tydlighet: 12, sakerhet: 6 },
              varfor: 'En hypotes man får med sig från någon annan är den svåraste sorten att pröva – man börjar leta bekräftelse utan att märka det, och materialet man samlar in passar alltid. Att säga högt att den är en hypotes gör den prövbar, och ger dessutom Katrin tillstånd att invända. Hon försökte redan i sin första replik.' },

            { text: 'Vi tar det i tur och ordning. Berätta hur belastningen på avdelningen sett ut det senaste året.',
              tid: 3, ok: 'delvis', princip: 'bedda-b',
              humor: 'neutral', reaktion: 'Katrin drar på det och börjar berätta om schemat.',
              svar: 'Vi är underbemannade. Men det har vi varit i nio år.',
              fx: { underlag: 4, sakerhet: -4 },
              varfor: 'En fråga vilken psykolog som helst ställer, och den är inte fel – men du började i triagens förklaring, och då får du material som passar den. Lägg märke till svaret: belastningen är oförändrad, tröttheten är ny. Frågan är värd att ställa som prövning av hypotesen, inte som utgångspunkt för den.' },

            { text: 'Vad bra att du kom. Vi hinner göra hela utredningen idag, så slipper du komma tillbaka.',
              tid: 2, ok: false, princip: 'forvantan',
              humor: 'lattad', reaktion: 'Katrin ser lättad ut och lossar på jackan.',
              svar: 'Skönt. Jag har bytt bort ett pass för att komma hit.',
              fx: { allians: 8, tydlighet: -6, underlag: -6, sakerhet: -10 },
              varfor: 'Du lovade ett resultat innan du gjort en bedömning, och priset betalas senare i besöket: när det visar sig att utredningen inte borde slutföras idag är det ditt eget löfte som står i vägen. Ett besök ramas in med vad ni ska göra, aldrig med vad det ska mynna ut i.' },

            { text: 'Jag ser att inga prover är tagna. Det tar vi först – jag skickar en remiss på blodstatus och TSH så har vi svaren.',
              tid: 2, ok: false, princip: 'signering',
              humor: 'neutral', reaktion: 'Katrin: "Får du göra det?"',
              svar: 'Ska jag gå och lämna blod nu, alltså?',
              fx: { sakerhet: -12, tydlighet: -6 },
              varfor: 'Rätt instinkt, fel hand. En provbeställning är en ordination: någon ska svara för indikationen, tolka svaret och ta ansvar när det avviker. Det är inte du. Du har dessutom inte hört anamnesen ännu, så du vet inte vilken fråga proverna skulle svara på. Instinkten kommer tillbaka senare i besöket – då med rätt ägare.' }
          ] },

        { typ: 'flera',
          banner: 'ANAMNESEN',
          fraga: 'Du hinner fyra frågor innan du bestämmer vad besöket ska bli. Välj fyra.',
          antal: 4,
          tidPer: 2,
          tips: 'Fråga efter det som skulle kunna få dig att ändra dig. En fråga som bara kan bekräfta hypotesen är ingen fråga.',
          val: [
            { text: 'Är du lika trött de veckor du är ledig, eller släpper det då?',
              ratt: true, princip: 'bedda-b', fx: { underlag: 10, sakerhet: 8 },
              varfor: 'En trötthet som kommer ur belastning varierar oftast med belastningen. En trötthet som kommer ur kroppen gör det inte. Svaret bevisar ingenting på egen hand – vid ett utvecklat utmattningstillstånd uteblir återhämtningen också – men det är den enskilda fråga som flyttar mest per sekund, och den kostar tio.' },

            { text: 'Har något annat i kroppen ändrat sig det här halvåret? Vikt, mage, hud, hår, blödningar.',
              ratt: true, princip: 'somatik', flagga: 'kroppen-fragad',
              fx: { underlag: 12, sakerhet: 12 },
              varfor: 'Det här är en anamnesfråga, inte en undersökning. Du ställer ingen diagnos genom att fråga – du samlar det som gör att någon annan kan göra det. Att psykologen varken får utreda eller uttala sig om kroppen betyder inte att psykologen inte får fråga om den. Tvärtom: du är den i huset som sitter längst tid med patienten, och därför den som har råd att ställa den.' },

            { text: 'Vill du men orkar inte, eller har lusten till saker försvunnit?',
              ratt: true, princip: 'bedda-b', fx: { underlag: 10 },
              varfor: 'Skiljer bevarad lust med bristande ork från anhedoni och nedstämdhet. Det är frågan som avgör om en depressionsbild överhuvudtaget är på bordet, och den ställs förvånansvärt sällan uttryckligen – man antar svaret i stället, och antar oftast fel håll.' },

            { text: 'Hur många timmar sover du efter ett nattpass – och hur är det de nätter du är ledig och kan sova en hel natt?',
              ratt: true, princip: 'evidens', fx: { underlag: 10, sakerhet: 6 },
              varfor: 'Två frågor i en, och det är den andra som bär. Fem timmars dagsömn efter ett nattpass gör vem som helst trött, och så har hon sovit i nio år. Frågan om de lediga nätterna skiljer den kroniska sömnskulden från något som inte ger med sig ens när sömnen räcker till. Utan den delfrågan blir nattarbetet en förklaring som täcker allt och förklarar ingenting.' },

            { text: 'Låt henne fylla i KEDS så ni har ett utgångsvärde.',
              ratt: false, princip: 'bedda-b', fx: { underlag: -6, sakerhet: -8 },
              varfor: 'Instrumentet är inte fel, men det kan inte göra det du behöver här. En skala för uttröttbarhet blir hög oavsett vad tröttheten beror på – en obehandlad kroppslig sjukdom ger också hög poäng. Du får en siffra som gör hypotesen mer övertygande utan att göra den mer sann, och som pekar ut riktningen för nästa läsare av journalen.' },

            { text: 'Hur är stämningen i arbetsgruppen, och hur fungerar det med chefen?',
              ratt: false, princip: 'bedda-b', fx: { underlag: -4 },
              varfor: 'Varken dum eller oviktig – men den kan bara ge material till den förklaring du redan blivit tilldelad, och svaret blir ja, för svaret blir alltid ja. Den skiljer ingenting, och den kostar två minuter i just den del av besöket där du fortfarande kunde ha ändrat dig.' },

            { text: 'Hur länge tänker du dig själv att du skulle behöva vara borta från jobbet?',
              ratt: false, princip: 'forvantan', fx: { allians: 4, tydlighet: -8, agens: -8 },
              varfor: 'Frågan förutsätter slutsatsen. Ni är några minuter in i ett besök där ingen ännu vet vad tröttheten beror på, och du har just gjort sjukskrivningen till besökets ämne. Efter det blir varje annan väg en besvikelse.' },

            { text: 'Har du provat att sätta gränser hemma och prioritera bort saker?',
              ratt: false, princip: 'bedda-b', fx: { allians: -6, agens: -6 },
              varfor: 'Ett råd förklätt till en fråga, givet före bedömningen. Om tröttheten har en kroppslig orsak är rådet dessutom en anklagelse: hon har slitit i ett halvår för att orka, och får nu höra att hon inte försökt.' }
          ] },

        { typ: 'replik', humor: 'trott',
          text: 'Ledig? Nej, det spelar ingen roll. Jag var borta två veckor i somras och kom hem precis lika trött. Och nej, lusten finns kvar – jag ligger på soffan och vill upp och göra saker, jag kommer bara inte upp. Efter ett pass sover jag fem timmar med gardinerna för, som alltid. Men de lediga nätterna sover jag nio timmar och vaknar precis lika trött. Det gjorde jag inte förr.' },

        { typ: 'replik', om: { finns: 'kroppen-fragad' }, humor: 'trott',
          text: 'Kroppen, säger du... jo. Jag fryser hela tiden, jag har filt på mig på nattpasset och tjejerna skrattar åt mig. Har gått upp sex kilo utan att äta annorlunda, och magen går trögt. Håret ligger i duschen. Och blödningarna har varit riktigt rikliga sedan i höstas, jag trodde det var övergångsåldern. Fast det har väl inte med saken att göra?' },

        { typ: 'val', om: { saknas: 'kroppen-fragad' },
          humor: 'trott',
          text: 'Förlåt – är det kallt här inne? Jag fryser jämt nuförtiden. Ta det inte personligt, jag har filt på mig på nattpasset också.',
          fraga: 'Hon ber om ursäkt för en detalj. Vad gör du?',
          tips: 'Det som sägs som en ursäkt är ofta det som inte fick plats bland frågorna du hann ställa.',
          val: [
            { text: 'Stanna vid det: sedan när fryser du, och har något annat i kroppen ändrat sig samtidigt – vikt, mage, hud, hår, blödningar?',
              tid: 3, ok: true, princip: 'somatik', flagga: 'kroppen-fragad',
              humor: 'neutral', reaktion: 'Katrin tystnar och tänker efter.',
              svar: 'Sedan i höstas, ungefär. Jag har gått upp sex kilo utan att äta annorlunda, magen går trögt och håret ligger i duschen. Och blödningarna har varit riktigt rikliga, jag trodde det var övergångsåldern. Fast det har väl inte med saken att göra?',
              fx: { underlag: 14, sakerhet: 14, allians: 6 },
              varfor: 'Du fick en andra chans och tog den – och den kostade tre minuter du kunde ha lagt i anamnesen. Patienter avväpnar det som skrämmer dem genom att be om ursäkt för det. Att stanna vid en sådan mening är billigare än varje utredning som görs för att ingen stannade.' },

            { text: 'Notera det och gå vidare – ni har ont om tid och mycket kvar av utredningen.',
              tid: 1, ok: false, princip: 'somatik',
              humor: 'sluten', reaktion: 'Katrin nickar och drar jackan tätare om sig.',
              svar: 'Nej nej, det är inget. Fast jag har gått upp sex kilo också, och håret ligger i duschen. Men det är väl bara åldern.',
              fx: { underlag: -8, sakerhet: -14 },
              varfor: 'Hon säger det ändå, i förbifarten, som något hon redan förklarat bort. Uppgiften hölls aldrig undan från dig – du hann bara bestämma vad besöket handlade om innan du hörde den. Så här försvinner den somatiska frågan i praktiken: inte för att någon döljer något, utan för att ingen stannar.' },

            { text: 'Frusenhet hör till när kroppen gått på högvarv länge. Det brukar ge med sig när stressen släpper.',
              tid: 1, ok: false, princip: 'bedda-b',
              humor: 'lattad', reaktion: 'Katrin ser lugnad ut. "Jaha, så det hör ihop."',
              svar: 'Skönt. Då är det inget konstigt alltså.',
              fx: { allians: 8, underlag: -10, sakerhet: -18 },
              varfor: 'Du gjorde en invändning mot hypotesen till ett stöd för den, och du gjorde det med en fysiologisk förklaring du inte har täckning för. Nu har Katrin dessutom fått höra av vården att symtomet är förklarat, vilket är det effektivaste sättet att se till att hon inte tar upp det nästa gång heller.' }
          ] },

        { typ: 'kontroll',
          banner: 'STÄMMER FÖRKLARINGEN MED BILDEN?',
          fraga: 'Trötthet i ett halvår, tappar tråden, sover uselt på dagarna – och nattarbete i nio år på en underbemannad avdelning. Vad i det Katrin berättat går INTE ihop med den förklaring du fick med remissen?',
          tidFel: 2,
          princip: 'hypotes',
          val: [
            { text: 'Att tröttheten är lika stor ledig som i arbete och inte ger med sig av nio timmars sömn, att lusten är kvar – och att fem andra saker i kroppen ändrat sig under samma halvår.',
              ratt: true },
            { text: 'Att hon tappar tråden och glömmer saker.',
              ratt: false,
              varfor: 'Kognitiv svikt finns vid båda förklaringarna, och vid sömnbrist också. Det är det vanligaste i rummet och det som skiljer dem åt allra sämst.' },
            { text: 'Att hon bara sover fem timmar efter ett nattpass.',
              ratt: false,
              varfor: 'Det är en verklig sömnskuld och en verklig delförklaring – men den har sett likadan ut i nio år. En exponering som är oförändrad förklarar sällan en förändring som är ett halvår gammal. Att den ändå kan ha börjat ta ut sin rätt, eftersom tåligheten för skiftarbete typiskt minskar med åldern, är värt att diskutera i gruppen. Det gör den till en delförklaring, inte till det som skaver.' },
            { text: 'Att inga prover någonsin är tagna.',
              ratt: false,
              varfor: 'Sant, och en brist i handläggningen – men det är ingen iakttagelse hos Katrin. Hade allt annat stämt med utmattning hade det varit rätt att arbeta vidare och lämna provfrågan vidare i skrift.' },
            { text: 'Att hon aldrig sökt för psykisk ohälsa förut.',
              ratt: false,
              varfor: 'Säger ingenting om vad tröttheten beror på. Utmattning drabbar oftast just den som aldrig varit sjuk förut.' }
          ],
          forklaring: 'Ett tillstånd som utvecklas ur belastning brukar också röra sig med belastningen: det byggs upp av krav och lättar, långsamt, av avlastning. Katrins trötthet gör ingetdera. Den ligger still oavsett om hon arbetar eller är ledig, den påverkas inte av att hon får sova ut, och lusten är kvar – hon vill men orkar inte. Samtidigt har fem andra saker i kroppen ändrat sig under samma halvår, och belastningen som skulle vara motorn har varit oförändrad i nio år. Kombinationen trötthet som inte svarar på vila och nytillkomna kroppsliga förändringar är ett mönster med flera möjliga orsaker. Vilken av dem det är kan du varken avgöra eller behöva avgöra. Det du kan säga, och som är hela din uppgift här, är att bilden inte har den form som utmattning brukar ha.' },

        { typ: 'kontroll',
          banner: 'DEN FRÅGA INGEN ÄGER',
          fraga: 'Du sitter med det här, och tiden som återstår är bokad för en försäkringsmedicinsk utredning. Vad är slutsatsen?',
          tidFel: 2,
          princip: 'somatik',
          val: [
            { text: 'Underlaget för en psykiatrisk diagnos håller inte förrän någon tagit ställning till det kroppsliga. Utredningen kan inte slutföras idag.',
              ratt: true },
            { text: 'Ingenting i det hon berättar talar för allvarlig kroppslig sjukdom. Slutför utredningen.',
              ratt: false,
              varfor: 'En uteslutning du inte får göra. Att du inte kan bedöma något är inte samma sak som att det inte finns – och att fria kroppen är exakt lika mycket en medicinsk bedömning som att fälla den. Det är samma otillåtna beslut, sett från andra hållet.' },
            { text: 'Kroppsligt och psykiskt kan pågå samtidigt. Slutför utredningen och lägg till en rad om att prover bör tas.',
              ratt: false,
              varfor: 'Sant att de kan pågå samtidigt – men ett underlag som är skrivet blir läst, och slutsatsen i det väger tyngre än reservationen längre ned. Du skulle beskriva en uttalad funktionsnedsättning vars orsak du inte känner till, och en läkare bygger sedan ett intyg på den beskrivningen.' },
            { text: 'Somatiken är läkarens bord. Gör din del och skicka med frågan i journalen.',
              ratt: false,
              varfor: 'Halva vägen, och det är den halva som brister. Att skriva ned frågan är nödvändigt men inte tillräckligt. En anteckning utan mottagare och utan datum är inte en tilldelad fråga – den är en spårbar underlåtenhet. Någon ska heta något, och något ska stå i en kalender.' },
            { text: 'Det här är akut. Hon ska till akutmottagningen idag.',
              ratt: false,
              varfor: 'Ingenting i bilden är akut. Ett halvårs successiv trötthet utreds planerat, med prover först och en bokad tid sedan. Att göra varje obesvarad fråga till en akuttid är samma mekaniska reflex som spelet tränar bort på andra ställen, bara med omvänt förtecken.' }
          ],
          forklaring: 'Sjuksköterskan mötte samma fråga i triagen och lämnade den vidare hit. Du är sista ledet – och du är den som sitter fyrtio minuter med Katrin, vilket gör dig till den som faktiskt hör att hon fryser. Du ska inte utreda kroppen: du får inte beställa prover, inte tolka dem och inte ställa diagnosen. Men Socialstyrelsens intygsföreskrift (HSLF-FS 2018:54) säger i 6 kap. 2 § att intygsutfärdaren endast ska uttala sig om sådana förhållanden hon har tillräcklig kännedom om, och i 6 kap. 3 § att det ska framgå från vem varje uppgift kommer och vad som är utfärdarens egen bedömning. Båda kraven träffar också det underlag en läkare bygger sitt intyg på. Att beskriva en uttalad funktionsnedsättning med en psykiatrisk diagnos i botten, när ingen tagit ett prov på fjorton år, är att uttala sig om något du inte vet. Det du ska göra är att formulera frågan så skarpt att den går att svara på – och se till att den får en namngiven ägare och ett datum.' },

        { typ: 'val',
          humor: 'orolig',
          text: 'Vad tänker du? Är det utbrändhet?',
          fraga: 'Vad svarar du?',
          tips: 'Du får säga att något behöver undersökas. Du får inte säga vad det är, och inte heller vad det inte är. Skillnaden mellan de meningarna är hela din legitimation.',
          val: [
            { text: 'Jag vet inte, och det är faktiskt mitt svar. Att tröttheten är lika stor när du är ledig, att du fryser, att flera saker i kroppen ändrat sig samtidigt – och att ingen tagit ett prov på fjorton år. Det behöver en läkare titta på innan någon skriver något om utmattning. Jag ordnar det. Du ska inte behöva driva det själv.',
              tid: 4, ok: true, princip: 'signering',
              humor: 'oppen', reaktion: 'Katrin blir alldeles tyst. Sedan börjar hon gråta.',
              svar: 'Förlåt. Det är bara... jag har gått ett halvår och trott att jag håller på att bli dement. Eller att jag bara blivit lat.',
              fx: { allians: 12, tydlighet: 14, sakerhet: 14, agens: 8 },
              varfor: 'Tre saker på en gång, och alla tre behövs. Du säger vad du inte vet, vilket är det enda du har grund för att säga. Du säger att det finns en fråga som ska besvaras, vilket är det Katrin behöver höra. Och du tar ägarskapet, i stället för att lämna ett halvårs trötthet till den tröttaste personen i rummet att administrera.' },

            { text: 'Det här låter faktiskt som sköldkörteln. Kylan, vikten, håret – det är ganska klassiskt. Vi ska ta prover på det.',
              tid: 2, ok: false, princip: 'signering',
              humor: 'lattad', reaktion: 'Katrin ser hoppfull ut för första gången under besöket.',
              svar: 'Så det finns en förklaring? Och den går att behandla?',
              fx: { allians: 10, tydlighet: -6, sakerhet: -14 },
              varfor: 'Den varmaste reaktionen i hela besöket, och den kommer av att du sa något du inte får säga. Du är psykolog och har just ställt en medicinsk diagnos, utan undersökning och utan prover. Blir provet normalt har du inte bara haft fel om sköldkörteln – du har förbrukat trovärdigheten för allt annat du sagt, inklusive att det kan finnas en psykologisk del. Och ser hon ett provsvar i appen innan läkaren hunnit ringa, är det du som satt förväntan på vad det betyder.' },

            { text: 'Nej, det här är inte utbrändhet. Men det är ingenting allvarligt – vi tar några prover så får vi se.',
              tid: 2, ok: false, princip: 'signering',
              humor: 'lattad', reaktion: 'Katrin slappnar av. "Skönt att det inte är något farligt."',
              svar: 'Vad skönt. Då behöver jag inte gå och oroa mig i alla fall.',
              fx: { allians: 10, tydlighet: -8, sakerhet: -16 },
              varfor: 'Du friade i stället för att fälla, och trodde att det var den ofarliga riktningen. Det är det inte. Att säga att ingenting är allvarligt är precis lika mycket en medicinsk bedömning som att säga vad det är – och den versionen har dessutom en biverkning: en patient som blivit lugnad söker senare när det blir sämre. Du har ingen aning om vad proverna visar.' },

            { text: 'Jag kan tyvärr inte uttala mig om kroppsliga saker. Det får du ta med en läkare.',
              tid: 1, ok: 'delvis', princip: 'dorr',
              humor: 'sluten', reaktion: 'Katrin drar jackan tätare om sig.',
              svar: 'Okej. Då ringer jag och bokar en läkartid då.',
              fx: { allians: -10, agens: -10, tydlighet: -8, sakerhet: 4 },
              varfor: 'Formellt korrekt och praktiskt oanvändbart, och värt att diskutera i gruppen: gränsen är riktigt dragen, men den levereras som en dörr i ansiktet. Du stängde utan att öppna, och lämnade frågan till den som redan väntat ett halvår på att någon skulle ställa den. Att inte få uttala sig om något är inte samma sak som att inte få ta ansvar för att det blir gjort.' }
          ] },

        { typ: 'val',
          humor: 'orolig',
          text: 'Men jag är ju kallad hit för det där intyget. Jag har väntat tre veckor och bytt bort ett pass för att komma. Ska jag komma tillbaka en gång till?',
          fraga: 'Vad gör du med den avsatta tiden?',
          tips: 'Att inte slutföra utredningen är rätt beslut. Frågan är vad du gör med de tjugo minuter som blir över.',
          val: [
            { text: 'Vi gör inte klart intygsdelen idag – jag skulle skriva något jag inte vet är sant. Men du går inte härifrån tomhänt. Jag ordnar läkartid och prover, och tiden vi har använder vi till sömnen kring nattpassen. Den har du nytta av oavsett vad proverna visar.',
              tid: 3, ok: true, princip: 'dorr',
              humor: 'neutral', reaktion: 'Katrin sätter sig tillbaka i stolen.',
              svar: 'Så jag har inte kommit hit i onödan. Okej. Sömnen, ja – den är ett elände, och den har ingen frågat om på nio år.',
              fx: { allians: 8, tydlighet: 16, agens: 12 },
              varfor: 'Ett avbrutet moment är inte ett avbrutet besök. Du säger vad du inte gör och varför, och fyller tiden med det som är verksamt oavsett vilken förklaring som visar sig stämma. Det är också så du undviker att lära in en reflex lika mekanisk som den du just bröt: att osäkerhet ska hanteras genom att skicka vidare och avsluta.' },

            { text: 'Nej, det här kan vi inte göra idag. Jag bokar en läkartid åt dig, så tar vi om det när proverna är klara.',
              tid: 2, ok: 'delvis', princip: 'plan',
              humor: 'neutral', reaktion: 'Katrin reser sig och tar sin väska.',
              svar: 'Okej. Tack ändå.',
              fx: { allians: -4, tydlighet: 4, agens: -8, sakerhet: 8 },
              varfor: 'Beslutet är rätt och tryggt, och du gav ändå tillbaka tjugo minuter som ingen annan kommer att ge henne. Hon har varit trött i ett halvår, väntat tre veckor på tiden, har ett nattpass på lördag – och fick ingenting att göra fram till dess. Att vara försiktig är inte i sig ett arbete. Rätt beslut och tomma händer räcker till silver, inte till guld.' },

            { text: 'Jag gör klart utredningen som planerat och skriver att somatisk orsak inte är utredd, så får läkaren väga in det.',
              tid: 4, ok: false, princip: 'signering',
              humor: 'lattad', reaktion: 'Katrin ser lättad ut. "Så det blir gjort ändå."',
              svar: 'Tack. Jag ville verkligen inte ha kommit hit förgäves.',
              fx: { allians: 6, underlag: -14, sakerhet: -12 },

            { text: 'Jag skriver ett underlag på fyra veckors sjukskrivning, så får du vila medan utredningen görs.',

        { typ: 'flera',
          banner: 'DET SOM GÅR ATT GÖRA IDAG',
          fraga: 'Tjugo minuter kvar och ett halvår bakom henne. Vad gör du med tiden? Välj tre.',
          antal: 3,

          tips: 'Välj det som är verksamt oavsett vad proverna visar. Allt annat måste vänta på svaret.',
          val: [
            { text: 'Gå igenom sömnen kring nattpassen konkret: mörkläggning och tyst sovrum på dagen, sovtiden lagd på samma klockslag mellan passen, planerad sömn före passet i stället för att gå upp trött, och när på natten hon dricker sitt sista kaffe.',

            { text: 'Säg rakt ut att ett halvårs trötthet med de här kroppsliga inslagen inte är lathet, inte begynnande demens och inte något hon kunnat tänka bort – och att det är just därför du inte tänker skriva något innan någon vet.',

        { typ: 'kontroll', om: { saknas: 'cauda-fragad' },

        { typ: 'val',

          val: [

              fx: { sakerhet: 16, underlag: 10, agens: 8 },

            { text: 'MADRS-S i väntrummet, så att du får en siffra på depressionsdjupet innan du bestämmer dig.',
              ratt: false, princip: 'evidens', fx: { sakerhet: -12, allians: -6 },

            { text: 'TSH, blodstatus, B12 och leverstatus, för att inte missa en somatisk orsak till nedstämdheten.',

              fx: { sakerhet: -12, allians: -18, tydlighet: -8 },
              varfor: 'Han har samtyckt till att hon kontaktas, inte till innehållet, och han har uttryckligen satt en gräns. Sekretessen gäller mot närstående som mot alla andra. Det finns undantag för akuta nödsituationer, men de är till för ögonblicket då någon håller på att dö framför dig – de är inte ett planeringsverktyg för en kväll du känner dig orolig inför. Priset betalas ikväll och det är konkret: den första person i vården han berättade något för blev den som gick bakom hans rygg.' },

            { text: 'Lämna tablettfrågan. Vill han verkligen göra något hittar han ett annat sätt.',
              tid: 2, ok: false, princip: 'plan',
              humor: 'neutral', reaktion: 'Frågan lämnas. Ni går vidare.',
              svar: '',
              fx: { sakerhet: -20 },
              varfor: 'Det låter luttrat och det är fel. Att begränsa tillgången till medel är en av få suicidpreventiva åtgärder med robust stöd: handlingen är ofta impulsiv, tidsfönstret kort, och en substitution sker långt ifrån alltid. Just de här tabletterna är dessutom det han låg och läste om i natt. Att lämna dem kvar en trappa upp är att lämna kvar den enda konkreta sak i hela ärendet som du faktiskt kunde ändra på.' }

        { typ: 'kontroll',
          banner: 'VAR GÅR GRÄNSEN',
          fraga: 'Är det här ett vårdintyg?',
          tidFel: 2,
          princip: 'ansvar',
          val: [
            { text: 'Nej. Han tar emot hjälp frivilligt, och tvångsvård förutsätter både en allvarlig psykisk störning och att han motsätter sig vården.',
              ratt: true },
            { text: 'Ja. Konkreta suicidtankar med tillgång till medel räcker för vårdintyg.', ratt: false,
              varfor: 'Suicidtankar är inte i sig en allvarlig psykisk störning i lagens mening, hur konkreta de än är. Tvångsvård förutsätter dessutom att patienten motsätter sig vården eller inte kan ta grundad ställning till den – och Ronny sitter i din stol och samtalar med dig.' },
            { text: 'Ja, om psykiatrin säger att de inte kan ta emot honom. Då är vårdintyget vägen in.', ratt: false,
              varfor: 'Den vanligaste felanvändningen och den mest begripliga: du är orolig, dörren är stängd, och vårdintyget ser ut som en nyckel. Men ett vårdintyg är ett rättsligt intygande om att förutsättningarna för tvång är uppfyllda – det är inte ett sätt att lösa en resursbrist. Skriver du det utan att kriterierna finns intygar du något du vet inte stämmer.' },
            { text: 'Nej – vårdintyg får bara utfärdas av psykiater.', ratt: false,
              varfor: 'Vanlig missuppfattning. Ett vårdintyg får utfärdas av varje legitimerad läkare efter en särskild läkarundersökning, alltså också av dig på vårdcentralen. Att du får skriva det är precis därför du måste veta när du inte ska.' }
          ],
          forklaring: 'Lagen om psykiatrisk tvångsvård kräver tre saker samtidigt: allvarlig psykisk störning, ett oundgängligt behov av psykiatrisk vård dygnet runt som inte kan tillgodoses på annat sätt, och att patienten motsätter sig vården eller inte kan ta grundad ställning till den (3 §). Vårdintyget får utfärdas av en legitimerad läkare efter en särskild läkarundersökning och ska skrivas i omedelbar anslutning till den (4–5 §§). Har ett vårdintyg utfärdats får patienten hållas kvar tills frågan om intagning avgjorts (6 §), och polishandräckning kan begäras (47 §). Vägrar någon låta sig undersökas alls får en läkare i allmän tjänst besluta om omhändertagande för undersökning (4 §). Allt det här är verktyg du faktiskt har på en vårdcentral. Poängen med att kunna dem är att veta att Ronny inte är där – och att också det ska stå i journalen. Ett övervägande om tvångsvård som gjordes och landade i nej ser i efterhand ut som en fråga ingen ställde, om det inte är skrivet.' },

        { typ: 'val',
          humor: 'spand',
          text: 'Jag åker inte in på nån psykakut. Jag är inte galen.',
          fraga: 'Klockan är 14.35. Vad gör du med psykiatrin?',
          tips: 'Tre olika saker heter "kontakta psykiatrin", och de tar olika lång tid att bli av med.',
          val: [
            { text: 'Ring psykiatrisk akutmottagning eller bakjour medan han sitter kvar. Föredra vad du sett, säg vad du är osäker på, och kom överens om vem som gör vad och när. Skriv in vem du talade med, klockslag och vad ni bestämde.',
              tid: 5, ok: true, princip: 'ansvar',
              humor: 'orolig', reaktion: 'Sju minuter i kö. Ronny sitter kvar och hör din halva av samtalet.',
              svar: 'Vad sa dom?',
              fx: { sakerhet: 16, tydlighet: 12, underlag: 10 },
              varfor: 'Konsultation, inte överlämning. Du behåller ärendet men delar bedömningen med någon som gör den varje dag, och du gör det medan patienten är kvar – så att beskedet kan ges till honom direkt i stället för att bli ett brev. Två saker gör samtalet användbart: att du refererar vad du faktiskt hört med hans ord, och att du säger vad du är osäker på i stället för att argumentera för ett utfall. Blir svaret nej har du en delad och dokumenterad bedömning att stå på. Blir svaret ja har du sluppit skicka honom till en väntsal på vinst och förlust. Att han hörde samtalet är inget problem – det är det mest respektfulla i hela besöket.' },

            { text: 'Skicka honom till psykiatriska akutmottagningen nu. Ring en taxi och se till att han åker.',
              tid: 3, ok: 'delvis', princip: 'rodflagga',
              humor: 'spand', reaktion: 'Han reser sig halvvägs ur stolen.',
              svar: 'Menar du allvar? Jag har ju inte gjort nåt.',
              fx: { sakerhet: 6, allians: -10, agens: -12, tydlighet: -6 },
              varfor: 'Ibland är det precis rätt, och då ska du inte tveka en sekund: pågående handling, uttalad förvirring eller psykos, kraftig påverkan, eller att du helt enkelt inte kan svara för att han lever i natt. Men det är inte gratis. Han vill inte, du kan inte tvinga eftersom kriterierna för tvång inte är uppfyllda, och en frivillig resa patienten inte vill göra slutar ofta i att han kliver av på vägen. Kommer han fram väntar han i flera timmar och skickas hem sent på kvällen – och nästa gång söker han inte. Att eskalera är ett verktyg, inte ett bevis på omsorg.' },

            { text: 'Skriv en remiss till allmänpsykiatrin, märk den akut, och ge honom kopian med hem.',
              tid: 2, ok: false, princip: 'plan',
              humor: 'neutral', reaktion: 'Remissen är skriven på två minuter och ser bra ut.',
              svar: 'Så då hör dom av sig?',
              fx: { sakerhet: -16, tydlighet: -12 },
              varfor: 'Det känns som en åtgärd och är en fördröjning. En remiss är en begäran om bedömning, inte en tid: den ska läsas, prioriteras och bedömas, och ordet akut i en remiss betyder olika saker på olika håll. Under tiden har Ronny ett papper i fickan och ingenting i kalendern. Remissen ska skickas – den är bara inte det som bär kvällen.' },

            { text: 'Tidigarelägg psykologtiden till imorgon och nöj dig med det. Psykologen är den som ska göra utredningen ändå.',
              tid: 2, ok: false, princip: 'triage-f',
              humor: 'lattad', reaktion: 'Han verkar okej med det.',
              svar: 'Imorgon, ja. Det är väl bra.',
              fx: { allians: 8, sakerhet: -18, tydlighet: -8 },
              varfor: 'Det här är LESS-svaret, och det är därför det är farligt. Modellen är byggd för ärenden där ett dygn inte spelar någon roll, och för dem är den bra. Här spelar dygnet roll. En psykologtid är dessutom inte en riskbedömning – det är en behandlingsinsats som förutsätter att någon redan bedömt att patienten kan vänta till dess. Den bedömningen är din, den är gjord, och den säger något annat. Flytta tiden också. Den är bara inte svaret på frågan om ikväll.' }
          ] },

        { typ: 'val',
          humor: 'trott',
          text: 'Kan jag inte bara få nåt så jag sover? Och papperet till chefen, han har frågat.',
          fraga: 'Två saker han själv har bett om. Vad gör du med dem?',
          tips: 'Det ena kan hjälpa i natt, skjuta upp en behandling eller bli metoden. Det andra är två minuters arbete – frågan är vad det är värt just idag.',
          val: [
            { text: 'Ta ställning till sömnen i klartext, och förskriv i så fall litet och kortvarigt med begränsat uttag. Vänta med antidepressiv behandling till uppföljningen om ett par dagar. Fråga om han sjukanmält sig – och säg att intyget inte är det som brådskar.',
              tid: 3, ok: true, princip: 'grad',
              humor: 'neutral', reaktion: 'Han ser förvånad ut när du säger att papperet kan vänta.',
              svar: 'Så jag behöver inget intyg idag?',
              fx: { tydlighet: 14, underlag: 12, allians: 8, sakerhet: 6 },
              varfor: 'Tre små beslut som alla spelar roll. Sömnen: två–tre timmar per natt i tre veckor är i sig en riskförstärkare och att göra något åt den är verksamt – men mängden i handen är en del av risken, så förskriv litet, kortvarigt och med begränsat uttag, och säg varför. Att avstå helt är också ett svar, och då ska det sägas rakt, inte som "vi tar det sen". Behandlingen: att starta ett antidepressivum kan mycket väl bli rätt, men diagnosen är oklar så länge han dricker dagligen, effekten kommer först efter veckor, och de första veckorna hos en ung vuxen kräver täta kontakter. Det beslutet blir bättre om två dagar, när du vet om planen höll. Intyget: han har varit borta sedan i tisdags, arbetsgivaren betalar sjuklön de första fjorton dagarna och kan enligt sjuklönelagen som huvudregel begära läkarintyg först från och med dag åtta. Att kunna den regeln är det som låter dig rensa bordet utan att neka honom något. Fråga däremot om han sjukanmält sig – har han inte det finns ingen sjuklön att intyga för, och det märker han först om två veckor.' },

            { text: 'Starta en SSRI idag och skriv en liten mängd sömnmedel, med återbesök om en vecka.',
              tid: 3, ok: 'delvis', princip: 'evidens',
              humor: 'neutral', reaktion: 'Han tar emot recepten.',
              svar: 'Okej. Hur lång tid tar det innan det funkar?',
              fx: { allians: 8, tydlighet: 4, sakerhet: -4 },
              varfor: 'Fullt försvarbart, och många skulle göra det. Bilden talar för en depressiv episod och behandling ska starta. Det som gör det till andrahandsval idag är att den dagliga alkoholen gör både diagnosen och läkemedelseffekten svårvärderad, och att en vecka är lång tid när planen för ikväll ännu inte är prövad. En kortare första uppföljning kostar dig ingenting och gör beslutet bättre. Värt att diskutera i gruppen: startar ni antidepressivt vid första besöket när det finns suicidtankar, eller vid den första uppföljningen?' },

            { text: 'Skriv ut en förpackning zopiklon och en SSRI, och boka uppföljning om fyra veckor.',
              tid: 2, ok: false, princip: 'evidens',
              humor: 'lattad', reaktion: 'Han ser lättad ut. Det här kände han igen som hjälp.',
              svar: 'Tack. Då kanske jag får sova i alla fall.',
              fx: { allians: 10, sakerhet: -18, tydlighet: -8 },
              varfor: 'Fyra veckor är fel intervall i varje del av det här. Effekten av antidepressiv behandling kommer inte förrän efter flera veckor, och de första veckorna är de känsligaste hos en ung vuxen – han ska ses långt innan dess. Och du har just lämnat över två fulla förpackningar till en man som samma natt läste på om hur mycket som skulle behövas. Läkemedel kan vara rätt här, men mängd, uttag och nästa besök är delar av ordinationen, inte administrativa detaljer.' },

            { text: 'Ingen medicin och inget intyg idag – vi tar det när läget är utrett.',
              tid: 2, ok: false, princip: 'forvantan',
              humor: 'sluten', reaktion: 'Han tittar ner i golvet.',
              svar: 'Så jag kom hit för ingenting.',
              fx: { allians: -12, agens: -8, tydlighet: -10, sakerhet: 2 },
              varfor: 'Försiktighet utan besked är inte försiktighet, det är att skjuta upp. Två saker fattas. Sömnen är en riskfaktor du valde att inte göra något åt utan att säga varför, och ett nej som inte motiveras hörs som ett nej till honom. Och han fick inget besked om pengarna, så den oron går han hem med ovanpå allt annat – trots att svaret på just den frågan var enkelt och lugnande. Att avstå från sjukskrivning eller från en förskrivning är ett medicinskt ställningstagande som ska motiveras och dokumenteras, aldrig ett tyst nej.' }
          ] },

        { typ: 'val',
          om: { saknas: 'ambivalens-fragad' },
          humor: 'sluten',
          text: 'Han drar upp dragkedjan och reser sig. "Tack ändå."',
          fraga: 'Han är på väg ut och du vet fortfarande inte vad som håller emot. Vad gör du?',
          tips: 'Frågan blir inte lättare av att komma sent. Den blir bara obligatorisk.',
          val: [
            { text: 'Be honom sätta sig igen och fråga rakt: vad är det som gjort att du inte gjort något, och håller det ikväll också?',
              tid: 3, ok: true, princip: 'rodflagga', flagga: 'ambivalens-fragad',
              humor: 'ledsen', reaktion: 'Han står kvar en stund. Sedan sätter han sig.',
              svar: 'Mormor, väl. Hon skulle ta det jättehårt.',
              fx: { sakerhet: 14, underlag: 8, allians: -4 },

            { text: 'Ställ frågan stående, i dörren.',

            { text: 'Låt honom gå. Skriv "inga aktuella suicidtankar framkom" i journalen.',
              tid: 1, ok: false, princip: 'signering',
              humor: 'neutral', reaktion: 'Dörren går igen. Anteckningen tar tjugo sekunder.',
              svar: '',
              fx: { sakerhet: -26, underlag: -16 },
              varfor: 'Du skriver att något inte framkom ur en fråga du aldrig ställde. Journalen är inte en sammanfattning av din känsla, den är en handling som nästa läkare fattar beslut på – och den här raden kommer att läsas som att risken bedömts och avfärdats. Det är samma sak som gör en intygsrad osann: en slutsats placerad där en observation ska stå. Skriv i stället vad du faktiskt gjorde och inte gjorde, också när det är obekvämt.' }
          ] },

        { typ: 'beslut',
          banner: 'STÄLLNINGSTAGANDE',
          fraga: 'Klockan är 14.50. Vad går Ronny härifrån med?',
          tips: 'Du kan inte förutsäga natten. Du kan minska det som går att minska och se till att någon annan än han själv håller i nästa kontakt.',
          val: [
            { text: 'En skriven plan för kvällen och en tid imorgon: mormor inne i rummet inom den ram han godkänt, tabletterna omhändertagna, överenskommet att han inte dricker ikväll, återbesök hos dig om två dagar och ett telefonsamtal imorgon förmiddag från en namngiven person – och hela riskbedömningen dokumenterad med hans egna ord.',
              ok: true, princip: 'plan', tid: 3,
              fx: { sakerhet: 18, tydlighet: 14, underlag: 12, allians: 8, agens: 8 },
              utfall: 'Mormor tar med sig sina tabletter hem och Ronny sover i hennes gästrum. Sjuksköterskan ringer 09.10 dagen efter och han svarar. Han kommer på återbesöket. Psykologtiden ligger på fredag.',
              varfor: 'Det här är vad en vårdcentral faktiskt kan göra en eftermiddag, och det räcker längre än det ser ut. Fyra ben: någon vet, medlen är borta, alkoholen är avtalad bort för just ikväll, och nästa kontakt har ett namn, ett klockslag och en ansvarig som inte är han själv. Ovanpå det står bedömningen skriven, så att den går att ompröva av nästa läkare i stället för att behöva göras om från noll. Att du inte kan förutsäga natten är inte ett skäl att låta bli – det är skälet att göra just det som går att göra. Lägg också märke till vad som inte hände: ingen tvingades någonstans, inget vårdintyg skrevs, ingen skickades till en väntsal. Det är inte en mildare variant av rätt svar. Det är rätt svar.' },

            { text: 'Skicka honom till psykiatriska akutmottagningen ändå. Hellre en gång för mycket.',

              fx: { sakerhet: 4, allians: -12, agens: -12, tydlighet: -6 },
              utfall: 'Han säger ja i rummet. Mormor kör honom. De vänder efter tjugo minuter i väntsalen och åker hem.',
              varfor: 'Ibland är det det enda rätta, och då ska det göras utan att tveka. Men hellre en gång för mycket är en princip som fungerar för den som skickar och sällan för den som skickas. Han samtycker inte på riktigt, du kan inte tvinga, och en frivillig transport patienten inte vill göra är ingen säkerhetsåtgärd – bara en överlämning som ser ut som en. Det som faktiskt skyddar honom går att göra här: färre tabletter i huset, någon som vet, en nykter kväll och en tid imorgon med ett namn på. Värt att diskutera i gruppen: var går er gräns, och vem hos er bestämmer den klockan tre på eftermiddagen?' },

            { text: 'Intyg fjorton dagar, psykologtiden ligger kvar, och han hör av sig om det blir värre.',

              utfall: 'Han går klockan 14.55 med ett intyg och en tid längre fram. Mormor får aldrig veta något. På söndagen svarar han inte i telefon.',

            { text: 'Skriv ett vårdintyg och begär polishandräckning, så vet du att han kommer fram.',
              ok: false, princip: 'ansvar', tid: 2,
              fx: { sakerhet: -20, allians: -20, agens: -16 },
              utfall: 'Psykiatrin bedömer att kriterierna inte är uppfyllda och han skrivs ut samma kväll. Han kommer aldrig tillbaka till er.',

          ] }
      ]
    }
  ];

              varfor: 'Lagen ålägger regionen en skyldighet mot sjukskrivna patienter. Den säger ingenting om att andra inte får tas emot. I remissarbetet ville flera myndigheter och organisationer att skyldigheten skulle gälla även förebyggande, och regeringen valde att inte införa den – det är ett nej till ett skallkrav, inte ett förbud. Skillnaden är hela poängen: det som avgör om du får sitta här är din vårdgivares uppdrag, inte lagens ordalydelse.' },
            { text: 'Hon riskerar att bli sjukskriven, alltså är hon min patient.',
              ratt: false,
              varfor: 'Förebyggande koordinering finns på riktigt – flera regioner har uttryckligen med den som riskerar sjukskrivning i uppdraget, och där kan det vara helt rätt. Men den vilar på ett lokalt beslut, inte på lagen, och den förutsätter att risken går att påverka med vårdens medel. Här har sköterskan redan konstaterat att det inte finns något sjukdomstillstånd. Risken ligger i arbetsmiljön, och den förebyggs av arbetsgivaren.' },
            { text: 'Sjuksköterskan har bokat hit henne, alltså är hon triagerad rätt och mitt uppdrag följer av bokningen.',
              ratt: false,
              varfor: 'En bokning är inte ett mandat. Den som tar emot ett ärende måste själv kunna säga vad hen gör med det, annars vandrar ärendet vidare i huset tills det tar slut hos någon som inte heller kan säga det. Att en kollega tvekade är ett skäl att titta noga, inte ett skäl att sluta titta.' }
          ],
          forklaring: 'Lagen om koordineringsinsatser för sjukskrivna patienter (2019:1297) ger regionen en skyldighet att erbjuda insatser till sjukskrivna patienter, när det behövs för att främja återgång till eller inträde i arbetslivet. Miriam är inte sjukskriven, så skyldigheten är inte utlöst – och lagen förbjuder inte att hon tas emot ändå. Frågan avgörs av ditt lokala uppdrag, och den skiljer sig mellan regioner och mellan vårdcentraler. Två saker till, som gör svaret skarpare än en formalitet. Det första: även om du får ta emot henne finns här inget att koordinera. Ingen sjukskrivning, ingen rehabplan att skriva, ingen behandling att samordna med och ingen funktionsbeskrivning att ta med till en arbetsgivare. Det andra: tiden du lägger här är tid som tillhör de sjukskrivna patienter du faktiskt har en skyldighet mot. Det var invändningen mot hela lagen från flera remissinstanser – undanträngning – och den blir konkret först i ett rum som det här. Det betyder inte att du ska köra ut henne. Det betyder att besöket ska vara kort, avgränsat och sluta i något hon kan använda, inte i ett ärende hos dig.' },

        { typ: 'replik', humor: 'spand',
          text: 'Nitton år har jag varit där. Nitton. Och nu sitter jag i ett rum på vårdcentralen och får höra att det inte hör hit heller.' },

        { typ: 'flera',
          banner: 'DET DU FAKTISKT BEHÖVER VETA',
          fraga: 'Du hinner tre frågor innan ni landar besöket. Välj tre.',
          antal: 3,
          tidPer: 2,
          tips: 'Du ska inte utreda konflikten. Du ska veta om bilden rört sig sedan i fredags, vad hon redan gjort, och vem som finns på hennes sida.',
          val: [
            { text: 'Har något ändrat sig sedan du chattade med oss i fredags – sömnen, orken, hur söndagskvällarna känns?',
              ratt: true, princip: 'bedda-b', fx: { underlag: 12, sakerhet: 10 },
              varfor: 'Fyra dagar är kort, och det är precis därför frågan är billig. Du misstror inte sköterskans bedömning, du sätter ett datum på den. En reaktion på en pågående kränkning kan över tid utvecklas till ett sjukdomstillstånd, och det sker sällan med ett larm – det börjar med att sömnen viker och att söndagskvällen blir outhärdlig. Frågan tar tjugo sekunder och den är det enda som gör "hör av dig om det ändras" till något annat än en artighet.' },
            { text: 'Vad har du redan gjort åt det här, och vad hände då?',
              ratt: true, princip: 'agens', fx: { agens: 12, underlag: 10 },
              varfor: 'Hon har en pärm. Antingen har hon redan tagit steg som ingen följt upp, eller så har hon samlat i tysthet i sju månader – och de två lägena kräver helt olika råd. Det är dessutom den enda frågan i listan som utgår från att hon är någon som kan handla, och det är den utgångspunkten hennes chef har ägnat sju månader åt att ta ifrån henne.' },
            { text: 'Vet du vem som är skyddsombud hos er, och har er förvaltning företagshälsovård?',
              ratt: true, princip: 'ansvar', fx: { tydlighet: 14, agens: 8 },
              varfor: 'Frågan som avgör vad ditt avslut kan innehålla. Finns ett skyddsombud finns redan en person med rätt att skriftligt begära åtgärder av arbetsgivaren, få besked, och gå vidare till Arbetsmiljöverket om svaret uteblir – det är den enda part i det här som kan tvinga fram ett svar. Företagshälsovården är arbetsgivarens resurs och byggd för just det här. Lägg märke till att frågan gäller vem skyddsombudet är, inte om hon är fackligt ansluten. Facklig tillhörighet är en särskilt skyddad personuppgift och har inget i en journal att göra – och du behöver inte veta det för att kunna säga att facket finns.' },
            { text: 'Vad sa chefen exakt på mötet i mars?',
              ratt: false, princip: 'ansvar', fx: { underlag: -6, sakerhet: -6 },
              varfor: 'Nu utreder du konflikten. Du hör ena sidan, du har ingen befogenhet att pröva den andra, och allt du skriver ner blir en partsinlaga om en namngiven chef i en journal som ska följa Miriam i decennier. I chatten kostade den frågan lite. Här kostar den mer: pärmen ligger på bordet och hon vill inget hellre än att gå igenom den med dig.' },
            { text: 'Skulle du vilja att jag följer med på ett möte med din chef?',
              ratt: false, princip: 'ansvar', fx: { agens: -12, tydlighet: -10 },
              varfor: 'Ett erbjudande förklätt till en fråga, och ett du inte kan hålla. Det finns inget sjukfall, inget samtycke och ingenting från vården att säga på mötet. Har du väl frågat är löftet givet, och att ta tillbaka det kostar mer förtroende än att aldrig ha erbjudit det.' },
            { text: 'Hur mycket skulle du behöva vara borta för att orka?',
              ratt: false, princip: 'dorr', fx: { tydlighet: -12 },
              varfor: 'Förutsätter en sjukskrivning som ingen bedömt och som du dessutom inte beslutar om. Efter den frågan är längden förhandlad och varje annat besked låter som ett svek.' },
            { text: 'Har du funderat på att söka något annat? Nitton år är länge.',
              ratt: false, princip: 'agens', fx: { agens: -10, allians: -6 },
              varfor: 'Ett råd förklätt till en fråga, och det billigaste sättet att lägga problemet tillbaka på den som drabbats av det. Det kan mycket väl bli hennes slutsats – men det är hennes att komma fram till, och den dag hon gör det ska det vara ett val och inte en reträtt.' }
          ] },

        { typ: 'replik', humor: 'spand',
          text: 'Nej, det är sig likt. Jag sover, jag springer på tisdagar och torsdagar. Jag är inte ledsen, jag är arg. Och jo – jag mejlade HR i maj. De svarade att jag skulle prata med min närmaste chef. Det var hela svaret. Skyddsombud har vi, Lasse på andra våningen tror jag. Företagshälsovård finns, men dit ska man gå via chefen.' },

        { typ: 'val',
          humor: 'spand',
          text: 'Kan du inte i alla fall skriva något? Ett papper där det står att jag mår dåligt av det här. Då kanske de tar det på allvar.',
          fraga: 'Vad svarar du?',
          tips: 'Fråga dig vad ett papper från vården faktiskt skulle innehålla – och vad det skulle göra med frågan om vems problemet är.',
          val: [
            { text: 'Nej, och jag ska säga varför. Allt jag kunde skriva är det du berättat för mig, och det står redan bättre i din egen pärm. Ett papper från vården skulle dessutom göra det här till en fråga om din hälsa i stället för om deras arbetsmiljö, och det är precis den flytten du inte vill ha. Det som väger hos er är en skriftlig begäran från skyddsombudet – den måste arbetsgivaren svara på.',
              tid: 4, ok: true, princip: 'ansvar',
              humor: 'neutral', reaktion: 'Miriam blir tyst. Sedan: "Måste de svara?"',
              svar: 'Måste de svara? Det visste jag inte.',
              fx: { tydlighet: 16, agens: 16, sakerhet: 8 },
              varfor: 'Nejet har ett skäl som handlar om henne och inte om regler, och det byts direkt mot ett verktyg som biter hårdare än det hon bad om. Mekanismen är värd att se: ett intyg om att någon mår dåligt av sin arbetsplats flyttar frågan från arbetsmiljö till hälsa, och därmed från arbetsgivarens bord till hennes. Skyddsombudets framställan gör tvärtom – den tvingar fram ett skriftligt besked från den som faktiskt äger frågan, och uteblir beskedet finns Arbetsmiljöverket.' },

            { text: 'Jag skriver en anteckning om det du berättat, så kan du begära ut din journal själv och visa den var du vill.',
              tid: 3, ok: 'delvis', princip: 'samtycke',
              humor: 'lattad', reaktion: 'Miriam nickar. "Bra. Då står det svart på vitt."',
              svar: 'Bra. Då står det i alla fall svart på vitt någonstans.',
              fx: { allians: 8, sakerhet: -8, underlag: -6 },
              varfor: 'Juridiskt renare än det ser ut – hon bär själv ut uppgiften, ingen sekretessprövning behövs och ingen tredje part kontaktas. Problemet är innehållet. Ena partens anklagelser mot en namngiven chef, nedskrivna av vården, får vårdens auktoritet utan vårdens underlag, och de blir kvar i journalen i decennier. Skilj på två saker: att besöket, beslutet och den information du gett ska journalföras är självklart, och det ska det. Att journalföra konflikten är något annat. Värt att diskutera i gruppen: hur skriver ni om en arbetsplatskonflikt som ni samtidigt bedömt inte är ett vårdärende?' },

            { text: 'Jag kan ringa HR och berätta hur det här påverkar dig. Ibland lyssnar de mer på oss.',
              tid: 3, ok: false, princip: 'samtycke',
              humor: 'lattad', reaktion: 'Miriam ler för första gången.',
              svar: 'Skulle du? Tack.',
              fx: { allians: 12, sakerhet: -18, agens: -14 },
              varfor: 'Meningen "ibland lyssnar de mer på oss" är sann, och det är just därför den är farlig. Du planerar att lämna uppgifter om en patient till tredje part utan dokumenterat samtycke, och ett samtycke hade gjort det tillåtet men inte klokt: vad ska du säga? Du har ingen sjukdom att beskriva, ingen funktion att beskriva och ingen plan att förankra. Kvar blir att vården gått in som part i hennes anställning, att din auktoritet lånats ut till ena sidan i en konflikt du inte utrett – och att hon nästa gång kan det ännu lite mindre själv.' },

            { text: 'Jag kan inte skriva något, men jag bokar in dig hos vår läkare så att du åtminstone får en bedömning.',
              tid: 2, ok: false, princip: 'sjukdomskrav',
              humor: 'lattad', reaktion: 'Miriam: "Okej. När då?"',
              svar: 'Okej. När kan jag komma?',
              fx: { allians: 8, tydlighet: -14, underlag: -10 },
              varfor: 'Det respektablaste sättet att göra det här till hennes sjukdom. Bedömningen är redan gjord och svaren ligger framför dig: hon sover, äter, tränar och utför det hon får utföra. Läkartiden skulle användas till att säga samma sak en gång till, tio dagar senare, till någon som under tiden hunnit sjukanmäla sig. Att skicka vidare när man känner obehag är inte försiktighet – det är obehaget som fattar beslutet.' }
          ] },

        { typ: 'kontroll',
          banner: 'OM DET ÄNDÅ BLIR EN ARBETSGIVARKONTAKT',
          fraga: 'Miriam frågar: "Och om jag blir sjukskriven längre fram – då kan du väl vara med på ett möte?" Vad krävs för att du ska få tala med hennes arbetsgivare den dagen?',
          tidFel: 2,
          princip: 'samtycke',
          val: [
            { text: 'Ett dokumenterat och avgränsat samtycke – vem du får tala med, om vad, och hur länge det gäller – och något från vården att faktiskt säga: en beskrivning av funktion och behov, inte hennes berättelse om chefen.',
              ratt: true },
            { text: 'Att hon är sjukskriven. Sjukskrivningen ger dig rätt att kontakta arbetsgivaren.',
              ratt: false,
              varfor: 'Sjukskrivningen utlöser regionens skyldighet att erbjuda dig som stöd. Den ger ingen rätt att lämna ut uppgifter. Sekretessen bryts av hennes samtycke, aldrig av ditt uppdrag och aldrig av mottagarens behov.' },
            { text: 'Ett generellt samtycke till kontakt med berörda aktörer, taget vid första besöket.',
              ratt: false,
              varfor: 'Vanligt, bekvämt och för brett. Ett samtycke som inte säger vem, om vad och hur länge kan hon varken överblicka eller i praktiken ta tillbaka – och du vet inte var gränsen går den dag någon ställer en fråga du inte tänkt på. Ett samtycke ska gå att läsa upp för den det gäller utan att någon blir förvånad.' },
            { text: 'Arbetsgivarens rehabiliteringsansvar. Chefen är skyldig att agera och måste därför få veta vad som gäller.',
              ratt: false,
              varfor: 'Ansvaret är verkligt och det ger ingen rätt till uppgifter från vården. Arbetsgivaren ska få veta vad som behövs för att anpassa arbetet – vilka moment som inte fungerar och vad som skulle hjälpa – och det kan Miriam förmedla själv eller du med hennes samtycke. Diagnosen ska aldrig dit.' }
          ],
          forklaring: 'Rätt svar har två halvor och den andra glöms nästan alltid. Formen: samtycket ska vara dokumenterat och avgränsat i vem, vad och hur länge, och ett samtycke som är taget i förväg för allt är i praktiken inget samtycke. Innehållet: du måste ha något att säga. Ett möte där vården beskriver funktion och behov är användbart. Ett möte där vården återger patientens beskrivning av sin chef är ett partsmöte med en extra part. Lägg också märke till vad frågan gjorde med rummet. Hon frågade om ett scenario där hon är sjukskriven, och om du svarar utan att säga att det är hypotetiskt har du just bekräftat att sjukskrivningen är på väg. Svara på frågan – och säg samtidigt att den beskriver ett annat läge än det ni är i.' },

        { typ: 'val',
          humor: 'orolig',
          text: 'Och om det inte blir bättre? Om jag går så här ända till jul?',
          fraga: 'Vad svarar du?',
          tips: 'Ett nej som öppnar en dörr måste säga när dörren gäller. "Hör av dig om det blir värre" är inte ett kriterium – det är ett ord var och en tolkar själv.',
          val: [
            { text: 'Då vill jag att du hör av dig, och jag ska vara konkret om vad jag menar. Inte "om det blir värre" – utan: om du börjar sova dåligt, om du slutar springa, om söndagskvällarna blir outhärdliga, eller om du märker att du inte kommer igång ens när du varit ledig en vecka. Då är det något annat än en dålig arbetsplats och då är det vår fråga. Och skulle det någon gång kännas som att du inte orkar leva ringer du samma dag.',
              tid: 4, ok: true, princip: 'dorr',
              humor: 'neutral', reaktion: 'Miriam skriver ner det på baksidan av pärmen.',
              svar: 'Sömnen, löpningen, söndagarna. Okej. Det kan jag hålla koll på.',
              fx: { tydlighet: 18, agens: 12, sakerhet: 12, allians: 8 },
              varfor: 'Fyra namngivna tecken hon själv kan avläsa, plus ett som inte tål väntan. Det är skillnaden mellan att avvakta och att missa något: du avvaktar med ett kriterium, inte med en förhoppning. Kriterierna är dessutom valda så att de fångar just det som skulle förändra bedömningen – att besvären följer med hem och överlever ledigheten. Och lägg märke till att hon skriver ner dem. Det är hon som blir sin egen uppföljning, vilket är den enda uppföljning som finns när det inte finns något ärende.' },

            { text: 'Jag ringer dig om en månad och hör hur det gått.',
              tid: 2, ok: 'delvis', princip: 'uppfoljning',
              humor: 'lattad', reaktion: 'Miriam ser lättad ut. "Skönt att någon hör av sig."',
              svar: 'Skönt. Då vet jag att någon hör av sig i alla fall.',
              fx: { allians: 12, tydlighet: 4, agens: -8 },
              varfor: 'Genuint försvarbart, och det är därför det är svårt. Utfrysning och kränkande särbehandling är kända riskfaktorer, och ett samtal om en månad fångar upp den som annars aldrig hör av sig – de som fastnar är nästan alltid de som inte hörde av sig. Priset är två saker: du gör henne till ett ärende hos dig utan sjukfall, och du flyttar initiativet från henne till dig i just det ögonblick hela poängen är att hon ska agera. Värt att diskutera i gruppen: ringer ni uppföljande samtal till patienter som inte har ett sjukfall, och vems tid är det?' },

            { text: 'Håller det i sig till jul får vi nog titta på en sjukskrivning ändå. Ingen orkar hur länge som helst.',
              tid: 2, ok: false, princip: 'sjukdomskrav',
              humor: 'lattad', reaktion: 'Miriam slappnar av i axlarna för första gången.',
              svar: 'Okej. Då vet jag att det finns en gräns i alla fall.',
              fx: { allians: 14, agens: -18, tydlighet: -16, underlag: -10 },
              varfor: 'Rummets snällaste mening och besökets dyraste. Du har gjort sjukskrivning till belöningen för att ingenting händer, i ett ärende där det saknas sjukdom och där du inte ens är den som beslutar. Från och med nu har Miriam ett datum att härda ut till och ett skäl att inte ringa skyddsombudet – för blir det värre går det ju att lösa här. Och den dag hon kommer tillbaka i december är det någon annan som ska säga nej till ett löfte du gav.' },

            { text: 'Det vet vi inte idag. Vi får ta det när det händer.',
              tid: 1, ok: false, princip: 'forvantan',
              humor: 'sluten', reaktion: 'Miriam stänger pärmen.',
              svar: 'Mm.',
              fx: { tydlighet: -12, allians: -8, agens: -6 },
              varfor: 'Sant och oanvändbart. Hon frågade efter en gräns och fick veta att det inte finns någon. Det som återstår för henne är att gissa var gränsen går, och de flesta gissar för sent.' }
          ] },

        { typ: 'beslut',
          banner: 'AVSLUT',
          fraga: 'Hur avslutar du?',
          tips: 'Alla besök ska inte bli ett ärende. Men inget besök får sluta tomt.',
          val: [
            { text: 'Avsluta kontakten idag: sammanfatta vad du är och inte är, ge Lasse som adressat, ett första steg som är hennes, och kriterierna för när det blir vårdens fråga. Journalför besöket, beslutet och given information – inte konflikten.',
              ok: true, princip: 'ansvar', tid: 3,
              fx: { tydlighet: 16, agens: 14, sakerhet: 10 },
              utfall: 'Miriam pratar med Lasse på fredagen. Tre veckor senare ligger en skriftlig begäran om åtgärder hos förvaltningen. I journalen står vad hon sökt för, vilket besked hon fått och när hon ska höra av sig – ingenting om chefen.',
              varfor: 'Det här är fallet där rehabkoordinatorn gör mest nytta genom att inte öppna ett ärende. Miriam går härifrån med tre saker hon inte hade när hon kom: besked om varför det hon beskriver inte är något vården kan sjukskriva för, namnet på den som är skyldig att svara henne, och fyra tecken att bevaka. Att avsluta är ett beslut och ska dokumenteras som ett – vad hon sökte för, vad du beslutat och varför, och vad hon fått för information. Att det tog tjugo minuter i stället för ett halvårs ärende är inte snålhet; det är att tiden fortsätter tillhöra dem du har en skyldighet mot.' },

            { text: 'Avsluta med besked och hänvisning, och boka samtidigt ett kort uppföljande telefonsamtal om en månad.',
              ok: 'delvis', princip: 'uppfoljning', tid: 3,
              fx: { tydlighet: 8, allians: 8, agens: -6 },
              utfall: 'Miriam väntar in ditt samtal innan hon gör något. Skyddsombudet kontaktas först i november.',
              varfor: 'Omtänksamt, försvarbart och priset syns först i utfallet: så länge vården håller i tråden är det vården hon väntar på. Gör ni det ändå – och det finns goda skäl – säg då uttryckligen att samtalet inte ersätter hennes egna steg, och inled samtalet med vad hon gjort, inte med hur hon mår. Värt att diskutera i gruppen: vem betalar den tiden, och vilken sjukskriven patient fick vänta för den?' },

            { text: 'Öppna ett koordineringsärende: samtyckesblankett, rehabplan och kallelse till avstämningsmöte med arbetsgivaren.',
              ok: false, princip: 'plan', tid: 4,
              fx: { tydlighet: -12, sakerhet: -16, agens: -10 },
              utfall: 'Arbetsgivaren svarar inte. Vid tredje besöket säger Miriam att hon nog måste bli sjukskriven för att någon ska ta det på allvar.',
              varfor: 'Varje enskilt verktyg är rätt verktyg – i ett sjukfall. Här finns inget sjukfall, ingen plan att skriva och ingen sjukskrivning att koordinera mot, och till ett avstämningsmöte kallar Försäkringskassan i ett pågående ärende; det är inget forum för en arbetsplatskonflikt. Det du byggt är en vårdapparat runt en arbetsmiljöfråga, och den lär Miriam en sak med stor precision: vägen till att bli tagen på allvar går genom att bli sjukare.' },

            { text: 'Skicka tillbaka ärendet till triagen med noteringen att patienten är felbokad.',

          ] }

  LESS.lastaFall = function (roll) {
    return (LESS.fall[roll] || []).filter(function (f) { return !!f.laser; });

/* ==== js/plansch.js ==== */
/* plansch.js – frågeplanscherna på väggen i varje professions rum.

   Rådgivaragenterna skattar hur vanligt förekommande deras antaganden om
   klinisk vardag är, på en kvotskala 0–100. Här skattar verklig personal samma
   fråga. Skillnaden mellan gissningen och verkligheten är hela poängen, så
   ingenting här är rätt eller fel – det är datainsamling, inte en övning.   */

(function (global) {
  'use strict';
  var LESS = global.LESS, ui = LESS.ui, $ = LESS.$;

  var STEG_GROVT = 5, STEG_FINT = 1;

  /* ---------------- delad insamling ----------------
     Publicerad som artefakt får sidan en delad databas, så att kollegor på
     andra datorer kan skatta samma frågor och svaren når utvecklaren. Som
     lokal fil eller på GitHub Pages finns ingen sådan – då sparas svaren i
     webbläsaren och skickas in med kopiera-och-klistra i stället.        */

  var db = null, dbKlar = false, andraCache = {};

  function deltagarId() {
    try {
      var id = global.localStorage.getItem('less-deltagare');
      if (!id) {
        id = 'd' + Math.random().toString(36).slice(2, 10);
        global.localStorage.setItem('less-deltagare', id);
      }
      return id;
    } catch (e) { return 'd-anonym'; }
  }

  /* ---------------- signatur ----------------
     Den som skattar får skriva sitt namn. Poängen är spårbarhet framåt: när
     svaren senare går igenom och innehållet ändras ska det gå att se vem som
     stod bakom siffran och fråga vidare. Frivilligt – tomt namn är giltigt. */

  function mittNamn() {
    var n = LESS.state.data.namn;
    if (n) return n;
    try { return global.localStorage.getItem('less-namn') || ''; } catch (e) { return ''; }
  }

  function sparaNamn(n) {
    n = (n || '').trim().slice(0, 60);
    LESS.state.data.namn = n;
    LESS.state.spara();
    try { global.localStorage.setItem('less-namn', n); } catch (e) { /* tyst */ }
    return n;
  }

  function kopplaDb() {
    if (dbKlar) return Promise.resolve(db);
    if (!global.claude || typeof global.claude.use !== 'function') {
      dbKlar = true;
      return Promise.resolve(null);
    }
    return global.claude.use('db').then(function (d) {
      db = d; dbKlar = true; return d;
    }, function () { dbKlar = true; return null; });
  }
  kopplaDb();

  function delaSkattning(roll, f, varde) {
    if (!db) return;
    try {
      db.doc('skattningar/' + f.id + '__' + deltagarId()).set({
        fragaId: f.id,
        roll: roll,
        varde: varde,
        radgivare: f.skattning == null ? null : f.skattning,
        deltagare: deltagarId(),
        signatur: mittNamn() || null,
        tid: new Date().toISOString()
      }).then(null, function () { /* lokalt sparat räcker */ });
    } catch (e) { /* tyst */ }
  }

  /* Andras svar per fråga: antal och median. */
  function hamtaAndra(roll) {
    if (!db) return Promise.resolve({});
    return db.collection('skattningar').where('roll', '==', roll).get().then(function (snap) {
      var per = {};
      snap.docs.forEach(function (d) {
        var v = d.data() || {};
        if (typeof v.varde !== 'number' || !v.fragaId) return;
        (per[v.fragaId] = per[v.fragaId] || []).push(v.varde);
      });
      var ut = {};
      Object.keys(per).forEach(function (id) {
        var a = per[id].slice().sort(function (x, y) { return x - y; });
        var m = a.length % 2 ? a[(a.length - 1) / 2] : Math.round((a[a.length / 2 - 1] + a[a.length / 2]) / 2);
        ut[id] = { n: a.length, median: m };
      });
      return ut;
    }, function () { return {}; });
  }

  function rollNamn(roll) {
    var r = LESS.roller[roll];
    return r ? r.namn : roll.toUpperCase();
  }

  /* ---------------- små byggstenar ---------------- */

  function stapel(varde, klass) {
    if (varde == null) return '<span class="ingen">–</span>';
    return '<span class="skb ' + (klass || '') + '"><i style="width:' + varde + '%"></i></span>' +
           '<span class="skv">' + varde + '</span>';
  }

  function ankartext(varde) {
    if (varde == null) return '';
    var a = LESS.fragorAnkare, i, bast = a[0];
    for (i = 0; i < a.length; i++) if (Math.abs(a[i][0] - varde) < Math.abs(bast[0] - varde)) bast = a[i];
    return bast[1];
  }

  /* ---------------- listvyn ---------------- */

  function visa(roll, klar) {
    var fragor = (LESS.fragor && LESS.fragor[roll]) || [];
    var andra = andraCache[roll] || {};
    var sel = 0;
    var handler = null;

    /* Signaturen ligger överst: den som skattar ska se direkt vem svaren
       kommer att stå på, och kunna ändra det innan hen sätter en siffra. */
    var poster = [{ typ: 'signatur' }]
      .concat(fragor.map(function (f) { return { typ: 'fraga', f: f }; }))
      .concat([{ typ: 'export' }, { typ: 'stang' }]);

    function rita() {
      var h = '';
      h += '<p class="planschintro">Rådgivaren har gissat hur vanligt det här är i verkligheten. ' +
           'Sätt din egen siffra bredvid. Inget är rätt eller fel – det är din vardag som är facit.</p>';
      h += '<p class="planschintro lagring">' + (db
        ? '● Svaren delas automatiskt. Kollegor på andra datorer kan skatta samma frågor.'
        : '○ Svaren sparas bara i den här webbläsaren. Välj “Visa mina svar att skicka in” när du är klar.') + '</p>';

      poster.forEach(function (post, i) {
        var vald = i === sel ? ' sel' : '';
        if (post.typ === 'signatur') {
          var n = mittNamn();
          h += '<div class="fraga knapp signatur' + vald + '" id="frg' + i + '">' +
               '<span class="cur">▶</span>' +
               '<span class="ft">Signatur: ' + (n ? '<b>' + LESS.esc(n) + '</b>' : '<i>ej ifylld</i>') + '</span>' +
               '<span class="rad"><span class="ank">' +
               (n ? 'Dina skattningar skickas med ditt namn.'
                  : 'Frivilligt. Med namn går det att fråga dig vidare om siffran.') +
               '</span></span></div>';
          return;
        }
        if (post.typ === 'export') {
          h += '<div class="fraga knapp' + vald + '" id="frg' + i + '">' +
               '<span class="cur">▶</span><span class="ft">Visa mina svar att skicka in</span></div>';
          return;
        }
        if (post.typ === 'stang') {
          h += '<div class="fraga knapp' + vald + '" id="frg' + i + '">' +
               '<span class="cur">▶</span><span class="ft">Tillbaka</span></div>';
          return;
        }
        var f = post.f, min = LESS.state.minSkattning(f.id);
        h += '<div class="fraga' + vald + '" id="frg' + i + '">' +
             '<span class="cur">▶</span>' +
             '<span class="ft">' + LESS.esc(f.fraga) + '</span>' +
             '<span class="rad"><b>rådgivaren</b>' + stapel(f.skattning, 'radg') +
               (f.skattning != null ? '<span class="ank">' + LESS.esc(ankartext(f.skattning)) + '</span>' : '') +
             '</span>' +
             '<span class="rad"><b>du</b>' + stapel(min ? min.varde : null, 'du') +
               (min ? '<span class="ank">' + LESS.esc(ankartext(min.varde)) + '</span>' : '') +
             '</span>' +
             (andra[f.id]
               ? '<span class="rad"><b>andra (' + andra[f.id].n + ')</b>' +
                 stapel(andra[f.id].median, 'andra') + '<span class="ank">median</span></span>'
               : '') +
             '</div>';
      });

      if (!fragor.length) h += '<p>Inga frågor uppsatta för den här rollen ännu.</p>';

      ui.visaPanel('FRÅGOR · ' + rollNamn(roll), h, '↑↓ = välj  ·  A = skatta  ·  B = tillbaka');
      ui.panelSynlig($('frg' + sel));
    }

    function stang() {
      LESS.input.pop(handler);
      ui.doljPanel();
      if (klar) klar();
    }

    function oppna() {
      rita();
      /* Hämta andras svar i bakgrunden och rita om när de kommit. */
      kopplaDb().then(function () {
        if (!db) return;
        hamtaAndra(roll).then(function (res) {
          andraCache[roll] = res; andra = res;
          if (LESS.input.top() === handler) rita();
        });
      });
      handler = LESS.input.push(function (k) {
        var n = poster.length;
        if (k === 'down') { sel = (sel + 1) % n; LESS.sfx('move'); rita(); }
        else if (k === 'up') { sel = (sel - 1 + n) % n; LESS.sfx('move'); rita(); }
        else if (k === 'a') {
          LESS.sfx('ok');
          var post = poster[sel];
          if (post.typ === 'fraga') { LESS.input.pop(handler); skatta(roll, post.f, oppna); }
          else if (post.typ === 'signatur') { LESS.input.pop(handler); signera(roll, oppna); }
          else if (post.typ === 'export') { LESS.input.pop(handler); exportera(roll, oppna); }
          else stang();
        }
        else if (k === 'b') { LESS.sfx('back'); stang(); }
      });
    }
    oppna();
  }

  /* ---------------- signaturvyn ----------------
     Ett riktigt textfält, inte en teckenväljare: den som står i sitt eget
     arbetsrum har ett tangentbord framför sig. Medan fältet har fokus tar
     ui.js bort spelets tangentbindningar, annars äter styrningen bokstäverna. */

  function signera(roll, klar) {
    var h = '';
    h += '<p class="planschintro">Skriv ditt namn om du vill att svaren ska gå att följa upp. ' +
         'Det följer med varje skattning du gör härifrån och framåt.</p>';
    h += '<p class="planschintro">Vill du vara anonym lämnar du fältet tomt. ' +
         'Skattningen räknas lika mycket ändå.</p>';
    ui.textInmatning({
      titel: 'SIGNATUR · ' + rollNamn(roll),
      html: h,
      varde: mittNamn(),
      platshallare: 'Förnamn Efternamn'
    }, function (varde) {
      if (varde !== null) sparaNamn(varde);
      if (klar) klar();
    });
  }

  /* ---------------- skattningsvyn ---------------- */

  function skatta(roll, f, klar) {
    var min = LESS.state.minSkattning(f.id);
    var varde = min ? min.varde : (f.skattning != null ? f.skattning : 50);
    var handler = null;

    function rita() {
      var h = '';
      h += '<p class="planschfraga">' + LESS.esc(f.fraga) + '</p>';
      if (f.bakgrund) h += '<p class="planschbak">' + LESS.esc(f.bakgrund) + '</p>';

      h += '<div class="skalabox">';
      h += '<div class="skalatal">' + varde + '<span> av 100</span></div>';
      h += '<div class="skala"><i style="width:' + varde + '%"></i>';
      LESS.fragorAnkare.forEach(function (a) {
        h += '<u style="left:' + a[0] + '%"></u>';
      });
      if (f.skattning != null) h += '<b class="radgmark" style="left:' + f.skattning + '%"></b>';
      h += '</div>';
      h += '<div class="skalaank">';
      LESS.fragorAnkare.forEach(function (a) {
        h += '<span>' + a[0] + '<br>' + LESS.esc(a[1]) + '</span>';
      });
      h += '</div>';
      h += '<p class="planschank">Din bedömning: <b>' + LESS.esc(ankartext(varde)) + '</b></p>';
      h += '</div>';

      if (f.skattning != null) {
        h += '<p class="planschradg"><b>Rådgivarens gissning: ' + f.skattning + '</b>' +
             (f.sakerhet ? ' (säkerhet: ' + LESS.esc(f.sakerhet) + ')' : '') +
             (f.motivering ? '<br>' + LESS.esc(f.motivering) : '') + '</p>';
      } else {
        h += '<p class="planschradg">Rådgivaren har inte skattat den här frågan ännu.</p>';
      }

      if (f.berorFall && f.berorFall.length) {
        h += '<p class="planschbak">Påverkar fallen: ' + LESS.esc(f.berorFall.join(', ')) + '</p>';
      }

      ui.visaPanel('SKATTA · ' + rollNamn(roll), h,
        '←→ = ±5  ·  ↑↓ = ±1  ·  A = spara  ·  B = avbryt');
    }

    function stang(sparat) {
      LESS.input.pop(handler);
      if (sparat) { LESS.sfx('done'); } else { LESS.sfx('back'); }
      if (klar) klar();
    }

    rita();
    handler = LESS.input.push(function (k) {
      if (k === 'left') { varde = LESS.clamp(varde - STEG_GROVT, 0, 100); LESS.sfx('move'); rita(); }
      else if (k === 'right') { varde = LESS.clamp(varde + STEG_GROVT, 0, 100); LESS.sfx('move'); rita(); }
      else if (k === 'down') { varde = LESS.clamp(varde - STEG_FINT, 0, 100); rita(); }
      else if (k === 'up') { varde = LESS.clamp(varde + STEG_FINT, 0, 100); rita(); }
      else if (k === 'a') {
        LESS.state.skatta(f.id, varde);
        delaSkattning(roll, f, varde);
        delete andraCache[roll];

      }

    });
  }

  function rapport(roll) {
    var fragor = (LESS.fragor && LESS.fragor[roll]) || [];
    var rader = ['LESS – Vårdcentralen · skattningar', rollNamn(roll),
                 new Date().toISOString().slice(0, 10),
                 'signatur: ' + (mittNamn() || '– ej ifylld –'), ''];
    var n = 0;
    fragor.forEach(function (f) {
      var min = LESS.state.minSkattning(f.id);
      if (!min) return;
      n++;
      rader.push(f.id);
      rader.push('  ' + f.fraga);
      rader.push('  rådgivaren: ' + (f.skattning == null ? '–' : f.skattning) +
                 '   du: ' + min.varde + '   (' + ankartext(min.varde) + ')');
      rader.push('');
    });
    if (!n) rader.push('Inga skattningar gjorda ännu.');
    return rader.join('\n');
  }

  function exportera(roll, klar) {
    var text = rapport(roll);
    var handler = null;
    var kopierat = false;

    function rita() {
      var h = '<p class="planschintro">' + (db
                ? 'Dina svar är redan delade. Den här texten är en kopia du kan spara eller skicka vidare.'
                : 'Markera texten och kopiera den, eller tryck A för att kopiera automatiskt. ' +
                  'Skicka den till den som bygger spelet.') + '</p>' +
              '<pre class="rapport">' + LESS.esc(text) + '</pre>' +
              (kopierat ? '<p class="planschank"><b>Kopierat till urklipp.</b></p>' : '');
      ui.visaPanel('DINA SVAR · ' + rollNamn(roll), h, 'A = kopiera  ·  B = tillbaka');
    }

    rita();
    handler = LESS.input.push(function (k) {
      if (k === 'down') ui.panelScroll(30);
      else if (k === 'up') ui.panelScroll(-30);
      else if (k === 'a') {
        if (global.navigator && navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () {
            kopierat = true; LESS.sfx('ok'); rita();
          }, function () { LESS.sfx('wrong'); });
        } else LESS.sfx('wrong');
      }
      else if (k === 'b') { LESS.sfx('back'); LESS.input.pop(handler); if (klar) klar(); }
    });
