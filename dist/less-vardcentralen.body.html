<title>LESS – Vårdcentralen</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23f8f8e8'/%3E%3Crect x='6' y='2' width='4' height='12' fill='%23c04838'/%3E%3Crect x='2' y='6' width='12' height='4' fill='%23c04838'/%3E%3C/svg%3E">
<style>
/* =========================================================
   LESS – Vårdcentralen
   Estetik: Pokémon Guld/Silver (Game Boy Color)
   Logisk skärm: 320x288 (= GBC 160x144 x2). Allt skalas med
   heltalsfaktor så pixlarna förblir kvadratiska.
   ========================================================= */

:root{
  /* GBC-inspirerad grundpalett */
  --ink:      #10100c;   /* svart ram och text            */
  --paper:    #f8f8e8;   /* ljus textrutebakgrund         */
  --paper-sh: #c8c8a8;   /* skugga i textruta             */
  --gold:     #e8a028;   /* accent (GULD)                 */
  --silver:   #a8b0c0;   /* accent (SILVER)               */
  --bronze:   #b87038;   /* accent (BRONS)                */
  --good:     #38803f;   /* grön                          */
  --warn:     #b83820;   /* röd                           */
  --info:     #3858a0;   /* blå                           */
  --shell:    #2a2a34;   /* konsolens plastram            */
  --shell-2:  #1a1a22;
  --screen-bg:#8ab060;
}

*{ box-sizing:border-box; }

html,body{
  margin:0; padding:0; height:100%;
  background:#0c0c10;
  overflow:hidden;
  -webkit-text-size-adjust:100%;
  overscroll-behavior:none;
  touch-action:manipulation;
}

body{
  display:flex; align-items:center; justify-content:center;
  font-family:"Silkscreen","Press Start 2P",ui-monospace,"DejaVu Sans Mono","Courier New",monospace;
  color:var(--ink);
  user-select:none; -webkit-user-select:none;
}

#frame{
  display:flex; flex-direction:column; align-items:center; gap:10px;
}

/* ---------- Skärmen ---------- */

#stage{
  position:relative;
  width:320px; height:288px;
  transform-origin:top center;
  background:var(--screen-bg);
  box-shadow:0 0 0 6px var(--shell), 0 0 0 8px var(--shell-2), 0 10px 30px rgba(0,0,0,.6);
  overflow:hidden;
}

#screen{
  position:absolute; inset:0;
  width:320px; height:288px;
  image-rendering:pixelated;
  image-rendering:crisp-edges;
  display:block;
}

#ui{ position:absolute; inset:0; }

.hidden{ display:none !important; }

/* ---------- Game Boy-textruta ---------- */

.gbbox{
  position:absolute;
  background:var(--paper);
  color:var(--ink);
  border:2px solid var(--ink);
  border-radius:4px;
  box-shadow:inset 0 0 0 2px var(--paper), inset 0 0 0 3px var(--ink);
  padding:8px 9px;
  line-height:1.35;
  font-size:10px;
  letter-spacing:.2px;
}

#dialog{
  left:8px; right:8px; bottom:8px;
  min-height:62px;
}
/* Frågeläge: rutan flyttar upp så att valmenyn får plats under */
#dialog.fraga{
  top:116px; bottom:auto; min-height:0;
  font-size:9.5px;
  max-height:52px; overflow:hidden;
}
#dialog p{ margin:0; white-space:pre-wrap; }
#dialog-more{
  position:absolute; right:8px; bottom:5px;
  animation:blink .7s steps(1) infinite;
  font-size:9px;
}
@keyframes blink{ 50%{ opacity:0; } }

/* Talarnamn ovanför rutan */
.speaker{
  display:block;
  font-size:9px;
  color:var(--info);
  margin:0 0 3px;
  letter-spacing:.5px;
}
.speaker.pat{ color:var(--warn); }
.speaker.you{ color:var(--good); }

/* ---------- Valmeny ---------- */

#menu{
  left:8px; right:8px;
  bottom:8px;
  max-height:170px;
  overflow-y:auto;
  padding:6px 6px 6px 4px;
  scrollbar-width:none;
}
#menu::-webkit-scrollbar{ display:none; }
#menu.val{ top:172px; bottom:8px; max-height:none; }
#menu.compact{ left:auto; right:8px; width:132px; }

.opt{
  display:flex; align-items:flex-start; gap:4px;
  padding:2px 2px 3px 10px;
  position:relative;
  font-size:10px;
  line-height:1.3;
  scroll-margin:6px;
}
#menu.val .opt{ font-size:9px; line-height:1.35; }
.opt .cur{ position:absolute; left:1px; top:2px; opacity:0; }
.opt.sel .cur{ opacity:1; }
.opt.sel{ background:#e0e0c0; border-radius:2px; }
.opt .txt{ flex:1; }
.opt .cost{
  font-size:9px; color:#606050; white-space:nowrap; padding-top:1px;
}
.opt.used .txt{ color:#909080; text-decoration:line-through; }

#menu .hint{
  font-size:9px; color:#606050; padding:3px 2px 0 10px; border-top:1px dotted #b0b090; margin-top:3px;
}

/* ---------- HUD ---------- */

#hud{
  position:absolute; left:8px; right:8px; top:6px;
  display:flex; align-items:center; justify-content:space-between;
  gap:6px;
  font-size:9px;
}
#hud-name{
  background:var(--paper); border:2px solid var(--ink); border-radius:3px;
  padding:2px 5px; letter-spacing:.4px;
}
#hud-clock{
  background:var(--paper); border:2px solid var(--ink); border-radius:3px;
  padding:2px 5px; display:flex; align-items:center; gap:4px;
}
#hud-bar{
  width:52px; height:6px; background:#606050; border:1px solid var(--ink);
}
#hud-bar-fill{
  display:block; height:100%; width:100%; background:var(--good);
  transition:width .25s steps(6);
}
#hud-bar-fill.mid{ background:var(--gold); }
#hud-bar-fill.low{ background:var(--warn); }
#hud.warn #hud-clock{ animation:blink .5s steps(1) 4; }

/* ---------- Världsrad ---------- */

#worldbar{
  position:absolute; left:6px; right:6px; top:6px;
  display:flex; align-items:flex-start; justify-content:space-between; gap:6px;
  font-size:9px; pointer-events:none;
}
#roomlabel{
  background:var(--paper); border:2px solid var(--ink); border-radius:3px;
  padding:2px 5px; letter-spacing:.6px; white-space:nowrap;
}
#objective{
  background:var(--ink); color:var(--paper); border:2px solid var(--paper);
  border-radius:3px; padding:2px 5px; max-width:190px; line-height:1.3;
}
#objective:empty{ display:none; }

/* ---------- Banner ---------- */

#banner{
  position:absolute; left:0; right:0; top:44px;
  text-align:center; font-size:10px; letter-spacing:1px;
  color:var(--paper);
  background:var(--ink);
  padding:3px 0;
  border-top:2px solid var(--paper); border-bottom:2px solid var(--paper);
}

/* ---------- Reaktionssignal ---------- */

#cue{
  position:absolute; left:0; right:0; top:96px;
  text-align:center; font-size:10px;
  color:var(--paper); text-shadow:1px 1px 0 var(--ink);
  animation:cuepop .9s ease-out forwards;
  pointer-events:none;
}
@keyframes cuepop{
  0%{ transform:translateY(6px); opacity:0; }
  20%{ transform:translateY(0); opacity:1; }
  80%{ opacity:1; }
  100%{ transform:translateY(-8px); opacity:0; }
}

/* ---------- Panel (journal / handbok / meny) ---------- */

#panel{ position:absolute; inset:0; background:rgba(16,16,12,.55); }
#panel-box{
  position:absolute; left:8px; right:8px; top:10px; bottom:10px;
  overflow:hidden; display:flex; flex-direction:column;
}
#panel-title{
  margin:0 0 5px; font-size:11px; letter-spacing:1px;
  border-bottom:2px solid var(--ink); padding-bottom:3px;
}
#panel-body{ flex:1; overflow-y:auto; font-size:10px; line-height:1.45; padding-right:2px; }
#panel-body h3{ font-size:10px; margin:8px 0 2px; color:var(--info); letter-spacing:.5px; }
#panel-body p{ margin:0 0 5px; }
#panel-body ul{ margin:0 0 6px; padding-left:14px; }
#panel-body li{ margin-bottom:2px; }
#panel-body .kv{ display:flex; gap:6px; margin-bottom:2px; }
#panel-body .kv b{ min-width:76px; font-weight:normal; color:#606050; }
.panel-foot{ font-size:9px; color:#606050; padding-top:4px; border-top:1px dotted #b0b090; margin-top:4px; }

/* ---------- Debrief ---------- */

#debrief{ position:absolute; inset:0; background:var(--paper); display:flex; flex-direction:column; }
#debrief-box{ flex:1; overflow-y:auto; padding:8px 9px 4px; font-size:10px; line-height:1.45; }
#debrief-foot{
  font-size:9px; color:#606050; padding:4px 9px 6px; border-top:2px solid var(--ink);
  background:var(--paper);
}

.d-grade{
  text-align:center; border:2px solid var(--ink); border-radius:4px;
  padding:6px 4px; margin-bottom:8px;
}
.d-grade .g{ display:block; font-size:20px; letter-spacing:3px; margin-bottom:2px; }
.d-grade .s{ display:block; font-size:9px; color:#404038; }
.d-grade.guld{ background:#fff0c8; } .d-grade.guld .g{ color:#a06c00; }
.d-grade.silver{ background:#eef0f4; } .d-grade.silver .g{ color:#606878; }
.d-grade.brons{ background:#f4e4d4; } .d-grade.brons .g{ color:#8a4c1c; }
.d-grade.omtag{ background:#f6dcd6; } .d-grade.omtag .g{ color:var(--warn); font-size:15px; }

.d-h{ font-size:10px; letter-spacing:1px; border-bottom:2px solid var(--ink); margin:10px 0 5px; padding-bottom:2px; }

.d-row{ margin-bottom:7px; padding-left:13px; position:relative; }
.d-row .mark{ position:absolute; left:0; top:0; font-size:11px; }
.d-row.ok .mark{ color:var(--good); }
.d-row.bad .mark{ color:var(--warn); }
.d-row.mid .mark{ color:var(--gold); }
.d-row .said{ display:block; color:#404038; margin-bottom:1px; }
.d-row .why{ display:block; color:#20201c; }
.d-row .tag{
  display:inline-block; font-size:8px; letter-spacing:.5px;
  border:1px solid #909080; border-radius:2px; padding:0 3px; margin-top:2px; color:#606050;
}

.meter{ display:flex; align-items:center; gap:5px; margin-bottom:3px; font-size:9px; }
.meter .mn{ width:96px; color:#404038; }
.meter .mb{ flex:1; height:7px; background:#d8d8c0; border:1px solid var(--ink); position:relative; }
.meter .mb i{ display:block; height:100%; background:var(--good); }
.meter .mb i.lowv{ background:var(--warn); }
.meter .mb i.midv{ background:var(--gold); }
.meter .mv{ width:26px; text-align:right; color:#606050; }

.d-note{
  border:2px solid var(--ink); border-radius:3px; background:#eef4ea;
  padding:5px 6px; margin:8px 0; font-size:9px; line-height:1.5;
}
.d-note b{ display:block; margin-bottom:2px; letter-spacing:.5px; }
.d-note.warnbox{ background:#f8e8e2; }

/* ---------- Titelskärm ---------- */

#title{ position:absolute; inset:0; display:flex; flex-direction:column;
        align-items:center; justify-content:flex-start; padding-top:16px; gap:6px; }
#title-logo{ text-align:center; }
.t-less{
  display:block; font-size:44px; letter-spacing:6px; color:#f8e070;
  text-shadow:2px 2px 0 #a06010, 4px 4px 0 var(--ink);
}
.t-sub{
  display:block; font-size:11px; letter-spacing:4px; color:var(--paper);
  text-shadow:2px 2px 0 var(--ink); margin-top:2px;
}
#title-press{
  margin-top:150px; font-size:10px; letter-spacing:2px; color:var(--paper);
  text-shadow:1px 1px 0 var(--ink); animation:blink 1s steps(1) infinite;
}
#title-foot{
  position:absolute; bottom:8px; font-size:8px; letter-spacing:1px;
  color:var(--paper); text-shadow:1px 1px 0 var(--ink); opacity:.85;
}

/* ---------- Fade ---------- */

#fade{
  position:absolute; inset:0; background:var(--ink);
  opacity:0; pointer-events:none; transition:opacity .18s steps(4);
}
#fade.on{ opacity:1; }

/* ---------- Pekkontroller ---------- */

#pad{ display:none; width:min(420px,96vw); }
body.touch #pad{
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-areas:"dpad btns" "sys sys";
  gap:8px; align-items:center;
}
#dpad{ grid-area:dpad; display:grid; grid-template-columns:repeat(3,38px);
       grid-template-rows:repeat(3,38px); justify-content:center; }
#dpad .pb:nth-child(1){ grid-column:2; grid-row:1; }
#dpad .pb:nth-child(2){ grid-column:1; grid-row:2; }
#dpad .pb:nth-child(3){ grid-column:3; grid-row:2; }
#dpad .pb:nth-child(4){ grid-column:2; grid-row:3; }
#btns{ grid-area:btns; display:flex; gap:12px; justify-content:center; align-items:center; }
#sysbtns{ grid-area:sys; display:flex; gap:10px; justify-content:center; }
.pb{
  background:#3a3a48; color:#e8e8d8; border:2px solid #14141c; border-radius:6px;
  font:inherit; font-size:12px; padding:0; cursor:pointer;
}
.pb.round{ width:52px; height:52px; border-radius:50%; font-size:16px; background:#8a3040; }
.pb.wide{ padding:7px 14px; font-size:10px; letter-spacing:1px; }
.pb:active{ transform:translateY(1px); filter:brightness(1.25); }

/* ---------- Tillgänglighet ---------- */

@media (prefers-reduced-motion:reduce){
  #dialog-more,#title-press,#hud.warn #hud-clock{ animation:none; }
  #cue{ animation:none; }
  #fade{ transition:none; }
}

</style>


<div id="frame">
  <div id="stage">
    <canvas id="screen" width="160" height="144"></canvas>

    <div id="ui">

      <!-- Rumsetikett och uppdrag: syns i vårdcentralen -->
      <div id="worldbar" class="hidden">
        <div id="roomlabel">KORRIDOR</div>
        <div id="objective"></div>
      </div>

      <!-- HUD: syns under möten -->
      <div id="hud" class="hidden">
        <div id="hud-name">PATIENT</div>
        <div id="hud-clock">
          <span id="hud-clock-label">20:00</span>
          <div id="hud-bar"><i id="hud-bar-fill"></i></div>
        </div>
      </div>

      <!-- Dialogruta -->
      <div id="dialog" class="gbbox hidden">
        <p id="dialog-text"></p>
        <span id="dialog-more" class="hidden">▼</span>
      </div>

      <!-- Menyval -->
      <div id="menu" class="gbbox hidden"></div>

      <!-- Hörnbanner (t.ex. "FAKTAKONTROLL") -->
      <div id="banner" class="hidden"></div>

      <!-- Flyktig reaktionssignal -->
      <div id="cue" class="hidden"></div>

      <!-- Overlay-panel: journal, handbok, meny -->
      <div id="panel" class="hidden">
        <div id="panel-box" class="gbbox">
          <h2 id="panel-title">JOURNAL</h2>
          <div id="panel-body"></div>
          <div class="panel-foot">B / X = tillbaka</div>
        </div>
      </div>

      <!-- Debrief / handledarens återkoppling -->
      <div id="debrief" class="hidden">
        <div id="debrief-box">
          <div id="debrief-body"></div>
        </div>
        <div id="debrief-foot">A = fortsätt &nbsp;·&nbsp; ↑↓ = bläddra</div>
      </div>

      <!-- Titelskärm -->
      <div id="title" class="hidden">
        <div id="title-logo">
          <span class="t-less">LESS</span>
          <span class="t-sub">VÅRDCENTRALEN</span>
        </div>
        <div id="title-press">TRYCK PÅ START</div>
        <div id="title-foot">ETT LÄROMEDEL OM SJUKSKRIVNING</div>
      </div>

      <!-- Fade -->
      <div id="fade"></div>
    </div>
  </div>

  <!-- Pekkontroller för mobil -->
  <div id="pad" aria-hidden="true">
    <div id="dpad">
      <button class="pb" data-key="up">▲</button>
      <button class="pb" data-key="left">◀</button>
      <button class="pb" data-key="right">▶</button>
      <button class="pb" data-key="down">▼</button>
    </div>
    <div id="btns">
      <button class="pb round" data-key="b">B</button>
      <button class="pb round" data-key="a">A</button>
    </div>
    <div id="sysbtns">
      <button class="pb wide" data-key="journal">JOURNAL</button>
      <button class="pb wide" data-key="handbok">HANDBOK</button>
      <button class="pb wide" data-key="meny">MENY</button>
    </div>
  </div>
</div>
<script>
/* ==== js/util.js ==== */
/* util.js – små hjälpare och global namnrymd */
(function (global) {
  'use strict';

  var LESS = global.LESS || (global.LESS = {});

  LESS.VERSION = '1.0.0';

  /* ---------- matte ---------- */
  LESS.clamp = function (v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); };
  LESS.lerp = function (a, b, t) { return a + (b - a) * t; };

  /* Deterministisk slump (så drill-ordningen går att återskapa) */
  LESS.rng = function (seed) {
    var s = seed >>> 0 || 1;
    return function () {
      s ^= s << 13; s >>>= 0;
      s ^= s >> 17;
      s ^= s << 5; s >>>= 0;
      return s / 4294967296;
    };
  };

  LESS.shuffle = function (arr, rand) {
    var a = arr.slice(), i, j, t;
    rand = rand || Math.random;
    for (i = a.length - 1; i > 0; i--) {
      j = Math.floor(rand() * (i + 1));
      t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  };

  /* ---------- text ---------- */
  LESS.esc = function (s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  };

  /* Minuter -> "MM:SS"-liknande klocka i besökstid */
  LESS.mmss = function (minutes) {
    var m = Math.max(0, Math.floor(minutes));
    var s = Math.round((minutes - m) * 60);
    if (s >= 60) { m += 1; s = 0; }
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  };

  /* ---------- lagring ---------- */
  var KEY = 'less-vardcentralen-save-v1';

  LESS.store = {
    load: function () {
      try {
        var raw = global.localStorage.getItem(KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (e) { return null; }
    },
    save: function (obj) {
      try { global.localStorage.setItem(KEY, JSON.stringify(obj)); return true; }
      catch (e) { return false; }
    },
    clear: function () {
      try { global.localStorage.removeItem(KEY); } catch (e) { /* ignoreras */ }
    }
  };

  /* ---------- dom ---------- */
  LESS.$ = function (id) { return document.getElementById(id); };

  LESS.show = function (el, on) {
    if (typeof el === 'string') el = LESS.$(el);
    if (el) el.classList.toggle('hidden', !on);
  };

})(window);

/* ==== js/audio.js ==== */
/* audio.js – små fyrkantsvågsljud i Game Boy-anda (WebAudio, inga filer) */
(function (global) {
  'use strict';
  var LESS = global.LESS;

  var ctx = null, master = null, enabled = true;

  function ac() {
    if (ctx) return ctx;
    var C = global.AudioContext || global.webkitAudioContext;
    if (!C) return null;
    ctx = new C();
    master = ctx.createGain();
    master.gain.value = 0.09;
    master.connect(ctx.destination);
    return ctx;
  }

  /* En ton: fyrkantsvåg med hård av/på-kuvert = pulskanal-känsla */
  function tone(freq, start, dur, vol, type) {
    var c = ac(); if (!c) return;
    var o = c.createOscillator(), g = c.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, start);
    g.gain.setValueAtTime(0, start);
    g.gain.linearRampToValueAtTime(vol == null ? 1 : vol, start + 0.004);
    g.gain.setValueAtTime(vol == null ? 1 : vol, start + dur - 0.01);
    g.gain.linearRampToValueAtTime(0, start + dur);
    o.connect(g); g.connect(master);
    o.start(start); o.stop(start + dur + 0.02);
  }

  function seq(notes) {
    var c = ac(); if (!c || !enabled) return;
    if (c.state === 'suspended') c.resume();
    var t = c.currentTime + 0.01, i;
    for (i = 0; i < notes.length; i++) {
      var n = notes[i];
      if (n[0] > 0) tone(n[0], t, n[1], n[2], n[3]);
      t += n[1];
    }
  }

  var SFX = {
    /* textbokstav */
    blip:    [[880, 0.012, 0.35]],
    /* markörflytt */
    move:    [[660, 0.03, 0.5]],
    /* bekräfta */
    ok:      [[880, 0.04, 0.6], [1320, 0.06, 0.6]],
    /* tillbaka */
    back:    [[520, 0.05, 0.5], [390, 0.05, 0.5]],
    /* fel svar i faktakontroll */
    wrong:   [[220, 0.09, 0.7], [175, 0.14, 0.7]],
    /* patienten öppnar upp */
    warm:    [[660, 0.05, 0.5], [880, 0.05, 0.5], [1100, 0.09, 0.5]],
    /* patienten sluter sig */
    cold:    [[440, 0.06, 0.5], [330, 0.10, 0.5]],
    /* tiden rinner ut */
    tick:    [[300, 0.05, 0.6], [300, 0.05, 0.0], [300, 0.05, 0.6]],
    /* möte avslutat */
    done:    [[523, 0.07, 0.6], [659, 0.07, 0.6], [784, 0.07, 0.6], [1047, 0.20, 0.6]],
    /* dåligt resultat */
    fail:    [[392, 0.10, 0.6], [349, 0.10, 0.6], [294, 0.24, 0.6]],
    /* dörr / scenbyte */
    door:    [[520, 0.04, 0.5], [700, 0.04, 0.5]],
    /* nytt ärende */
    alert:   [[1047, 0.06, 0.6], [0, 0.04, 0], [1047, 0.06, 0.6]]
  };

  LESS.sfx = function (name) {
    if (!enabled) return;
    var s = SFX[name];
    if (s) seq(s);
  };

  LESS.audio = {

/* ==== js/state.js ==== */
/* state.js – spelarens tillstånd, progression och repetitionskö.

   Pedagogiken sitter till stor del här:
   - principKö      : missade principer köas för återkommande övning (spacing)
   - mästerskap     : handledartipsen tonas bort när rollen sitter (fading)
   - kampanjbeslut  : tidigare beslut följer med patienten genom kedjan       */

(function (global) {
  'use strict';
  var LESS = global.LESS;

  var DEF = {
    v: 1,
    spelare: { namn: 'DU', roll: null },
    lage: null,                    /* 'kampanj' | 'drill' */
    kampanj: { arende: 0, steg: 0, beslut: {}, klara: [] },
    drill: { roll: null, spelade: {} },
    resultat: {},                  /* fallId -> {basta, spel, senaste} */
    principer: {},                 /* principId -> {ratt, fel, forfallen} */
    ko: [],                        /* principId-kö för repetition */
    mastery: {},                   /* roll -> antal guld */
    installningar: { tips: true, ljud: true, snabbtext: false },
    statistik: { moten: 0, guld: 0, silver: 0, brons: 0, omtag: 0, minuter: 0 }
  };

  function deepCopy(o) { return JSON.parse(JSON.stringify(o)); }

  function merge(base, saved) {
    var out = deepCopy(base), k;
    if (!saved) return out;
    for (k in saved) {
      if (!Object.prototype.hasOwnProperty.call(saved, k)) continue;
      if (out[k] && typeof out[k] === 'object' && !Array.isArray(out[k]) &&
          saved[k] && typeof saved[k] === 'object' && !Array.isArray(saved[k])) {
        out[k] = merge(out[k], saved[k]);
      } else {
        out[k] = saved[k];
      }
    }
    return out;
  }

  var S = merge(DEF, LESS.store.load());

  var state = {
    get data() { return S; },

    spara: function () { LESS.store.save(S); },

    nollstall: function () {
      S = deepCopy(DEF);
      LESS.store.clear();
    },

    finnsSparat: function () {
      return S.statistik.moten > 0 || S.kampanj.arende > 0 || S.kampanj.steg > 0;
    },

    /* ---------- resultat ---------- */

    /* betyg: 'guld' | 'silver' | 'brons' | 'omtag' */
    registrera: function (fallId, roll, betyg, principer, minuterKvar) {
      var rang = { omtag: 0, brons: 1, silver: 2, guld: 3 };
      var r = S.resultat[fallId] || { basta: 'omtag', spel: 0, senaste: null };
      r.spel += 1;
      r.senaste = betyg;
      if (rang[betyg] > rang[r.basta]) r.basta = betyg;
      S.resultat[fallId] = r;

      S.statistik.moten += 1;
      S.statistik[betyg] = (S.statistik[betyg] || 0) + 1;
      S.statistik.minuter += Math.max(0, Math.round(minuterKvar || 0));

      if (betyg === 'guld') S.mastery[roll] = (S.mastery[roll] || 0) + 1;

      /* principer: {id: true/false} – true = tillämpad, false = missad */
      Object.keys(principer || {}).forEach(function (pid) {
        var p = S.principer[pid] || { ratt: 0, fel: 0 };
        if (principer[pid]) {
          p.ratt += 1;
          /* två rätt i rad tar bort principen ur repetitionskön */
          if (p.ratt >= 2) state.taBortUrKo(pid);
        } else {
          p.fel += 1;
          p.ratt = 0;
          state.laggIKo(pid);
        }
        S.principer[pid] = p;
      });

      state.spara();
      return r;
    },

    /* ---------- repetitionskö (spacing) ---------- */

    laggIKo: function (pid) {
      if (S.ko.indexOf(pid) < 0) S.ko.push(pid);
    },
    taBortUrKo: function (pid) {
      var i = S.ko.indexOf(pid);
      if (i >= 0) S.ko.splice(i, 1);
    },
    ko: function () { return S.ko.slice(); },

    /* ---------- fading av handledartips ---------- */

    tipsPa: function (roll) {
      if (!S.installningar.tips) return false;
      return (S.mastery[roll] || 0) < 2;
    },

    /* ---------- kampanj ---------- */

    kampanjBeslut: function (nyckel, varde) {
      S.kampanj.beslut[nyckel] = varde;
      state.spara();
    },
    hamtaBeslut: function (nyckel) { return S.kampanj.beslut[nyckel]; },

    kampanjKlart: function (fallId) {
      if (S.kampanj.klara.indexOf(fallId) < 0) S.kampanj.klara.push(fallId);
      state.spara();
    },

    /* ---------- drill ---------- */

    drillSpelad: function (fallId) {
      S.drill.spelade[fallId] = (S.drill.spelade[fallId] || 0) + 1;
      state.spara();
    },

    /* Väljer nästa drillfall: minst spelat först, men fall som tränar en
       princip i repetitionskön går före (retrieval practice på det som svajar). */
    nastaDrill: function (fall) {
      var ko = S.ko, spelade = S.drill.spelade;
      var poang = fall.map(function (f) {
        var traffar = 0;
        (f.principer || []).forEach(function (p) { if (ko.indexOf(p) >= 0) traffar++; });
        return { f: f, p: traffar * 100 - (spelade[f.id] || 0) * 10 + Math.random() * 5 };
      });
      poang.sort(function (a, b) { return b.p - a.p; });
      return poang.length ? poang[0].f : null;
    }
  };

  LESS.state = state;

})(window);

    var steg = 0, felIStg = false, nagotFel = false;

    function fraga() {
      if (steg >= b.delar.length) {
        logga({ fraga: b.fraga, text: nagotFel ? 'Kedjan byggdes med fel på vägen' : 'Kedjan byggdes korrekt',
                ok: !nagotFel, varfor: b.forklaring, princip: b.princip });
        ui.banner(null);
        ui.say(b.forklaring, { name: 'HANDLEDAREN', kind: 'you' }, next);
        return;
      }
      var mal = b.delar[steg];
      ui.banner(b.banner || 'DFA-KEDJAN');
      ui.setDialog('Vilken rad är ' + mal.etikett + '?', null, 'fraga');
      var items = kvar.map(function (i) { return { text: b.delar[i].text }; });
      valMeny(items, b, function (n) {
        ui.hideDialog();
        var idx = kvar[n];
        if (b.delar[idx].etikett === mal.etikett) {
          LESS.sfx('ok');
          kvar.splice(n, 1);
          steg++; felIStg = false;
          ui.cue('✔ ' + mal.etikett);
          fraga();
        } else {
          LESS.sfx('wrong');
          nagotFel = true;
          if (!felIStg) { kostaTid(b.tidFel == null ? 2 : b.tidFel); felIStg = true; }
          ui.cue('✘ Det är ' + b.delar[idx].etikett + '.');
          if (E.tidUt) { steg = b.delar.length; fraga(); return; }
          fraga();
        }
      });
    }
    fraga();
  }

  function korBeslut(b, next) {
    ui.banner(b.banner || 'BESLUT');
    ui.setDialog(b.fraga, null, 'fraga');
    var items = b.val.map(function (o) {
      return { text: o.text, cost: o.tid ? kostText(o.tid) : null };
    });
    valMeny(items, b, function (i) {
      var o = b.val[i], ok = loesOk(o);
      ui.hideDialog();
      ui.banner(null);
      kostaTid(o.tid == null ? 1 : o.tid);
      applyFx(o.fx);
      if (o.kampanj) LESS.state.kampanjBeslut(o.kampanj.nyckel, o.kampanj.varde);
      E.beslut = { text: o.text, ok: ok, varfor: loesVarfor(o, ok), utfall: o.utfall, princip: o.princip };
      logga({ fraga: b.fraga, text: o.text, ok: ok, varfor: loesVarfor(o, ok), princip: o.princip, beslut: true });
      if (ok === true) LESS.sfx('done'); else if (ok === false) LESS.sfx('fail'); else LESS.sfx('ok');
      if (o.utfall) ui.say(o.utfall, { name: 'SEDAN', kind: '' }, next);
      else next();
    });
  }

  /* ---------------- flöde ---------------- */

  function villkorOk(b) {
    if (!b.om) return true;
    if (b.om.saknas) return !E.flaggor[b.om.saknas];
    if (b.om.finns) return !!E.flaggor[b.om.finns];
    return true;
  }

  function nastaBeat() {
    ui.banner(null);

    /* Tiden ute: hoppa direkt till beslutet. */
    if (E.tidUt && !E.tidUtVisad) {
      E.tidUtVisad = true;
      var beslut = null, i;
      for (i = E.ko.length - 1; i >= 0; i--) if (E.ko[i].typ === 'beslut') { beslut = E.ko[i]; break; }
      if (beslut) {
        E.ko = [beslut];
        ui.banner('TIDEN ÄR SLUT');
        ui.say('Besökstiden är slut. Nästa patient väntar – du måste fatta beslutet nu, med det du har.',
          { name: 'HANDLEDAREN', kind: 'you' }, nastaBeat);
        return;
      }
    }

    var b = E.ko.shift();
    while (b && !villkorOk(b)) b = E.ko.shift();

    if (!b) { avsluta(); return; }

    switch (b.typ) {
      case 'replik':   korReplik(b, nastaBeat); break;
      case 'val':      korVal(b, nastaBeat); break;
      case 'kontroll': korKontroll(b, nastaBeat); break;
      case 'flera':    korFlera(b, nastaBeat); break;
      case 'ordna':    korOrdna(b, nastaBeat); break;
      case 'beslut':   korBeslut(b, nastaBeat); break;
      default:         nastaBeat();
    }
  }

  /* ---------------- betyg ---------------- */

  function raknaBetyg() {
    var i, r, poang = 0;

    /* Beslutet väger tyngst. */
    var bp = 0;
    if (E.beslut) bp = E.beslut.ok === true ? 40 : (E.beslut.ok === 'delvis' ? 22 : 0);
    poang += bp;

    /* Kvaliteten i vägen dit. */
    var summa = 0, antal = 0;
    for (i = 0; i < E.logg.length; i++) {
      r = E.logg[i];
      if (r.beslut) continue;
      if (r.ok === true) summa += 1;
      else if (r.ok === 'delvis') summa += 0.5;
      antal++;
    }
    var andel = antal ? summa / antal : 0;
    poang += andel * 30;

    /* De dolda mätarna. */
    var snitt = 0;
    MATARE.forEach(function (m) { snitt += E.matare[m]; });
    snitt = snitt / MATARE.length;
    poang += LESS.clamp((snitt - 35) / 65 * 20, 0, 20);

    /* Tid kvar i besöket. */
    poang += E.tidUt ? 0 : 10;

    var betyg;
    if (poang >= 85) betyg = 'guld';
    else if (poang >= 65) betyg = 'silver';
    else if (poang >= 45) betyg = 'brons';
    else betyg = 'omtag';

    /* Patientsäkerheten är inte förhandlingsbar. */
    if (E.matare.sakerhet < 35) betyg = 'omtag';

    return { poang: Math.round(poang), betyg: betyg, andel: andel, snitt: Math.round(snitt) };
  }

  function principResultat() {
    var res = {};
    E.logg.forEach(function (r) {
      if (!r.princip) return;
      if (res[r.princip] === false) return;
      res[r.princip] = (r.ok === false) ? false : true;
    });
    return res;
  }

  function avsluta() {
    ui.hideDialog();
    ui.hideMenu();
    ui.banner(null);
    ui.hud(null);

    var b = raknaBetyg();
    var principer = principResultat();

    LESS.state.registrera(E.fall.id, E.roll, b.betyg, principer, E.kvar);
    if (E.opts.drill) LESS.state.drillSpelad(E.fall.id);

    var resultat = {
      fall: E.fall,
      roll: E.roll,
      patient: person(),
      betyg: b.betyg,
      poang: b.poang,
      matare: E.matare,
      logg: E.logg,
      beslut: E.beslut,
      tidUt: E.tidUt,
      kvar: E.kvar,
      minuter: E.minuter,
      principer: principer
    };

    var klar = E.done;
    LESS.ui.globalKeys.journal = null;
    E = null;
    LESS.debrief.visa(resultat, klar);
  }

  /* ---------------- start ---------------- */

  function start(fall, opts, done) {
    opts = opts || {};
    E = {
      fall: fall,
      roll: fall.roll,
      lage: fall.lage || 'rum',
      minuter: fall.minuter,
      kvar: fall.minuter,
      matare: { allians: 50, agens: 50, tydlighet: 50, underlag: 50, sakerhet: 50 },
      humor: 'neutral',
      flaggor: {},
      logg: [],
      ko: fall.beats.slice(),
      tidUt: false,
      tidUtVisad: false,
      beslut: null,
      opts: opts,
      done: done
    };

    LESS.setScene(scene);
    LESS.ui.globalKeys.journal = visaJournal;
    LESS.ui.globalKeys.handbok = LESS.handbokPanel;

    ui.hud(person().namn, E.kvar, E.minuter);

    /* Intro, med eventuella tillägg som beror på tidigare beslut. */
    var rader = (fall.intro || []).slice();
    (fall.introExtra || []).forEach(function (x) {
      if (LESS.state.hamtaBeslut(x.nyckel) === x.varde) rader = rader.concat(x.text);
    });
    var r = LESS.roller[fall.roll];
    rader.push('DU ÄR ' + (r ? r.namn : fall.roll) + '.  ' +
               'Besökstid: ' + fall.minuter + ' minuter.  J = journal, H = handbok.');

    ui.sayAll(rader.map(function (t) { return { text: t, speaker: null }; }), nastaBeat);
  }

  LESS.encounter = { start: start, MATARE: MATARE };

})(window);

/* debrief.js – handledarens återkoppling efter mötet.

   Här, och först här, avslöjas de dolda mätarna. Under mötet fick
   spelaren bara patientens reaktion; nu kommer den förklarande
   återkopplingen som kopplar varje val till en princip.            */

(function (global) {
  'use strict';
  var LESS = global.LESS, ui = LESS.ui, $ = LESS.$;

  var BETYGSTEXT = {
    guld:   ['GULD',   'Rätt beslut, hållbart underlag och patienten är kvar i samtalet.'],
    silver: ['SILVER', 'Rätt riktning. Något i vägen dit kostade mer än det behövde.'],
    brons:  ['BRONS',  'Du landade någorlunda, men flera steg gick förlorade på vägen.'],
    omtag:  ['OMTAG',  'Det här behöver göras om. Läs igenom och pröva igen.']
  };

  function markering(ok) {
    if (ok === true) return ['ok', '✔'];
    if (ok === 'delvis') return ['mid', '~'];
    return ['bad', '✘'];
  }

  function matarrad(namn, varde) {
    var kl = varde >= 60 ? '' : (varde >= 40 ? 'midv' : 'lowv');
    return '<div class="meter"><span class="mn">' + LESS.esc(namn) + '</span>' +
           '<span class="mb"><i class="' + kl + '" style="width:' + varde + '%"></i></span>' +
           '<span class="mv">' + varde + '</span></div>';
  }

  function visa(res, done) {
    var h = '', bt = BETYGSTEXT[res.betyg] || BETYGSTEXT.omtag;
    var roll = LESS.roller[res.roll];

    /* ---- betyg ---- */
    h += '<div class="d-grade ' + res.betyg + '">' +
         '<span class="g">' + bt[0] + '</span>' +
         '<span class="s">' + LESS.esc(bt[1]) + '</span>' +
         '<span class="s">' + res.poang + ' av 100 poäng · ' +
         (res.tidUt ? 'tiden tog slut' : LESS.mmss(res.kvar) + ' kvar av besöket') + '</span>' +
         '</div>';

    h += '<div class="d-note"><b>' + LESS.esc((roll ? roll.namn : res.roll) + ' · ' + res.patient.namn) + '</b>' +
         LESS.esc(res.fall.titel) + '</div>';

    /* ---- beslutet ---- */
    if (res.beslut) {
      var m = markering(res.beslut.ok);
      h += '<div class="d-h">DITT BESLUT</div>';
      h += '<div class="d-row ' + m[0] + '"><span class="mark">' + m[1] + '</span>' +
           '<span class="said">' + LESS.esc(res.beslut.text) + '</span>' +
           (res.beslut.utfall ? '<span class="said"><i>' + LESS.esc(res.beslut.utfall) + '</i></span>' : '') +
           '<span class="why">' + LESS.esc(res.beslut.varfor || '') + '</span></div>';
    }

    /* ---- val för val ---- */
    h += '<div class="d-h">VAL FÖR VAL</div>';
    var visade = 0;
    res.logg.forEach(function (r) {
      if (r.beslut) return;
      var mk = markering(r.ok);
      visade++;
      h += '<div class="d-row ' + mk[0] + '"><span class="mark">' + mk[1] + '</span>' +
           '<span class="said">' + LESS.esc(r.text) + '</span>' +
           (r.varfor ? '<span class="why">' + LESS.esc(r.varfor) + '</span>' : '') +
           (r.princip && LESS.principer[r.princip]
             ? '<span class="tag">' + LESS.esc(LESS.principer[r.princip]) + '</span>' : '') +
           '</div>';
    });
    if (!visade) h += '<p>Inga val registrerade.</p>';

    /* ---- de dolda mätarna ---- */
    h += '<div class="d-h">DET DU INTE SÅG</div>';
    h += '<p>Under besöket fick du bara patientens reaktion. Så här stod mätarna när du gick ut ur rummet:</p>';
    LESS.encounter.MATARE.forEach(function (k) {
      h += matarrad(LESS.MATARNAMN[k], res.matare[k]);
    });
    if (res.matare.sakerhet < 35) {
      h += '<div class="d-note warnbox"><b>PATIENTSÄKERHET</b>' +
           'Något medicinskt eller juridiskt viktigt gick förlorat. Det sätter betyget till OMTAG oavsett resten.</div>';
    }
    if (res.tidUt) {
      h += '<div class="d-note warnbox"><b>TIDEN TOG SLUT</b>' +
           'Beslutet fattades under tvång. Det är inte ett misslyckande i sig – men lägg märke till vilka val som åt upp minuterna. ' +
           'Dåligt bemötande kostar nästan alltid mer tid än det sparar.</div>';
    }

    /* ---- principer ---- */
    var missade = [], sittande = [];
    Object.keys(res.principer || {}).forEach(function (p) {
      var namn = LESS.principer[p] || p;
      if (res.principer[p]) sittande.push(namn); else missade.push(namn);
    });
    if (missade.length) {
      h += '<div class="d-h">TAS UPP IGEN I ÖVNINGSLÄGET</div><ul>';
      missade.forEach(function (n) { h += '<li>' + LESS.esc(n) + '</li>'; });
      h += '</ul>';
    }
    if (sittande.length) {
      h += '<div class="d-h">DET HÄR SATT</div><ul>';
      sittande.forEach(function (n) { h += '<li>' + LESS.esc(n) + '</li>'; });
      h += '</ul>';
    }

    var ko = LESS.state.ko();
    if (ko.length) {
      h += '<div class="d-note"><b>REPETITIONSKÖ (' + ko.length + ')</b>' +
           'Fall som tränar dessa principer prioriteras i övningsläget tills du klarat dem två gånger i rad.</div>';
    }

    h += '<div class="d-note"><b>⚠ EJ KLINISKT GRANSKAT</b>' +
         'Innehållet är ett pedagogiskt utkast. Kontrollera alltid mot försäkringsmedicinskt beslutsstöd, ' +
         'Försäkringskassans regelverk och lokala rutiner.</div>';

    $('debrief-body').innerHTML = h;
    $('debrief-box').scrollTop = 0;
    LESS.show($('debrief'), true);
    LESS.sfx(res.betyg === 'omtag' ? 'fail' : 'done');

    var body = $('debrief-box');
    var fot = $('debrief-foot');
    function uppdateraFot() {
      var slut = body.scrollTop + body.clientHeight >= body.scrollHeight - 8;
      fot.textContent = slut
        ? 'A = fortsätt  ·  ↑↓ = bläddra tillbaka'
        : 'A / ↓ = läs vidare  ·  ↑ = tillbaka';
    }
    body.onscroll = uppdateraFot;
    uppdateraFot();

    var hnd = LESS.input.push(function (k) {
      if (k === 'down') body.scrollTop += 34;
      else if (k === 'up') body.scrollTop -= 34;
      else if (k === 'a') {
        /* Kräv att man scrollat till slutet innan man går vidare – eller tryck igen */
        if (body.scrollTop + body.clientHeight < body.scrollHeight - 8) {
          body.scrollTop += 120;
          return;
        }
        LESS.sfx('ok');
        LESS.input.pop(hnd);
        body.onscroll = null;
        LESS.show($('debrief'), false);
        if (done) done(res);
      } else if (k === 'b') {
        body.scrollTop -= 120;
      }
    });
  }

  LESS.debrief = { visa: visa };

})(window);

(function (global) {

    { namn: 'PSYKOLOGRUM',       x1: 9,  y1: 1,  x2: 15, y2: 8 },
    { namn: 'FYSIOTERAPI',       x1: 17, y1: 1,  x2: 23, y2: 8 },
    { namn: 'LÄKARRUM',          x1: 25, y1: 1,  x2: 30, y2: 8 },
    { namn: 'KORRIDOR',          x1: 1,  y1: 9,  x2: 30, y2: 13 },
    { namn: 'VÄNTRUM',           x1: 1,  y1: 14, x2: 9,  y2: 20 },
    { namn: 'REHABKOORDINATOR',  x1: 11, y1: 14, x2: 19, y2: 20 },
    { namn: 'ARBETSTERAPI',      x1: 21, y1: 14, x2: 30, y2: 20 }

  var P = null;      /* spelaren */

  function nyPlayer() {
    return {
      tx: M.start.x, ty: M.start.y,
      px: M.start.x * TS, py: M.start.y * TS,

      gar: false, frame: 0, steg: 0, t0: 0,
      frx: 0, fry: 0, buffert: null

  function forsokGa(dir) {
    if (P.gar) { P.buffert = dir; return; }   /* tryck under pågående steg tappas inte */
    P.dir = dir;
    var d = DELTA[dir];
    var nx = P.tx + d[0], ny = P.ty + d[1];
    if (!M.walkable(nx, ny)) { P.steg = (P.steg + 1) % 2; return; }
    for (var i = 0; i < LESS.npcs.length; i++) {
      if (LESS.npcs[i].x === nx && LESS.npcs[i].y === ny) { P.steg = (P.steg + 1) % 2; return; }
    }

      var y0 = Math.max(0, (cam.y / TS | 0) - 1), y1 = Math.min(M.H - 1, ((cam.y + VY_H) / TS | 0) + 1);

      });
      var rollDef = (LESS.roller[LESS.state.data.spelare.roll] || LESS.roller.ssk).sprite;
      figurer.push({

      });

  /* ---------------- kampanj ---------------- */

  function kampanjSteg() {
    var K = LESS.state.data.kampanj;

    if (!a) return null;
    var s = a.steg[K.steg];

    return null;

  function uppdateraVarldsrad() {
    $('roomlabel').textContent = rumNamn();
    var o = '';
    if (LESS.state.data.lage === 'kampanj') {
      var k = kampanjSteg();
      if (k) {
        var r = LESS.roller[k.fall.roll];
        var pers = LESS.personer[k.arende.patient];
        o = (pers ? pers.namn.split(' ')[0].toUpperCase() : '') +
            ' · steg ' + (LESS.state.data.kampanj.steg + 1) + '/' + k.arende.steg.length +

    LESS.show($('worldbar'), true);
  }

  /* ---------------- interaktion ---------------- */

  function framforRuta() {
    var d = DELTA[P.dir];
    return { x: P.tx + d[0], y: P.ty + d[1] };
  }

  function tryck() {
    var f = framforRuta(), i;

    for (i = 0; i < LESS.npcs.length; i++) {
      if (LESS.npcs[i].x === f.x && LESS.npcs[i].y === f.y) { prataNpc(LESS.npcs[i]); return; }
    }
    for (i = 0; i < M.stations.length; i++) {
      var s = M.stations[i];
      if (s.x === f.x && s.y === f.y) { station(s); return; }
    }
    /* stå på en station (t.ex. utgången) */
    for (i = 0; i < M.stations.length; i++) {
      if (M.stations[i].x === P.tx && M.stations[i].y === P.ty) { station(M.stations[i]); return; }
    }
    LESS.sfx('back');
  }

  function paus() { aktiv = false; LESS.show($('worldbar'), false); }
  function ater() {
    aktiv = true;
    LESS.setScene(scene);
    uppdateraVarldsrad();
    LESS.show($('worldbar'), true);
  }

  function prataNpc(n) {
    paus();
    LESS.sfx('ok');
    ui.sayAll(n.repliker.map(function (t) { return { text: t, speaker: { name: n.namn, kind: 'you' } }; }), ater);
  }

  /* ---------------- stationer ---------------- */

  function station(s) {
    if (s.kind === 'handbok') { paus(); LESS.sfx('ok'); ui.panel('HANDBOKEN', handbokHtml(), ater); return; }
    if (s.kind === 'tavla')   { paus(); LESS.sfx('ok'); ui.panel('ANSLAGSTAVLAN', tavlaHtml(), ater); return; }
    if (s.kind === 'reception') { receptionsMeny(); return; }
    if (s.kind === 'utgang')  { utgang(); return; }
    if (s.role) startRoll(s.role);
  }

  function handbokHtml() {
    var html = '';
    LESS.handbok.forEach(function (k) {
      html += '<h3>' + LESS.esc(k.titel) + '</h3>';
      (k.text || []).forEach(function (t) { html += '<p>' + LESS.esc(t) + '</p>'; });
      if (k.lista) {
        html += '<ul>';
        k.lista.forEach(function (l) { html += '<li><b>' + LESS.esc(l[0]) + '</b> – ' + LESS.esc(l[1]) + '</li>'; });
        html += '</ul>';
      }
      if (k.punkter) {
        html += '<ul>';
        k.punkter.forEach(function (p) { html += '<li>' + LESS.esc(p) + '</li>'; });
        html += '</ul>';
      }
      if (k.varning) html += '<p><b>⚠ ' + LESS.esc(k.varning) + '</b></p>';
      if (k.todo) html += '<p><b>[' + LESS.esc(k.todo) + ']</b></p>';
    });
    return html;
  }

  function tavlaHtml() {
    var d = LESS.state.data, html = '';
    html += '<h3>Kampanjen</h3>';
    LESS.kampanj.arenden.forEach(function (a, i) {
      var status = i < d.kampanj.arende ? '✔ klart' : (i === d.kampanj.arende ? '▶ pågår' : '· ej påbörjat');
      html += '<div class="kv"><b>' + LESS.esc(a.titel) + '</b><span>' + status + '</span></div>';
      a.steg.forEach(function (s, j) {
        var f = LESS.hittaFall(s.fall), r = f ? LESS.roller[f.roll] : null;
        var klar = d.kampanj.klara.indexOf(s.fall) >= 0;
        var res = d.resultat[s.fall];
        html += '<div class="kv"><b style="padding-left:8px">' + (j + 1) + '. ' + LESS.esc(r ? r.kort : '') + '</b>' +
                '<span>' + (klar ? (res ? res.basta.toUpperCase() : 'klart') : '–') + '</span></div>';
      });
    });

    html += '<h3>Statistik</h3>';
    html += '<div class="kv"><b>Möten</b><span>' + d.statistik.moten + '</span></div>';
    html += '<div class="kv"><b>Guld</b><span>' + (d.statistik.guld || 0) + '</span></div>';
    html += '<div class="kv"><b>Silver</b><span>' + (d.statistik.silver || 0) + '</span></div>';
    html += '<div class="kv"><b>Brons</b><span>' + (d.statistik.brons || 0) + '</span></div>';
    html += '<div class="kv"><b>Omtag</b><span>' + (d.statistik.omtag || 0) + '</span></div>';

    var ko = LESS.state.ko();
    html += '<h3>Repetitionskö</h3>';
    if (!ko.length) html += '<p>Tom. Inget att repetera just nu.</p>';
    else {
      html += '<ul>';
      ko.forEach(function (p) { html += '<li>' + LESS.esc(LESS.principer[p] || p) + '</li>'; });
      html += '</ul>';
      html += '<p>Övningsläget prioriterar fall som tränar dessa.</p>';
    }

    html += '<h3>Handledartips</h3>';
    LESS.rollLista.forEach(function (r) {
      var g = d.mastery[r] || 0;
      html += '<div class="kv"><b>' + LESS.esc(LESS.roller[r].kort) + '</b><span>' +
              (g >= 2 ? 'tips avstängda (' + g + ' guld)' : 'tips på (' + g + '/2 guld)') + '</span></div>';
    });
    return html;
  }

  /* ---------------- starta ett fall ---------------- */

  function startRoll(roll) {
    var d = LESS.state.data;

    if (d.lage === 'kampanj') {
      var k = kampanjSteg();
      if (!k) { info('Alla ärenden är klara. Gå till receptionen för övningsläget.'); return; }
      if (k.fall.roll !== roll) {
        var r = LESS.roller[k.fall.roll];
        info('Inte idag. Ditt ärende väntar i ' + (r ? r.rum : '?') + '.');
        return;
      }
      korFall(k.fall, { kampanj: true }, function () { efterKampanj(k); });
      return;
    }

    /* övningsläge */
    var lista = LESS.drillFall(roll);
    if (!lista.length) { info('Inga fall inlagda för den rollen ännu.'); return; }
    var fall = LESS.state.nastaDrill(lista);
    korFall(fall, { drill: true }, function (res) { efterDrill(roll, res); });
  }

  function info(text) {
    paus();
    LESS.sfx('back');
    ui.say(text, null, ater);
  }

  function korFall(fall, opts, klar) {
    paus();
    LESS.state.data.spelare.roll = fall.roll;
    LESS.state.spara();
    LESS.sfx('door');
    ui.transition(function () {
      LESS.encounter.start(fall, opts, klar);
    });
  }

  /* ---------------- efterspel ---------------- */

  function efterKampanj(k) {
    var d = LESS.state.data;
    var res = d.resultat[k.fall.id];

    function forsatt() {
      LESS.state.kampanjKlart(k.fall.id);
      d.kampanj.steg += 1;
      if (d.kampanj.steg >= k.arende.steg.length) {
        d.kampanj.steg = 0;
        d.kampanj.arende += 1;
        LESS.state.spara();
        visaEpilog(k.arende);
      } else {
        LESS.state.spara();
        mellanspel();
      }
    }

    if (res && res.senaste === 'omtag') {
      ui.say('Handledaren: "Det där mötet vill jag att du gör om. Du får ta det en gång till."', null, function () {
        ui.menu([{ text: 'Gör om mötet' }, { text: 'Gå vidare ändå' }], {}, function (i) {
          if (i === 0) korFall(k.fall, { kampanj: true }, function () { efterKampanj(k); });
          else forsatt();
        });
      });
      return;
    }
    forsatt();
  }

  function mellanspel() {
    var k = kampanjSteg();
    if (!k) { ater(); return; }
    var rader = (k.steg.mellanspel || []).map(function (t) { return { text: t, speaker: null }; });
    if (!rader.length) { ater(); return; }
    ui.transition(function () {
      ui.sayAll(rader, ater);
    });
  }

  function visaEpilog(arende) {
    var rader = null;
    for (var i = 0; i < arende.epilog.length; i++) {
      var e = arende.epilog[i];
      if (!e.om) { rader = e.text; break; }
      if (LESS.state.hamtaBeslut(e.om.nyckel) === e.om.varde) { rader = e.text; break; }
    }
    rader = rader || [];
    ui.transition(function () {
      ui.sayAll(rader.map(function (t) { return { text: t, speaker: { name: arende.titel, kind: 'you' } }; }), function () {
        if (LESS.state.data.kampanj.arende >= LESS.kampanj.arenden.length) {
          ui.sayAll(LESS.kampanj.final.map(function (t) { return { text: t, speaker: { name: 'LESS', kind: 'you' } }; }), function () {
            LESS.state.data.lage = 'drill';
            LESS.state.spara();
            ui.say('Övningsläget är upplåst. Välj vilket rum du vill gå in i.', null, ater);
          });
        } else {
          mellanspel();
        }
      });
    });
  }

  function efterDrill(roll, res) {
    var lista = LESS.drillFall(roll);
    ui.menu([{ text: 'Nästa fall' }, { text: 'Sluta för idag' }], {}, function (i) {
      if (i === 0) {
        var fall = LESS.state.nastaDrill(lista);
        korFall(fall, { drill: true }, function (r2) { efterDrill(roll, r2); });
      } else {
        ui.transition(ater);
      }
    });
  }

  /* ---------------- reception & utgång ---------------- */

  function receptionsMeny() {
    paus();
    LESS.sfx('ok');
    var d = LESS.state.data;
    var items = [
      { text: d.lage === 'kampanj' ? 'Byt till övningsläge' : 'Byt till kampanjläge',
        hint: d.lage === 'kampanj'
          ? 'Öva en roll i taget, obegränsat antal fall.'
          : 'Följ tre patienter hela vägen genom LESS-flödet.' },
      { text: 'Anslagstavlan (progression)' },
      { text: 'Handboken' },
      { text: LESS.audio.enabled ? 'Ljud: PÅ' : 'Ljud: AV' },
      { text: d.installningar.tips ? 'Handledartips: PÅ' : 'Handledartips: AV',
        hint: 'Tipsen tonas ändå bort automatiskt när en roll sitter.' },
      { text: 'Börja om från början', hint: 'Raderar all progression.' },
      { text: 'Tillbaka' }
    ];
    ui.menu(items, { cancel: true }, function (i) {
      if (i === 0) {
        d.lage = d.lage === 'kampanj' ? 'drill' : 'kampanj';
        LESS.state.spara();
        ui.say(d.lage === 'kampanj'
          ? 'Kampanjläge. Följ ärendet dit det pekar.'
          : 'Övningsläge. Gå in i vilket rum du vill.', null, ater);
      } else if (i === 1) { ui.panel('ANSLAGSTAVLAN', tavlaHtml(), ater); }
      else if (i === 2) { ui.panel('HANDBOKEN', handbokHtml(), ater); }
      else if (i === 3) { LESS.audio.toggle(); d.installningar.ljud = LESS.audio.enabled; LESS.state.spara(); receptionsMeny(); }
      else if (i === 4) { d.installningar.tips = !d.installningar.tips; LESS.state.spara(); receptionsMeny(); }
      else if (i === 5) {
        ui.say('Vill du radera all progression och börja om?', null, function () {
          ui.menu([{ text: 'Nej, avbryt' }, { text: 'Ja, radera allt' }], {}, function (j) {
            if (j === 1) { LESS.state.nollstall(); location.reload(); }
            else ater();
          });
        });
      } else ater();
    });
  }

  function utgang() {
    paus();
    LESS.sfx('door');
    ui.say('Passet är slut för idag. Vill du gå ut?', null, function () {
      ui.menu([{ text: 'Nej, stanna kvar' }, { text: 'Ja, tillbaka till titelskärmen' }], {}, function (i) {
        if (i === 1) { LESS.state.spara(); ui.transition(function () { LESS.show($('worldbar'), false); LESS.titel(); }); }
        else ater();
      });
    });
  }

  /* ---------------- in-/utgång ---------------- */

  function enter(nyPosition) {
    if (!P || nyPosition) P = nyPlayer();
    LESS.setScene(scene);
    aktiv = true;
    uppdateraVarldsrad();

    if (handler) LESS.input.pop(handler);
    handler = LESS.input.push(function (k) {
      if (!aktiv) return;
      if (k === 'up' || k === 'down' || k === 'left' || k === 'right') { forsokGa(k); uppdateraVarldsrad(); }
      else if (k === 'a') tryck();
      else if (k === 'meny') receptionsMeny();
      else if (k === 'b') { /* reserverad */ }
    });

    LESS.ui.globalKeys.journal = function () { paus(); ui.panel('ANSLAGSTAVLAN', tavlaHtml(), ater); };
    LESS.ui.globalKeys.handbok = function () { paus(); ui.panel('HANDBOKEN', handbokHtml(), ater); };

    /* Kampanjens mellanspel första gången man kommer in */
    if (LESS.state.data.lage === 'kampanj' && !LESS.state.data.kampanj.introVisad) {
      LESS.state.data.kampanj.introVisad = true;
      LESS.state.spara();
      paus();
      ui.sayAll([
        { text: 'Vårdcentralen. Klockan är åtta.', speaker: null },
        { text: 'Idag ska du följa tre ärenden genom hela LESS-flödet – och byta roll på vägen.', speaker: null },
        { text: 'Piltangenter/WASD för att gå. A (Z eller Enter) för att prata. J = anslagstavla, H = handbok, Esc = meny.', speaker: null }
      ], ater);
    }
  }

  function leave() {
    aktiv = false;
    if (handler) { LESS.input.pop(handler); handler = null; }
    LESS.show($('worldbar'), false);
  }

  LESS.overworld = {
    enter: enter,
    leave: leave,
    uppdatera: function (t) { if (aktiv) uppdatera(t); },
    tick: function (t) {
      if (!aktiv) return;
      uppdatera(t);
      if (!P.gar) {
        var d = LESS.input.dir();
        if (d) { forsokGa(d); uppdateraVarldsrad(); }
      }
    }
  };

})(window);

/* ==== js/main.js ==== */
/* main.js – uppstart, skalning, renderslinga, titelskärm */
(function (global) {
  'use strict';
  var LESS = global.LESS, ui = LESS.ui, $ = LESS.$;

  var canvas, ctx, scen = null;

  LESS.setScene = function (s) { scen = s; };

  /* ---------------- skalning ---------------- */

  function skala() {
    var stage = $('stage');
    var touch = document.body.classList.contains('touch');
    var padH = touch ? 150 : 0;
    var w = global.innerWidth, h = global.innerHeight;
    var s = Math.min((w - 24) / 320, (h - padH - 24) / 288);
    if (s >= 1) s = Math.floor(s);              /* heltalsskala när det får plats */
    s = Math.max(0.5, s);
    stage.style.transform = 'scale(' + s + ')';
    stage.style.marginBottom = ((288 * s) - 288) + 'px';
    stage.style.marginRight = ((320 * s) - 320) + 'px';
    stage.style.marginLeft = ((320 * s) - 320) + 'px';
  }

  /* ---------------- renderslinga ---------------- */

  function loop(t) {
    if (LESS.overworld) LESS.overworld.tick(t);
    ctx.clearRect(0, 0, 160, 144);
    if (scen && scen.draw) scen.draw(ctx, t);
    requestAnimationFrame(loop);
  }

  /* ---------------- titelskärm ---------------- */

  var titelScen = { draw: function (c, t) { LESS.drawTitleBg(c, t); } };
  var titelHandler = null;

  function titel() {
    LESS.setScene(titelScen);
    LESS.show($('title'), true);
    LESS.show($('worldbar'), false);
    ui.hud(null);
    ui.hideDialog();
    ui.hideMenu();
    if (LESS.overworld) LESS.overworld.leave();

    if (titelHandler) LESS.input.pop(titelHandler);
    titelHandler = LESS.input.push(function (k) {
      if (k !== 'a') return;
      LESS.sfx('ok');
      LESS.input.pop(titelHandler); titelHandler = null;
      LESS.show($('title'), false);
      huvudmeny();
    });
  }
  LESS.titel = titel;

  function huvudmeny() {
    var d = LESS.state.data;
    var items = [];
    if (LESS.state.finnsSparat()) {
      items.push({ text: 'Fortsätt', hint: 'Läge: ' + (d.lage === 'drill' ? 'övning' : 'kampanj') +
        ' · ' + d.statistik.moten + ' möten hittills' });
    }
    items.push({ text: 'Kampanj – tre ärenden',
      hint: 'Följ Anna, Bengt och Carina genom hela flödet. Du byter roll längs vägen.' });
    items.push({ text: 'Övningsläge – en roll i taget',
      hint: 'Välj rum fritt och mata på med fall. Repetitionskön styr urvalet.' });
    items.push({ text: 'Handboken', hint: 'LESS, BEDDA, DFA-kedjan, triage, juridik.' });
    items.push({ text: 'Om spelet' });

    ui.menu(items, { compact: false }, function (i, item) {
      var txt = item.text;
      if (txt === 'Fortsätt') { startVarld(); }
      else if (txt.indexOf('Kampanj') === 0) {
        if (LESS.state.finnsSparat() && d.kampanj.arende > 0) {
          ui.say('Vill du börja om kampanjen från ärende 1?', null, function () {
            ui.menu([{ text: 'Nej, fortsätt där jag var' }, { text: 'Ja, börja om' }], {}, function (j) {
              if (j === 1) { d.kampanj = { arende: 0, steg: 0, beslut: {}, klara: [] }; }
              d.lage = 'kampanj'; LESS.state.spara(); startVarld();
            });
          });
        } else { d.lage = 'kampanj'; LESS.state.spara(); startVarld(); }
      }
      else if (txt.indexOf('Övningsläge') === 0) { d.lage = 'drill'; LESS.state.spara(); startVarld(); }
      else if (txt === 'Handboken') { ui.panel('HANDBOKEN', LESS.handbokHtml(), huvudmeny); }
      else { omSpelet(); }
    });
  }

  function omSpelet() {
    var h = '';
    h += '<h3>LESS – Vårdcentralen ' + LESS.VERSION + '</h3>';
    h += '<p>Ett litet läromedelsspel om hur sjukskrivningsärenden hanteras enligt LESS i primärvården. ' +
         'Sex roller, tre ärenden och ett övningsläge.</p>';
    h += '<h3>Kontroller</h3>';
    h += '<ul>' +
         '<li>Piltangenter eller WASD – gå</li>' +
         '<li>Z, Enter eller mellanslag – A (bekräfta / prata)</li>' +
         '<li>X eller backsteg – B (tillbaka)</li>' +
         '<li>J – journal / anslagstavla</li>' +
         '<li>H – handboken</li>' +
         '<li>Esc – meny</li>' +
         '<li>M – ljud på/av</li>' +
         '</ul>';
    h += '<h3>Så är spelet tänkt</h3>';
    h += '<ul>' +
         '<li>Tiden i besöket är den enda mätaren du ser. Allt annat mäts i det dolda.</li>' +
         '<li>Under mötet får du bara patientens reaktion – snabb, men utan facit.</li>' +
         '<li>Efter mötet kommer förklaringen, val för val, med mätarna avslöjade.</li>' +
         '<li>Det du missar hamnar i en repetitionskö och kommer tillbaka i övningsläget.</li>' +
         '<li>Handledartipsen tonas bort när du klarat en roll med guld två gånger.</li>' +
         '</ul>';
    h += '<h3>⚠ Ansvarsfriskrivning</h3>';
    h += '<p>Innehållet är ett pedagogiskt utkast och är <b>inte kliniskt granskat</b>. ' +
         'Patienterna är påhittade. Spelet är ett diskussionsunderlag för utbildning, ' +
         'inte ett beslutsstöd. Kontrollera alltid mot Socialstyrelsens försäkringsmedicinska ' +
         'beslutsstöd, Försäkringskassans regelverk och lokala rutiner.</p>';
    ui.panel('OM SPELET', h, huvudmeny);
  }

  function startVarld() {
    ui.transition(function () {
      LESS.overworld.enter(true);
    });
  }

  /* ---------------- start ---------------- */

  function boot() {
    canvas = $('screen');
    ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    ui.init();
    LESS.audio.set(LESS.state.data.installningar.ljud !== false);

    /* Handboks-html återanvänds från overworld-modulen */
    LESS.handbokHtml = function () {
      var html = '';
      LESS.handbok.forEach(function (k) {
        html += '<h3>' + LESS.esc(k.titel) + '</h3>';
        (k.text || []).forEach(function (t) { html += '<p>' + LESS.esc(t) + '</p>'; });
        if (k.lista) {
          html += '<ul>';
          k.lista.forEach(function (l) { html += '<li><b>' + LESS.esc(l[0]) + '</b> – ' + LESS.esc(l[1]) + '</li>'; });
          html += '</ul>';
        }
        if (k.punkter) {
          html += '<ul>';
          k.punkter.forEach(function (p) { html += '<li>' + LESS.esc(p) + '</li>'; });
          html += '</ul>';
        }
        if (k.varning) html += '<p><b>⚠ ' + LESS.esc(k.varning) + '</b></p>';
        if (k.todo) html += '<p><b>[' + LESS.esc(k.todo) + ']</b></p>';
      });
      return html;
    };

    skala();
    global.addEventListener('resize', skala);
    global.addEventListener('orientationchange', function () { setTimeout(skala, 120); });

    titel();
    requestAnimationFrame(loop);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

})(window);

</script>
