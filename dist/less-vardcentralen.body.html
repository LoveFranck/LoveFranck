<title>LESS – Vårdcentralen</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2016%2016%27%3E%3Ccircle%20cx%3D%278%27%20cy%3D%278%27%20r%3D%278%27%20fill%3D%27%2375d8c7%27%2F%3E%3Cg%20fill%3D%27%2300443c%27%3E%3Crect%20x%3D%275%27%20y%3D%273%27%20width%3D%272%27%20height%3D%271%27%2F%3E%3Crect%20x%3D%277%27%20y%3D%272%27%20width%3D%272%27%20height%3D%271%27%2F%3E%3Crect%20x%3D%279%27%20y%3D%273%27%20width%3D%272%27%20height%3D%271%27%2F%3E%3Crect%20x%3D%276%27%20y%3D%275%27%20width%3D%275%27%20height%3D%272%27%2F%3E%3Crect%20x%3D%276%27%20y%3D%275%27%20width%3D%272%27%20height%3D%278%27%2F%3E%3Crect%20x%3D%274%27%20y%3D%278%27%20width%3D%276%27%20height%3D%272%27%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<style>
/* =========================================================
   LESS – Vårdcentralen
   Estetik: Pokémon Guld/Silver (Game Boy Color)
   Logisk skärm: 320x288 (= GBC 160x144 x2). Allt skalas med
   heltalsfaktor så pixlarna förblir kvadratiska.
   ========================================================= */

:root{
  /* GBC-inspirerad grundpalett */
  --ink:      #10100c;   /* svart ram och text            */
  --paper:    #f8f8e8;   /* ljus textrutebakgrund         */
  --paper-sh: #c8c8a8;   /* skugga i textruta             */
  --gold:     #e8a028;   /* accent (GULD)                 */
  --silver:   #a8b0c0;   /* accent (SILVER)               */
  --bronze:   #b87038;   /* accent (BRONS)                */
  --good:     #38803f;   /* grön                          */
  --warn:     #b83820;   /* röd                           */
  --info:     #3858a0;   /* blå                           */
  --mark:     #00443c;   /* Forsåker vårdcentral, mörkgrön */
  --mark-mint:#75d8c7;   /* Forsåker vårdcentral, mint     */
  --shell:    #2a2a34;   /* konsolens plastram            */
  --shell-2:  #1a1a22;
  --screen-bg:#8ab060;
}

*{ box-sizing:border-box; }

html,body{
  margin:0; padding:0; height:100%;
  background:#0c0c10;
  overflow:hidden;
  -webkit-text-size-adjust:100%;
  overscroll-behavior:none;
  touch-action:manipulation;
}

body{
  display:flex; align-items:center; justify-content:center;
  font-family:"Silkscreen","Press Start 2P",ui-monospace,"DejaVu Sans Mono","Courier New",monospace;
  color:var(--ink);
  user-select:none; -webkit-user-select:none;
}

#frame{
  display:flex; flex-direction:column; align-items:center; gap:10px;
}

/* ---------- Skärmen ---------- */

#stage{
  position:relative;
  width:320px; height:288px;
  transform-origin:top center;
  background:var(--screen-bg);
  box-shadow:0 0 0 6px var(--shell), 0 0 0 8px var(--shell-2), 0 10px 30px rgba(0,0,0,.6);
  overflow:hidden;
}

#screen{
  position:absolute; inset:0;
  width:320px; height:288px;
  image-rendering:pixelated;
  image-rendering:crisp-edges;
  display:block;
}

#ui{ position:absolute; inset:0; }

.hidden{ display:none !important; }

/* ---------- Game Boy-textruta ---------- */

.gbbox{
  position:absolute;
  background:var(--paper);
  color:var(--ink);
  border:2px solid var(--ink);
  border-radius:4px;
  box-shadow:inset 0 0 0 2px var(--paper), inset 0 0 0 3px var(--ink);
  padding:8px 9px;
  line-height:1.35;
  font-size:10px;
  letter-spacing:.2px;
}

#dialog{
  left:8px; right:8px; bottom:8px;
  min-height:62px;
}
/* Frågeläge: rutan flyttar upp så att valmenyn får plats under */
#dialog.fraga{
  top:116px; bottom:auto; min-height:0;
  font-size:9.5px;
  max-height:52px; overflow:hidden;
}
#dialog p{ margin:0; white-space:pre-wrap; }
#dialog-more{
  position:absolute; right:8px; bottom:5px;
  animation:blink .7s steps(1) infinite;
  font-size:9px;
}
@keyframes blink{ 50%{ opacity:0; } }

/* Talarnamn ovanför rutan */
.speaker{
  display:block;
  font-size:9px;
  color:var(--info);
  margin:0 0 3px;
  letter-spacing:.5px;
}
.speaker.pat{ color:var(--warn); }
.speaker.you{ color:var(--good); }

/* ---------- Valmeny ---------- */

#menu{
  left:8px; right:8px;
  bottom:8px;
  max-height:170px;
  overflow-y:auto;
  padding:6px 6px 6px 4px;
  scrollbar-width:none;
}
#menu::-webkit-scrollbar{ display:none; }
#menu.val{ top:172px; bottom:8px; max-height:none; }
#menu.compact{ left:auto; right:8px; width:132px; }

.opt{
  display:flex; align-items:flex-start; gap:4px;
  padding:2px 2px 3px 10px;
  position:relative;
  font-size:10px;
  line-height:1.3;
  scroll-margin:6px;
}
#menu.val .opt{ font-size:9px; line-height:1.35; }
.opt .cur{ position:absolute; left:1px; top:2px; opacity:0; }
.opt.sel .cur{ opacity:1; }
.opt.sel{ background:#e0e0c0; border-radius:2px; }
.opt .txt{ flex:1; }
.opt .cost{
  font-size:9px; color:#606050; white-space:nowrap; padding-top:1px;
}
.opt.used .txt{ color:#909080; text-decoration:line-through; }

#menu .hint{
  font-size:9px; color:#606050; padding:3px 2px 0 10px; border-top:1px dotted #b0b090; margin-top:3px;
}

/* ---------- HUD ---------- */

#hud{
  position:absolute; left:8px; right:8px; top:6px;
  display:flex; align-items:center; justify-content:space-between;
  gap:6px;
  font-size:9px;
}
#hud-name{
  background:var(--paper); border:2px solid var(--ink); border-radius:3px;
  padding:2px 5px; letter-spacing:.4px;
}
#hud-clock{
  background:var(--paper); border:2px solid var(--ink); border-radius:3px;
  padding:2px 5px; display:flex; align-items:center; gap:4px;
}
#hud-bar{
  width:52px; height:6px; background:#606050; border:1px solid var(--ink);
}
#hud-bar-fill{
  display:block; height:100%; width:100%; background:var(--good);
  transition:width .25s steps(6);
}
#hud-bar-fill.mid{ background:var(--gold); }
#hud-bar-fill.low{ background:var(--warn); }
#hud.warn #hud-clock{ animation:blink .5s steps(1) 4; }

/* ---------- Världsrad ---------- */

#worldbar{
  position:absolute; left:6px; right:6px; top:6px;
  display:flex; align-items:flex-start; justify-content:space-between; gap:6px;
  font-size:9px; pointer-events:none;
}
#roomlabel{
  background:var(--paper); border:2px solid var(--ink); border-radius:3px;
  padding:2px 5px; letter-spacing:.6px; white-space:nowrap;
}
#objective{
  background:var(--ink); color:var(--paper); border:2px solid var(--paper);
  border-radius:3px; padding:2px 5px; max-width:190px; line-height:1.3;
}
#objective:empty{ display:none; }

/* ---------- Banner ---------- */

#banner{
  position:absolute; left:0; right:0; top:44px;
  text-align:center; font-size:10px; letter-spacing:1px;
  color:var(--paper);
  background:var(--ink);
  padding:3px 0;
  border-top:2px solid var(--paper); border-bottom:2px solid var(--paper);
}

/* ---------- Reaktionssignal ---------- */

#cue{
  position:absolute; left:0; right:0; top:96px;
  text-align:center; font-size:10px;
  color:var(--paper); text-shadow:1px 1px 0 var(--ink);
  animation:cuepop .9s ease-out forwards;
  pointer-events:none;
}
@keyframes cuepop{
  0%{ transform:translateY(6px); opacity:0; }
  20%{ transform:translateY(0); opacity:1; }
  80%{ opacity:1; }
  100%{ transform:translateY(-8px); opacity:0; }
}

/* ---------- Panel (journal / handbok / meny) ---------- */

#panel{ position:absolute; inset:0; background:rgba(16,16,12,.55); }
#panel-box{
  position:absolute; left:8px; right:8px; top:10px; bottom:10px;
  overflow:hidden; display:flex; flex-direction:column;
}
#panel-title{
  margin:0 0 5px; font-size:11px; letter-spacing:1px;
  border-bottom:2px solid var(--ink); padding-bottom:3px;
}
#panel-body{ flex:1; overflow-y:auto; font-size:10px; line-height:1.45; padding-right:2px; }
#panel-body h3{ font-size:10px; margin:8px 0 2px; color:var(--info); letter-spacing:.5px; }
#panel-body p{ margin:0 0 5px; }
#panel-body ul{ margin:0 0 6px; padding-left:14px; }
#panel-body li{ margin-bottom:2px; }
#panel-body .kv{ display:flex; gap:6px; margin-bottom:2px; }
#panel-body .kv b{ min-width:76px; font-weight:normal; color:#606050; }
.panel-foot{ font-size:9px; color:#606050; padding-top:4px; border-top:1px dotted #b0b090; margin-top:4px; }

/* ---------- Tangentbordsbild i kontrollrutan ---------- */

.kbd{
  display:flex; flex-direction:column; gap:3px;
  margin:6px 0 7px;
}
.kbd .rad{ display:flex; gap:3px; }
.kbd .rad.in1{ padding-left:7px; }
.kbd .rad.in2{ padding-left:14px; }
.kbd.piltgt{ align-items:center; }

.tgt{
  display:flex; align-items:center; justify-content:center;
  width:17px; height:17px;
  border:2px solid var(--ink); border-radius:3px;
  background:#e6e6d2; color:#5a5a4c;
  font-size:9px; line-height:1;
  box-shadow:0 2px 0 #b4b49c;
}
.tgt.tom{ border-color:transparent; background:none; box-shadow:none; }
.tgt.ga{ background:var(--gold); color:var(--ink); box-shadow:0 2px 0 #a06c10; }
.tgt.kA{ background:var(--mark-mint); color:var(--mark); box-shadow:0 2px 0 var(--mark); font-weight:bold; }
.tgt.kB{ background:var(--silver); color:var(--ink); box-shadow:0 2px 0 #6a7488; font-weight:bold; }

#panel-body p.leg{ font-size:9px; color:#5a5a4c; margin:-2px 0 6px; }
.chip{
  display:inline-block; width:8px; height:8px; margin-right:1px;
  border:1px solid var(--ink); vertical-align:-1px;
}
.chip.ga{ background:var(--gold); }
.chip.kA{ background:var(--mark-mint); }
.chip.kB{ background:var(--silver); }

/* ---------- Frågeplanscher ---------- */

.planschintro{ font-size:9px; color:#5a5a4c; }
.planschintro.lagring{ color:var(--mark); }
.planschfraga{ font-size:11px; line-height:1.4; margin:0 0 5px; }
.planschbak{ font-size:9px; color:#5a5a4c; }
.planschradg{
  font-size:9px; line-height:1.5;
  border:2px solid var(--ink); border-radius:3px;
  background:#eef4ea; padding:5px 6px; margin:8px 0 0;
}
.planschank{ font-size:9px; margin:5px 0 0; }

.fraga{
  position:relative;
  padding:4px 4px 5px 11px;
  border-bottom:1px dotted #b0b090;
  font-size:10px; line-height:1.3;
  scroll-margin:6px;
}
.fraga .cur{ position:absolute; left:0; top:4px; opacity:0; }
.fraga.sel{ background:#e0e0c0; }
.fraga.sel .cur{ opacity:1; }
.fraga .ft{ display:block; margin-bottom:3px; }
.fraga.knapp .ft{ margin-bottom:0; color:var(--info); }
.fraga .rad{ display:flex; align-items:center; gap:4px; font-size:9px; color:#5a5a4c; }
.fraga .rad b{ width:52px; font-weight:normal; }
.fraga .ank{ color:#7a7a68; }
.fraga .ingen{ color:#9a9a88; }

.skb{
  display:inline-block; width:64px; height:6px;
  background:#d8d8c0; border:1px solid var(--ink); position:relative;
}
.skb i{ display:block; height:100%; }
.skb.radg i{ background:#909080; }
.skb.du i{ background:var(--mark-mint); }
.skb.andra i{ background:var(--info); }
.skv{ width:20px; text-align:right; font-variant-numeric:tabular-nums; }

.skalabox{ margin:8px 0 4px; }
.skalatal{ font-size:22px; letter-spacing:1px; text-align:center; }
.skalatal span{ font-size:9px; letter-spacing:0; color:#7a7a68; }
.skala{
  position:relative; height:14px; margin:4px 0 2px;
  background:#d8d8c0; border:2px solid var(--ink);
}
.skala i{ display:block; height:100%; background:var(--mark-mint); }
.skala u{ position:absolute; top:0; width:1px; height:100%; background:#a8a894; }
.skala .radgmark{
  position:absolute; top:-4px; width:3px; height:18px;
  background:var(--warn); margin-left:-1px;
}
.skalaank{ display:flex; justify-content:space-between; font-size:7px; color:#7a7a68; text-align:center; }
.skalaank span{ flex:1; line-height:1.2; }

pre.rapport{
  font-size:9px; line-height:1.4; white-space:pre-wrap; word-break:break-word;
  background:#f0f0e0; border:2px solid var(--ink); border-radius:3px;
  padding:5px 6px; margin:6px 0 0;
  user-select:text; -webkit-user-select:text;
}

/* ---------- Debrief ---------- */

#debrief{ position:absolute; inset:0; background:var(--paper); display:flex; flex-direction:column; }
#debrief-box{ flex:1; overflow-y:auto; padding:8px 9px 4px; font-size:10px; line-height:1.45; }
/* Fast höjd och ingen radbrytning: om fotens höjd ändras med texten ändras
   också rutans höjd, och då flippar "är jag längst ner?" fram och tillbaka. */
#debrief-foot{
  flex:0 0 auto;
  height:20px;
  display:flex; align-items:center;
  white-space:nowrap; overflow:hidden;
  font-size:9px; color:var(--paper); padding:0 9px;
  border-top:2px solid var(--ink);
  background:var(--ink);
  letter-spacing:.3px;
}
#debrief-foot b{ color:#f8e070; }
#debrief-foot .pil{ display:inline-block; color:#f8e070; animation:blink .7s steps(1) infinite; }
/* Skuggkant som visar att det finns mer text nedanför */
#debrief-foot.mer{ box-shadow:0 -10px 12px -8px rgba(16,16,12,.45); }

.d-grade{
  text-align:center; border:2px solid var(--ink); border-radius:4px;
  padding:6px 4px; margin-bottom:8px;
}
.d-grade .g{ display:block; font-size:20px; letter-spacing:3px; margin-bottom:2px; }
.d-grade .s{ display:block; font-size:9px; color:#404038; }
.d-grade.guld{ background:#fff0c8; } .d-grade.guld .g{ color:#a06c00; }
.d-grade.silver{ background:#eef0f4; } .d-grade.silver .g{ color:#606878; }
.d-grade.brons{ background:#f4e4d4; } .d-grade.brons .g{ color:#8a4c1c; }
.d-grade.omtag{ background:#f6dcd6; } .d-grade.omtag .g{ color:var(--warn); font-size:15px; }

.d-h{ font-size:10px; letter-spacing:1px; border-bottom:2px solid var(--ink); margin:10px 0 5px; padding-bottom:2px; }

.d-row{ margin-bottom:7px; padding-left:13px; position:relative; }
.d-row .mark{ position:absolute; left:0; top:0; font-size:11px; }
.d-row.ok .mark{ color:var(--good); }
.d-row.bad .mark{ color:var(--warn); }
.d-row.mid .mark{ color:var(--gold); }
.d-row .said{ display:block; color:#404038; margin-bottom:1px; }
.d-row .why{ display:block; color:#20201c; }
.d-row .tag{
  display:inline-block; font-size:8px; letter-spacing:.5px;
  border:1px solid #909080; border-radius:2px; padding:0 3px; margin-top:2px; color:#606050;
}

.meter{ display:flex; align-items:center; gap:5px; margin-bottom:3px; font-size:9px; }
.meter .mn{ width:96px; color:#404038; }
.meter .mb{ flex:1; height:7px; background:#d8d8c0; border:1px solid var(--ink); position:relative; }
.meter .mb i{ display:block; height:100%; background:var(--good); }
.meter .mb i.lowv{ background:var(--warn); }
.meter .mb i.midv{ background:var(--gold); }
.meter .mv{ width:26px; text-align:right; color:#606050; }

.d-note{
  border:2px solid var(--ink); border-radius:3px; background:#eef4ea;
  padding:5px 6px; margin:8px 0; font-size:9px; line-height:1.5;
}
.d-note b{ display:block; margin-bottom:2px; letter-spacing:.5px; }
.d-note.warnbox{ background:#f8e8e2; }

/* ---------- Titelskärm ---------- */

/* Logotypen läggs över fasaden så att Forsåkers skylt ovanför taket syns fritt. */
#title{ position:absolute; inset:0; display:flex; flex-direction:column;
        align-items:center; justify-content:flex-start; padding-top:80px; gap:4px; }
#title-logo{ text-align:center; }
.t-less{
  display:block; font-size:44px; letter-spacing:6px; color:#f8e070;
  text-shadow:2px 2px 0 #a06010, 4px 4px 0 var(--ink);
}
.t-sub{
  display:block; font-size:11px; letter-spacing:4px; color:var(--mark);
  text-shadow:1px 1px 0 var(--paper), -1px 0 0 var(--paper), 0 -1px 0 var(--paper);
  margin-top:2px;
}
#title-press{
  margin-top:40px; font-size:10px; letter-spacing:2px; color:var(--paper);
  text-shadow:1px 1px 0 var(--ink); animation:blink 1s steps(1) infinite;
}
#title-brand{
  position:absolute; bottom:22px;
  display:flex; align-items:center; gap:5px;
  background:var(--paper);
  border:2px solid var(--mark);
  border-radius:3px;
  padding:2px 6px 2px 4px;
  font-size:8px; letter-spacing:1px; white-space:nowrap;
  color:var(--mark);
}
#title-brand .mark{
  width:10px; height:10px; border-radius:50%;
  background:var(--mark-mint);
  box-shadow:inset 0 0 0 2px var(--mark);
}
#title-foot{
  position:absolute; bottom:6px; font-size:8px; letter-spacing:1px;
  color:var(--paper); text-shadow:1px 1px 0 var(--ink); opacity:.85;
}

/* ---------- Fade ---------- */

#fade{
  position:absolute; inset:0; background:var(--ink);
  opacity:0; pointer-events:none; transition:opacity .18s steps(4);
}
#fade.on{ opacity:1; }

/* ---------- Pekkontroller ---------- */

#pad{ display:none; width:min(420px,96vw); }
body.touch #pad{
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-areas:"dpad btns" "sys sys";
  gap:8px; align-items:center;
}
#dpad{ grid-area:dpad; display:grid; grid-template-columns:repeat(3,38px);
       grid-template-rows:repeat(3,38px); justify-content:center; }
#dpad .pb:nth-child(1){ grid-column:2; grid-row:1; }
#dpad .pb:nth-child(2){ grid-column:1; grid-row:2; }
#dpad .pb:nth-child(3){ grid-column:3; grid-row:2; }
#dpad .pb:nth-child(4){ grid-column:2; grid-row:3; }
#btns{ grid-area:btns; display:flex; gap:12px; justify-content:center; align-items:center; }
#sysbtns{ grid-area:sys; display:flex; gap:10px; justify-content:center; }
.pb{
  background:#3a3a48; color:#e8e8d8; border:2px solid #14141c; border-radius:6px;
  font:inherit; font-size:12px; padding:0; cursor:pointer;
}
.pb.round{ width:52px; height:52px; border-radius:50%; font-size:16px; background:#8a3040; }
.pb.wide{ padding:7px 14px; font-size:10px; letter-spacing:1px; }
.pb:active{ transform:translateY(1px); filter:brightness(1.25); }

/* ---------- Tillgänglighet ---------- */

@media (prefers-reduced-motion:reduce){
  #dialog-more,#title-press,#hud.warn #hud-clock,#debrief-foot .pil{ animation:none; }
  #cue{ animation:none; }
  #fade{ transition:none; }
}

/* ---------- Signatur på planschen ---------- */

.fraga.signatur .ft i{ color:#8a9a96; font-style:normal; }
.fraga.signatur .ft b{ color:var(--mark); }

.signfalt{ margin:6px 0 4px; }
.signfalt input{
  width:100%; box-sizing:border-box;
  font:inherit; font-size:10px; letter-spacing:1px;
  color:var(--ink); background:var(--paper);
  border:2px solid var(--mark); border-radius:2px;
  padding:5px 6px;
}
.signfalt input:focus{ outline:none; border-color:var(--mark-mint); background:#fff; }
.signfalt input::placeholder{ color:#a8b4b0; }

/* ---------- Pingistavlan i skyddsrummet ---------- */

table.topp{ width:100%; border-collapse:collapse; font-size:9px; margin:4px 0 6px; }
table.topp th{
  text-align:left; padding:2px 3px; color:var(--mark);
  border-bottom:2px solid var(--mark); font-weight:normal; letter-spacing:1px;
}
table.topp td{ padding:2px 3px; border-bottom:1px solid var(--paper-sh); }
table.topp td:first-child{ color:#8a9a96; width:14px; }
table.topp td:last-child{ text-align:right; width:26px; }
table.topp tr.etta td{ background:rgba(232,160,40,.18); }
table.topp tr.etta td:nth-child(2){ color:#8a6010; }

</style>


<div id="frame">
  <div id="stage">
    <canvas id="screen" width="160" height="144"></canvas>

    <div id="ui">

      <!-- Rumsetikett och uppdrag: syns i vårdcentralen -->
      <div id="worldbar" class="hidden">
        <div id="roomlabel">KORRIDOR</div>
        <div id="objective"></div>
      </div>

      <!-- HUD: syns under möten -->
      <div id="hud" class="hidden">
        <div id="hud-name">PATIENT</div>
        <div id="hud-clock">
          <span id="hud-clock-label">20:00</span>
          <div id="hud-bar"><i id="hud-bar-fill"></i></div>
        </div>

/* ==== js/util.js ==== */
/* util.js – små hjälpare och global namnrymd */
(function (global) {
  'use strict';

  var LESS = global.LESS || (global.LESS = {});

  LESS.VERSION = '1.0.0';

  /* ---------- matte ---------- */
  LESS.clamp = function (v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); };
  LESS.lerp = function (a, b, t) { return a + (b - a) * t; };

  /* Mörkare variant av en hexfärg – används för att härleda skuggfärger ur
     en enda angiven färg i stället för att skriva tre överallt. */
  LESS.morkare = function (hex, k) {
    var m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
    if (!m) return hex;
    var v = parseInt(m[1], 16), i, ut = '#';
    var d = [(v >> 16) & 255, (v >> 8) & 255, v & 255];
    for (i = 0; i < 3; i++) {
      ut += ('0' + Math.max(0, Math.round(d[i] * k)).toString(16)).slice(-2);
    }
    return ut;
  };

  /* Deterministisk slump (så drill-ordningen går att återskapa) */
  LESS.rng = function (seed) {
    var s = seed >>> 0 || 1;
    return function () {
      s ^= s << 13; s >>>= 0;
      s ^= s >> 17;
      s ^= s << 5; s >>>= 0;
      return s / 4294967296;
    };
  };

  LESS.shuffle = function (arr, rand) {
    var a = arr.slice(), i, j, t;
    rand = rand || Math.random;
    for (i = a.length - 1; i > 0; i--) {
      j = Math.floor(rand() * (i + 1));
      t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  };

  /* ---------- text ---------- */
  LESS.esc = function (s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  };

  /* Minuter -> "MM:SS"-liknande klocka i besökstid */
  LESS.mmss = function (minutes) {
    var m = Math.max(0, Math.floor(minutes));
    var s = Math.round((minutes - m) * 60);
    if (s >= 60) { m += 1; s = 0; }
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  };

  /* ---------- lagring ---------- */
  var KEY = 'less-vardcentralen-save-v1';

  LESS.store = {
    load: function () {
      try {
        var raw = global.localStorage.getItem(KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (e) { return null; }
    },
    save: function (obj) {
      try { global.localStorage.setItem(KEY, JSON.stringify(obj)); return true; }
      catch (e) { return false; }
    },
    clear: function () {
      try { global.localStorage.removeItem(KEY); } catch (e) { /* ignoreras */ }
    }
  };

  /* ---------- dom ---------- */
  LESS.$ = function (id) { return document.getElementById(id); };

  LESS.show = function (el, on) {
    if (typeof el === 'string') el = LESS.$(el);
    if (el) el.classList.toggle('hidden', !on);
  };

})(window);

/* ==== js/audio.js ==== */
/* audio.js – små fyrkantsvågsljud i Game Boy-anda (WebAudio, inga filer) */
(function (global) {
  'use strict';
  var LESS = global.LESS;

  var ctx = null, master = null, enabled = true;

  function ac() {
    if (ctx) return ctx;
    var C = global.AudioContext || global.webkitAudioContext;
    if (!C) return null;
    ctx = new C();
    master = ctx.createGain();
    master.gain.value = 0.09;
    master.connect(ctx.destination);
    return ctx;
  }

  /* En ton: fyrkantsvåg med hård av/på-kuvert = pulskanal-känsla */
  function tone(freq, start, dur, vol, type) {
    var c = ac(); if (!c) return;
    var o = c.createOscillator(), g = c.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, start);
    g.gain.setValueAtTime(0, start);
    g.gain.linearRampToValueAtTime(vol == null ? 1 : vol, start + 0.004);
    g.gain.setValueAtTime(vol == null ? 1 : vol, start + dur - 0.01);
    g.gain.linearRampToValueAtTime(0, start + dur);
    o.connect(g); g.connect(master);
    o.start(start); o.stop(start + dur + 0.02);
  }

  function seq(notes) {
    var c = ac(); if (!c || !enabled) return;
    if (c.state === 'suspended') c.resume();
    var t = c.currentTime + 0.01, i;
    for (i = 0; i < notes.length; i++) {
      var n = notes[i];
      if (n[0] > 0) tone(n[0], t, n[1], n[2], n[3]);
      t += n[1];
    }
  }

  var SFX = {
    /* textbokstav */
    blip:    [[880, 0.012, 0.35]],
    /* markörflytt */
    move:    [[660, 0.03, 0.5]],
    /* bekräfta */
    ok:      [[880, 0.04, 0.6], [1320, 0.06, 0.6]],
    /* tillbaka */
    back:    [[520, 0.05, 0.5], [390, 0.05, 0.5]],
    /* fel svar i faktakontroll */
    wrong:   [[220, 0.09, 0.7], [175, 0.14, 0.7]],
    /* patienten öppnar upp */
    warm:    [[660, 0.05, 0.5], [880, 0.05, 0.5], [1100, 0.09, 0.5]],
    /* patienten sluter sig */
    cold:    [[440, 0.06, 0.5], [330, 0.10, 0.5]],
    /* tiden rinner ut */
    tick:    [[300, 0.05, 0.6], [300, 0.05, 0.0], [300, 0.05, 0.6]],
    /* möte avslutat */
    done:    [[523, 0.07, 0.6], [659, 0.07, 0.6], [784, 0.07, 0.6], [1047, 0.20, 0.6]],
    /* dåligt resultat */
    fail:    [[392, 0.10, 0.6], [349, 0.10, 0.6], [294, 0.24, 0.6]],
    /* dörr / scenbyte */
    door:    [[520, 0.04, 0.5], [700, 0.04, 0.5]],
    /* nytt ärende */
    alert:   [[1047, 0.06, 0.6], [0, 0.04, 0], [1047, 0.06, 0.6]],
    /* pingis: racket och bordskant */
    studs:   [[740, 0.025, 0.5]],
    kant:    [[420, 0.025, 0.4]]
  };

  LESS.sfx = function (name) {
    if (!enabled) return;
    var s = SFX[name];
    if (s) seq(s);
  };

  LESS.audio = {
    toggle: function () { enabled = !enabled; if (enabled) LESS.sfx('ok'); return enabled; },
    set: function (v) { enabled = !!v; },
    get enabled() { return enabled; },
    /* måste triggas av användarinteraktion i vissa webbläsare */
    unlock: function () {
      var c = ac();
      if (c && c.state === 'suspended') c.resume();
    }
  };

})(window);

/* ==== js/art.js ==== */
/* art.js – all grafik ritas i kod (inga bildfiler).
   Allt sker i en 160x144-buffert med 16x16-rutor, precis som på GBC. */
(function (global) {
  'use strict';
  var LESS = global.LESS;

  var TS = 16;                       /* rutstorlek */
  LESS.TS = TS;

  /* ---------------- palett ---------------- */
  var P = {
    ink:      '#181410',
    line:     '#3a3630',
    floor:    '#eae2c8', floorD:  '#e0d7b8', floorL: '#f4eeda',
    carpet:   '#c07868', carpetD: '#a05e50',
    wall:     '#d8e2ea', wallD:   '#7d909c', wallSh: '#adc0cc',
    wood:     '#b0803c', woodD:   '#8a6028', woodL:  '#d0a060',
    steel:    '#b8bcc4', steelD:  '#888e98',
    glass:    '#a8d0e8', glassD:  '#78a8c8',
    green:    '#58a058', greenD:  '#3c7a3c',
    white:    '#f8f8f0',
    red:      '#c04838', blue: '#4870b0', sky: '#88c0e8',
    grass:    '#78b058', grassD: '#5c9040',
    shadow:   'rgba(24,20,16,.20)',
    /* Forsåker vårdcentrals profilfärger, hämtade ur logotypfilen */
    markDark: '#00443c', markMint: '#75d8c7',
    markMintD:'#4fae9e', markMintL:'#a6e8dd'

  LESS.PAL = P;

  function R(c, x, y, w, h, col) { c.fillStyle = col; c.fillRect(x | 0, y | 0, w | 0, h | 0); }

  /* ---------------- rutor ---------------- */
  /* Varje ritfunktion får (ctx, ox, oy) och ritar 16x16 pixlar. */
  var TILE = {

    floor: function (c, x, y) {              /* klinker i schackmönster */
      R(c, x, y, 16, 16, P.floor);
      R(c, x, y, 8, 8, P.floorL);
      R(c, x + 8, y + 8, 8, 8, P.floorL);
      R(c, x + 7, y, 1, 16, P.floorD);
      R(c, x, y + 7, 16, 1, P.floorD);
    },

    floor2: function (c, x, y) {              /* korridorvinyl med tunna fogar */
      R(c, x, y, 16, 16, P.floorL);
      R(c, x, y + 7, 16, 1, P.floor);
      R(c, x, y + 15, 16, 1, P.floor);
      R(c, x + 3, y + 3, 1, 1, P.floorD);
      R(c, x + 11, y + 11, 1, 1, P.floorD);
    },

    carpet: function (c, x, y) {
      R(c, x, y, 16, 16, P.carpet);
      R(c, x, y, 16, 1, P.carpetD); R(c, x, y + 15, 16, 1, P.carpetD);
      R(c, x + 3, y + 3, 10, 10, P.carpetD);
      R(c, x + 5, y + 5, 6, 6, P.carpet);
    },

    wall: function (c, x, y) {
      R(c, x, y, 16, 16, P.wall);
      R(c, x, y, 16, 3, P.wallSh);          /* taklist */
      R(c, x, y + 3, 16, 1, '#c3d2dc');
      R(c, x, y + 12, 16, 4, P.wallD);      /* golvlist */
      R(c, x, y + 12, 16, 1, '#5f727e');
      R(c, x + 7, y + 4, 1, 8, '#cbd8e2');  /* panelfog */
    },

    wallTop: function (c, x, y) {            /* mörk överkant mot taket */
      R(c, x, y, 16, 16, P.wallSh);
      R(c, x, y, 16, 4, '#6d8290');
      R(c, x, y + 14, 16, 2, '#c3d2dc');
    },

    wallGlass: function (c, x, y) {          /* innerfönster */
      R(c, x, y, 16, 16, P.wall);
      R(c, x + 1, y + 3, 14, 9, P.line);
      R(c, x + 2, y + 4, 12, 7, P.glass);
      R(c, x + 2, y + 4, 5, 3, P.glassD);
      R(c, x + 8, y + 4, 1, 7, P.line);
      R(c, x, y + 14, 16, 2, P.wallD);
    },

    window: function (c, x, y) {             /* fönster mot gatan */
      R(c, x, y, 16, 16, P.wall);
      R(c, x + 1, y + 2, 14, 11, P.line);
      R(c, x + 2, y + 3, 12, 9, P.sky);
      R(c, x + 2, y + 3, 12, 3, '#a8d8f0');
      R(c, x + 2, y + 9, 12, 3, P.grass);
      R(c, x + 8, y + 3, 1, 9, P.line);
      R(c, x + 2, y + 7, 12, 1, P.line);
      R(c, x, y + 14, 16, 2, P.wallD);
    },

    door: function (c, x, y) {
      R(c, x, y, 16, 16, P.wall);
      R(c, x + 1, y + 1, 14, 15, P.woodD);
      R(c, x + 2, y + 2, 12, 13, P.wood);
      R(c, x + 3, y + 3, 10, 5, P.woodL);
      R(c, x + 12, y + 9, 2, 2, P.steel);
    },

    doorSign: function (c, x, y) {           /* dörr med skylt ovanför */
      TILE.door(c, x, y);
      R(c, x + 2, y, 12, 4, P.white);
      R(c, x + 2, y, 12, 1, P.ink);
      R(c, x + 3, y + 1, 4, 1, P.line); R(c, x + 8, y + 1, 5, 1, P.line);
      R(c, x + 3, y + 2, 8, 1, P.line);
    },

    desk: function (c, x, y) {
      TILE.floor(c, x, y);
      R(c, x, y + 3, 16, 9, P.woodD);
      R(c, x, y + 3, 16, 6, P.wood);
      R(c, x, y + 3, 16, 1, P.woodL);
      R(c, x + 1, y + 12, 2, 4, P.woodD);
      R(c, x + 13, y + 12, 2, 4, P.woodD);
    },

    deskPc: function (c, x, y) {
      TILE.desk(c, x, y);
      R(c, x + 3, y - 6, 10, 8, P.line);     /* skärm sticker upp */
      R(c, x + 4, y - 5, 8, 6, '#284858');
      R(c, x + 5, y - 4, 6, 2, P.glass);
      R(c, x + 5, y - 1, 4, 1, P.glassD);
      R(c, x + 7, y + 2, 2, 1, P.steelD);
    },

    counter: function (c, x, y) {            /* receptionsdisk */
      TILE.floor(c, x, y);
      R(c, x, y + 1, 16, 12, P.woodD);
      R(c, x, y + 1, 16, 8, P.wood);
      R(c, x, y + 1, 16, 2, P.woodL);
      R(c, x, y + 9, 16, 1, P.woodD);
    },

    chair: function (c, x, y) {
      TILE.floor(c, x, y);
      R(c, x + 4, y + 2, 8, 3, P.blue);
      R(c, x + 4, y + 5, 8, 5, '#38548c');
      R(c, x + 6, y + 10, 1, 4, P.steelD);
      R(c, x + 9, y + 10, 1, 4, P.steelD);

    bench: function (c, x, y) {              /* väntrumsbänk */

      R(c, x, y + 5, 16, 5, '#4870b0');
      R(c, x + 1, y + 10, 2, 4, P.steelD);
      R(c, x + 13, y + 10, 2, 4, P.steelD);
    },

    plant: function (c, x, y) {
      TILE.floor(c, x, y);
      R(c, x + 5, y + 9, 6, 6, P.woodD);
      R(c, x + 6, y + 10, 4, 4, P.wood);
      R(c, x + 7, y + 4, 2, 6, P.greenD);
      R(c, x + 3, y + 3, 4, 4, P.green);
      R(c, x + 9, y + 3, 4, 4, P.green);
      R(c, x + 6, y + 1, 4, 4, P.green);
      R(c, x + 4, y + 4, 1, 1, P.greenD); R(c, x + 11, y + 4, 1, 1, P.greenD);
    },

    brits: function (c, x, y) {              /* undersökningsbrits */
      TILE.floor(c, x, y);
      R(c, x, y + 2, 16, 9, P.steelD);
      R(c, x, y + 2, 16, 6, P.white);
      R(c, x, y + 2, 16, 1, '#d8e8f0');
      R(c, x + 1, y + 11, 2, 4, P.steelD);
      R(c, x + 13, y + 11, 2, 4, P.steelD);
    },

    shelf: function (c, x, y) {
      R(c, x, y, 16, 16, P.wall);
      R(c, x, y + 1, 16, 13, P.woodD);
      R(c, x + 1, y + 2, 14, 4, '#6a4a20');
      R(c, x + 1, y + 8, 14, 4, '#6a4a20');
      R(c, x + 2, y + 2, 2, 4, P.red); R(c, x + 5, y + 2, 2, 4, P.blue);
      R(c, x + 8, y + 2, 3, 4, P.green); R(c, x + 12, y + 2, 2, 4, P.gold || '#d8a828');
      R(c, x + 2, y + 8, 3, 4, P.blue); R(c, x + 6, y + 8, 2, 4, P.white);
      R(c, x + 9, y + 8, 2, 4, P.red);

    poster: function (c, x, y) {
      R(c, x, y, 16, 16, P.wall);
      R(c, x + 2, y + 2, 12, 11, P.ink);
      R(c, x + 3, y + 3, 10, 9, '#f0e0a0');

    cabinet: function (c, x, y) {

    logga: function (c, x, y) {              /* logotypmärket som skylt på vägg */

      R(c, x + 5, y + 15, 6, 1, P.markDark);

    skynke: function (c, x, y) {           /* tygskynke i korridorens ände */

    topplista: function (c, x, y) {        /* topplistan på skyddsrummets vägg */
      TILE.betong(c, x, y);
      R(c, x + 1, y + 1, 14, 13, '#3a3a34');

  /* ---------------- Forsåker-märket ---------------- */
  /* Rund platta i mint med ett mörkgrönt F under ett tildetecken.
     Ritas på ett 16-enheters rutnät och skalas med heltal (k=1 → 16 px,
     k=2 → 32 px) så att pixlarna förblir kvadratiska.                */
  LESS.drawLogga = function (c, ox, oy, k, utanRing, glyfFarg) {
    k = k || 1;
    var mork = glyfFarg || P.markDark;
    var r = 8, cx = 8, cy = 8, y, dx, x0, w;

    function u(x, y, w, h, col) { R(c, ox + x * k, oy + y * k, w * k, h * k, col); }

    if (!utanRing) {
      for (y = 0; y < 16; y++) {
        dx = Math.floor(Math.sqrt(Math.max(0, r * r - (y - cy + 0.5) * (y - cy + 0.5))));
        x0 = cx - dx; w = dx * 2;
        if (w > 0) u(x0, y, w, 1, P.markMint);
      }
      /* liten dager uppe till vänster */
      u(4, 2, 3, 1, P.markMintL); u(3, 3, 2, 1, P.markMintL);
    }

    /* tilde */
    u(5, 3, 2, 1, mork);
    u(7, 2, 2, 1, mork);
    u(9, 3, 2, 1, mork);
    /* F: stam, övre arm och genomgående tvärslå */
    u(6, 5, 5, 2, mork);
    u(6, 5, 2, 8, mork);
    u(4, 8, 6, 2, mork);
  };

    var c = cv.getContext('2d');

      R(c, 12, 2, 1, 4, hair);

      if (style === 'knut') { R(c, 6, 0, 4, 2, hair); R(c, 3, 3, 1, 3, hair); R(c, 12, 3, 1, 3, hair); }
      if (style === 'kort') { R(c, 4, 4, 2, 1, hair); R(c, 10, 4, 2, 1, hair); }

/* overgang.js – spiralövergången ("swirl")

   Game Boy-spelen kunde inte tona ner en bild pixel för pixel. Det de gjorde
   i stället var att fylla skärmen med bakgrundsrutor i en spiral utifrån och
   in. Effekten är billig, tydlig och omedelbart igenkännbar – och den säger
   något den vanliga toningen inte säger: nu byter vi läge, inte bara rum.

   Här används den när spelaren byter roll mitt i ett ärende: utredningen är
   klar, läkaren är hämtad, och den man styr är plötsligt någon annan.        */
(function (global) {
  'use strict';
  var LESS = global.LESS;

  var BLOCK = 8;                       /* 8x8 = 20 x 18 rutor på GB-skärmen */
  var KOL = 160 / BLOCK, RAD = 144 / BLOCK;
  var TOTALT = KOL * RAD;

  /* Rektangulär spiral utifrån och in – exakt den ordning rutorna fylls i. */
  var ORDNING = (function () {
    var ut = [], x0 = 0, y0 = 0, x1 = KOL - 1, y1 = RAD - 1, x, y;
    while (x0 <= x1 && y0 <= y1) {
      for (x = x0; x <= x1; x++) ut.push(x + y0 * KOL);
      for (y = y0 + 1; y <= y1; y++) ut.push(x1 + y * KOL);
      if (y1 > y0) for (x = x1 - 1; x >= x0; x--) ut.push(x + y1 * KOL);
      if (x1 > x0) for (y = y1 - 1; y > y0; y--) ut.push(x0 + y * KOL);
      x0++; y0++; x1--; y1--;
    }
    return ut;
  })();

  function ritaSpiral(c, antal, farg) {
    if (antal <= 0) return;
    c.fillStyle = farg;
    var n = Math.min(antal, TOTALT), i, r;
    for (i = 0; i < n; i++) {
      r = ORDNING[i];
      c.fillRect((r % KOL) * BLOCK, ((r / KOL) | 0) * BLOCK, BLOCK, BLOCK);
    }
  }

  /* Samma spiral baklänges: rutorna som ligger kvar är de som ännu inte
     avtäckts, så den nya bilden växer fram inifrån och ut. */
  function ritaSpiralKvar(c, antal, farg) {
    c.fillStyle = farg;
    var i, r;
    for (i = antal; i < TOTALT; i++) {
      r = ORDNING[i];
      c.fillRect((r % KOL) * BLOCK, ((r / KOL) | 0) * BLOCK, BLOCK, BLOCK);
    }
  }

  /* swirl(mitt, klar): spiralen fyller skärmen, mitt() byter scen bakom den,
     och spiralen släpper sedan fram det nya. mitt() får alltså ändra allt –
     roll, figurer, position – utan att en enda bildruta läcker igenom.      */
  function swirl(mitt, klar, opts) {
    opts = opts || {};
    var farg = opts.farg || '#10100c';
    var in_ = opts.in == null ? 620 : opts.in;      /* ms att fylla */
    var hall = opts.hall == null ? 220 : opts.hall; /* ms svart */
    var ut = opts.ut == null ? 560 : opts.ut;       /* ms att avtäcka */

    var forra = LESS.getScene();
    var t0 = null, fas = 0, mittKord = false;

    var scen = {
      draw: function (c, t) {
        if (t0 === null) t0 = t;
        var d = t - t0;

        if (fas === 0) {
          if (forra && forra.draw) forra.draw(c, t);
          ritaSpiral(c, Math.ceil((d / in_) * TOTALT), farg);
          if (d >= in_) { fas = 1; t0 = t; }
          return;
        }
        if (fas === 1) {
          c.fillStyle = farg; c.fillRect(0, 0, 160, 144);
          if (!mittKord) {
            mittKord = true;
            if (mitt) mitt();
            /* Satte mitt() en egen scen är det den som ska avtäckas. Rörde
               den inte scenen ligger den gamla kvar – och att läsa tillbaka
               den här utan kontroll skulle göra spiralen till sin egen
               bakgrund, det vill säga oändlig rekursion. */
            var ny = LESS.getScene();
            if (ny && ny !== scen) forra = ny;
            LESS.setScene(scen);
          }
          if (d >= hall) { fas = 2; t0 = t; }
          return;
        }
        if (forra && forra.draw) forra.draw(c, t);
        ritaSpiralKvar(c, Math.ceil((d / ut) * TOTALT), farg);
        if (d >= ut) {
          fas = 3;
          LESS.setScene(forra);
          if (klar) klar();
        }
      }
    };

    LESS.setScene(scen);
  }

  LESS.swirl = swirl;
  LESS.swirlOrdning = ORDNING;

})(window);

      var i;
      for (i = 0; i < items.length && items[sel] && items[sel].disabled; i++) sel = (sel + 1) % items.length;

      el.classList.toggle('val', opts.layout === 'val');

        var html = '', it;

                  '<span class="cur">▶</span>' +
                  '<span class="txt">' + LESS.esc(it.text) + '</span>' +
                  (it.cost != null ? '<span class="cost">' + LESS.esc(it.cost) + '</span>' : '') +
                  '</div>';

        if (opts.fot) html += '<div class="hint">' + LESS.esc(opts.fot) + '</div>';

    visaPanel: function (titel, html, fot) {

    /* Ett riktigt textfält i en panel – signaturen på planschen och namnet
       på topplistan använder samma ruta. Tangentbordet går till fältet så
       länge det har fokus (se skriverText ovan), och Enter stoppas från att
       bubbla vidare: annars läser spelet samma tryck som A och öppnar rutan
       igen i samma ögonblick som den stängts. */
    textInmatning: function (opts, klar) {
      var h = (opts.html || '') +
        '<div class="signfalt"><input id="txtfalt" type="text" maxlength="' + (opts.max || 60) + '" ' +
        'autocomplete="off" spellcheck="false" placeholder="' +
        LESS.esc(opts.platshallare || '') + '"></div>' +
        '<p class="planschbak">Enter sparar. Esc avbryter.</p>';

      var falt = $('txtfalt');
      falt.value = opts.varde || '';
      falt.focus();
      falt.select();

      var handler = null;
      function stang(sparat) {
        var v = falt.value;
        falt.removeEventListener('keydown', tangent);
        falt.blur();
        input.pop(handler);
        LESS.sfx(sparat ? 'done' : 'back');
        klar(sparat ? v : null);
      }
      function tangent(e) {
        if (e.key !== 'Enter' && e.key !== 'Escape') return;
        e.preventDefault();
        e.stopPropagation();
        stang(e.key === 'Enter');
      }
      falt.addEventListener('keydown', tangent);
      /* Reserv för pekskärm och för den som ändå trycker A eller B. */
      handler = input.push(function (k) {
        if (k === 'a') stang(true);
        else if (k === 'b' || k === 'meny') stang(false);
      });
    },

      var b = $('panel-body');
      if (b && el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest' });
    },

    panel: function (title, html, cb) {

/* ==== js/state.js ==== */
/* state.js – spelarens tillstånd, progression och repetitionskö.

   Pedagogiken sitter till stor del här:
   - principKö      : missade principer köas för återkommande övning (spacing)
   - mästerskap     : handledartipsen tonas bort när rollen sitter (fading)
   - kampanjbeslut  : tidigare beslut följer med patienten genom kedjan       */

(function (global) {
  'use strict';
  var LESS = global.LESS;

  var DEF = {
    v: 1,
    spelare: { namn: 'DU', roll: null },
    lage: null,                    /* 'kampanj' | 'drill' */
    kampanj: { arende: 0, steg: 0, beslut: {}, klara: [] },
    drill: { roll: null, spelade: {} },
    resultat: {},                  /* fallId -> {basta, spel, senaste} */
    principer: {},                 /* principId -> {ratt, fel, forfallen} */
    ko: [],                        /* principId-kö för repetition */
    mastery: {},                   /* roll -> antal guld */
    installningar: { tips: true, ljud: true, snabbtext: false },
    skattningar: {},               /* frågeId -> {varde, kommentar, tid} */
    namn: '',                      /* signatur på planschen */
    pingis: { hittat: false, vinster: {}, forluster: {} },
    statistik: { moten: 0, guld: 0, silver: 0, brons: 0, omtag: 0, minuter: 0 }
  };

  function deepCopy(o) { return JSON.parse(JSON.stringify(o)); }

  function merge(base, saved) {
    var out = deepCopy(base), k;
    if (!saved) return out;
    for (k in saved) {
      if (!Object.prototype.hasOwnProperty.call(saved, k)) continue;
      if (out[k] && typeof out[k] === 'object' && !Array.isArray(out[k]) &&
          saved[k] && typeof saved[k] === 'object' && !Array.isArray(saved[k])) {
        out[k] = merge(out[k], saved[k]);
      } else {
        out[k] = saved[k];
      }
    }
    return out;
  }

  var S = merge(DEF, LESS.store.load());

  var state = {
    get data() { return S; },

    spara: function () { LESS.store.save(S); },

    nollstall: function () {
      S = deepCopy(DEF);
      LESS.store.clear();
    },

    /* Kampanjen är klarad när alla ärenden är avverkade. Det är nyckeln som
       låser upp de oplanerade besöken. */
    kampanjKlarad: function () {
      var n = (LESS.kampanj && LESS.kampanj.arenden) ? LESS.kampanj.arenden.length : 0;
      return n > 0 && S.kampanj.arende >= n;
    },

    finnsSparat: function () {
      return S.statistik.moten > 0 || S.kampanj.arende > 0 || S.kampanj.steg > 0;
    },

    /* ---------- resultat ---------- */

    /* betyg: 'guld' | 'silver' | 'brons' | 'omtag' */
    registrera: function (fallId, roll, betyg, principer, minuterKvar) {
      var rang = { omtag: 0, brons: 1, silver: 2, guld: 3 };
      var r = S.resultat[fallId] || { basta: 'omtag', spel: 0, senaste: null };
      r.spel += 1;
      r.senaste = betyg;
      if (rang[betyg] > rang[r.basta]) r.basta = betyg;
      S.resultat[fallId] = r;

      S.statistik.moten += 1;
      S.statistik[betyg] = (S.statistik[betyg] || 0) + 1;
      S.statistik.minuter += Math.max(0, Math.round(minuterKvar || 0));

      if (betyg === 'guld') S.mastery[roll] = (S.mastery[roll] || 0) + 1;

      /* principer: {id: true/false} – true = tillämpad, false = missad */
      Object.keys(principer || {}).forEach(function (pid) {
        var p = S.principer[pid] || { ratt: 0, fel: 0 };
        if (principer[pid]) {
          p.ratt += 1;
          /* två rätt i rad tar bort principen ur repetitionskön */
          if (p.ratt >= 2) state.taBortUrKo(pid);
        } else {
          p.fel += 1;
          p.ratt = 0;
          state.laggIKo(pid);
        }
        S.principer[pid] = p;
      });

      state.spara();
      return r;
    },

    /* ---------- repetitionskö (spacing) ---------- */

    laggIKo: function (pid) {
      if (S.ko.indexOf(pid) < 0) S.ko.push(pid);
    },
    taBortUrKo: function (pid) {
      var i = S.ko.indexOf(pid);
      if (i >= 0) S.ko.splice(i, 1);
    },
    ko: function () { return S.ko.slice(); },

    /* ---------- fading av handledartips ---------- */

    tipsPa: function (roll) {
      if (!S.installningar.tips) return false;
      return (S.mastery[roll] || 0) < 2;
    },

    /* ---------- kampanj ---------- */

    kampanjBeslut: function (nyckel, varde) {
      S.kampanj.beslut[nyckel] = varde;
      state.spara();
    },
    hamtaBeslut: function (nyckel) { return S.kampanj.beslut[nyckel]; },

    kampanjKlart: function (fallId) {
      if (S.kampanj.klara.indexOf(fallId) < 0) S.kampanj.klara.push(fallId);
      state.spara();
    },

    /* ---------- frågeplanscherna ---------- */

    skatta: function (fragaId, varde, kommentar) {
      S.skattningar[fragaId] = {
        varde: LESS.clamp(Math.round(varde), 0, 100),
        kommentar: kommentar || '',
        tid: new Date().toISOString().slice(0, 10)
      };
      state.spara();
    },
    minSkattning: function (fragaId) { return S.skattningar[fragaId] || null; },
    antalSkattningar: function () { return Object.keys(S.skattningar).length; },

    /* ---------- drill ---------- */

    drillSpelad: function (fallId) {
      S.drill.spelade[fallId] = (S.drill.spelade[fallId] || 0) + 1;
      state.spara();
    },

    /* Väljer nästa drillfall: minst spelat först, men fall som tränar en
       princip i repetitionskön går före (retrieval practice på det som svajar). */
    nastaDrill: function (fall) {
      var ko = S.ko, spelade = S.drill.spelade;
      var poang = fall.map(function (f) {
        var traffar = 0;
        (f.principer || []).forEach(function (p) { if (ko.indexOf(p) >= 0) traffar++; });
        return { f: f, p: traffar * 100 - (spelade[f.id] || 0) * 10 + Math.random() * 5 };
      });
      poang.sort(function (a, b) { return b.p - a.p; });
      return poang.length ? poang[0].f : null;
    }
  };

  LESS.state = state;

})(window);

        motivering: 'Det som står i en triageanteckning är oftast kontaktorsak, några symtom och åtgärden: "bokas till fysioterapeut 12/9". Det som sällan står är vad jag frågade om och vilket svar jag fick – att blås- och tarmfunktionen var normal, att hon svarade nej på frågan om att inte vilja leva, att inget kroppsligt är utrett. Skälet är inte lathet utan tempo: nästa ärende blinkar redan, och fritext tar tid som fältet för bokning inte gör. Konsekvensen märks först när något går fel, för då finns bara bokningen kvar och ingen kan se vad jag faktiskt visste. En rimlig ribba är tre rader: vad jag frågat och svaret, varför den vårdnivån och inte läkare, och vad som återstår obesvarat och för vem. Det tar under en minut när formuleringen finns färdig – och det är den som saknas.',
        status: 'skattad av rådgivare' },

      { id: 'ssk-rodflagga-rygg-varje-gang',
        fraga: 'Ställs frågorna om blås- och tarmfunktion och domning i grenen i varje ryggärende?',
        bakgrund: 'I ssk-bengt och ssk-hasse är de obligatoriska. Frågan är om de ställs varje gång i verkligheten, eller bara när något känns fel.',
        berorFall: ['ssk-bengt', 'ssk-hasse'],
        skattning: 45,
        sakerhet: 'medel',
        motivering: 'Frågan är känd av alla och finns i varje rådgivningsstöd, så det handlar inte om kunskap. Den ställs säkert nästan alltid vid akut ryggskott och nydebuterad smärta. Den ställs betydligt mer sällan när ärendet ser administrativt ut från början – "ryggen igen, han vill ha förlängning" – och det är där den behövs. Det som får den att falla bort i chatt är dessutom formen: den ställs i ett block tillsammans med tre andra frågor, patienten svarar "nej inget sånt" på hela blocket, och det svaret går varken att lita på eller granska i efterhand. Jag skattar 45 för "ställs ensam och besvaras entydigt". Skatta det du gör en vanlig tisdag med tjugo ärenden i kön, inte det du gör när du är utvilad.',
        status: 'skattad av rådgivare' },

      { id: 'ssk-tid-per-chattarende',
        fraga: 'Hinner du lägga en kvart på ett enskilt chattärende?',
        bakgrund: 'Spelets sjuksköterskefall har 9–16 minuters budget. Om ett chattärende i praktiken tar fem minuter är facit skrivet för en verklighet som inte finns.',
        berorFall: ['ssk-anna', 'ssk-bengt', 'ssk-carina', 'ssk-hasse', 'ssk-iris'],
        skattning: 20,
        sakerhet: 'medel',
        motivering: 'Ett chattpass mäts i ärenden per timme, inte i minuter per ärende, och flera chattar hanteras parallellt. Det normala är fem till tio minuter, och en del av den tiden är väntan på att patienten ska skriva klart. En kvart förekommer, men då är det ett ärende som blivit svårt – och priset betalas av kön. Det talar för att spelets budgetar är generösa, och samtidigt för att de är rätt satta pedagogiskt: poängen är att spelaren ska känna att fyra frågor är dyrare än tre. Det jag vill veta är om siffran känns hånfull för den som sitter i kön. Om den gör det ska fallen kortas, inte försvaras.',
        status: 'skattad av rådgivare' }
    ],

    psykolog: [
      { id: 'psy-ikbt-samma-vecka',
        fraga: 'Går det att starta iKBT med behandlarstöd inom en vecka från första psykologbesöket?',
        bakgrund: 'Guldsvaret i psy-anna förutsätter det.',
        berorFall: ['psy-anna'],
        skattning: 30, sakerhet: 'låg',
        motivering: 'iKBT med behandlarstöd finns i de flesta regioner via stöd- och behandlingsplattformen, så tekniken är sällan hindret. Flaskhalsen är en behandlare med ledig tid att följa modulerna vecka för vecka. Att starta samma vecka förutsätter alltså inte en plattform utan en person.',
        status: 'skattad av rådgivare' },

      { id: 'psy-tid-45min',
        fraga: 'Hinner man en situationsanalys, psykoedukation, sömngenomgång och ett försäkringsmedicinskt underlag på ett nybesök?',
        bakgrund: 'psy-anna har 44 minuters budget och innehåller alla fyra momenten.',
        berorFall: ['psy-anna', 'psy-katrin'],
        skattning: 35, sakerhet: 'medel',
        motivering: 'Ett psykologiskt nybesök är ofta bokat 45–60 minuter, så tiden finns på papperet. Fyra fullständiga moment i samma besök är däremot en bra dag, inte en vanlig. Det som oftast trängs undan är sömnen och underlaget, i den ordningen.',
        status: 'skattad av rådgivare' },

      { id: 'psy-boka-lakartid',
        fraga: 'Kan du som psykolog boka en läkartid åt din patient inom en vecka, eller måste patienten själv ringa?',
        bakgrund: 'Guldsvaret i psy-katrin bygger på att psykologen tar ägarskapet för den somatiska frågan och bokar tiden. Går det inte faller skillnaden mellan guld och silver i fallet.',
        berorFall: ['psy-katrin'],
        skattning: 25, sakerhet: 'låg',
        motivering: 'Att skriva en intern konsultationsfråga eller lägga en bokning till en kollega förekommer, men det vanliga är att psykologen skriver i journalen och ber patienten kontakta receptionen. Skillnaden är hela poängen i det här fallet: en fråga vars ägare är patienten själv har ingen ägare när patienten är för trött för att orka. Delfrågan som avgör: har du någon gång själv lagt en läkartid i kalendern åt en av dina patienter? Berör även läkarrådgivaren.',
        status: 'skattad av rådgivare' },

      { id: 'psy-somatisk-anamnes',
        fraga: 'Frågar du om vikt, mage, hud, hår och blödningar vid ett psykologiskt nybesök om trötthet?',
        bakgrund: 'I psy-katrin är det den enda fråga som skiljer fallen åt, och psykologen är sista ledet innan ett underlag skrivs. Se lak-somatisk-utredning-f43 och ssk-somatisk-fraga-triage.',
        berorFall: ['psy-katrin', 'psy-anna'],
        skattning: 20, sakerhet: 'medel',
        motivering: 'Frågan är tillåten, tar under en minut och kräver ingen medicinsk kompetens – det är en anamnesfråga, inte en undersökning. Ändå ligger den utanför det jag är van att göra: jag frågar om sömn, aptit och alkohol för de står i mallen, men inte om blödningar. Skälet är att jag i det gamla flödet visste att en läkare redan tagit den. I LESS har ingen gjort det. Jag skattar 20 för att någon av frågorna ställs och betydligt lägre för att de journalförs.',
        status: 'skattad av rådgivare' },

      { id: 'psy-avbryta-bokad-utredning',
        fraga: 'Har du avbrutit en bokad försäkringsmedicinsk utredning mitt i, för att en annan fråga behövde besvaras först?',
        bakgrund: 'Det centrala momentet i psy-katrin. Om det aldrig görs är fallets guldsvar ett ideal snarare än en praxis, och då behöver fallet lära ut hur man motiverar det – inte bara att man ska.',
        berorFall: ['psy-katrin'],
        skattning: 10, sakerhet: 'låg',
        motivering: 'Trycket åt andra hållet är starkt och kommer från alla håll samtidigt: tiden är bokad, patienten har tagit ledigt, remissen har en frågeställning och nästa besök är om tre veckor. Att skriva ett underlag med reservation känns som kompromissen, och det är den vanliga lösningen. Jag tror att den rena avbrytningen är sällsynt, och att det snarare beror på strukturen än på bedömningen. Delfrågan som avgör: när gjorde du det senast, och vad kostade det dig?',
        status: 'skattad av rådgivare' },

      { id: 'psy-skiftarbete-somnrad',
        fraga: 'Anpassar du sömnråden efter skiftschema, eller ger du standardrådet om fast uppstigningstid?',
        bakgrund: 'I psy-anna är fast uppstigningstid guldsvaret. I psy-katrin är samma råd omöjligt att följa och en av distraktorerna. Skillnaden är hela poängen med att sömnen får ett eget spår.',
        berorFall: ['psy-katrin', 'psy-anna'],
        skattning: 20, sakerhet: 'medel',
        motivering: 'Sömnhygien och KBT-i vid insomni är byggda kring ett dygn med sömn på natten, och materialet vi delar ut är skrivet för det. Skiftanpassade råd – ankartid, mörkläggning på dagen, planerad sömn före passet, koffeintiming – finns i litteraturen men sällan i mottagningens mappar. Min gissning är att den som möter en nattarbetare oftast antingen ger standardråden ändå eller hoppar över sömnen. Ett omöjligt råd kostar mer än inget råd: patienten lär sig att hon misslyckas med det vården ber henne göra.',
        status: 'skattad av rådgivare' }
    ],

    arbetsterapeut: [
      { id: 'at-arbetsplatsbedomning',
        fraga: 'Gör arbetsterapeuten på din mottagning arbetsplatsbesök ute hos patientens arbetsgivare?',
        bakgrund: 'Bästa beslutsalternativet i arb-carina innehöll tidigare "arbetsplatsbedömning bokad". Utvecklaren har aldrig sett det göras och misstänker att det hör till företagshälsovården eller specialiserad rehabilitering.',
        berorFall: ['arb-carina'],
        skattning: 10,
        sakerhet: 'medel',
        motivering: 'Jag tror att det är ovanligare än "undantagsvis". Arbetsanpassning på plats är arbetsgivarens ansvar enligt arbetsmiljölagstiftningen, och den som köper in kompetens dit är arbetsgivaren via företagshälsovården – inte patienten via vårdcentralen. Flera regionala uppdragsbeskrivningar avgränsar dessutom bort det arbetsinriktade helt; Region Uppsalas rutin för arbetsterapi i primärvård skriver rakt ut att arbetsförmågebedömningar inte ingår, och att insatser inte ens utförs i patientens eget hem. Nationella vårdprogrammet för tumbasartros har ortos, handträning och ergonomisk rådgivning som grundbehandling – inget arbetsplatsbesök. Det förekommer ändå: i arbetsinriktade rehabteam och multimodal rehabilitering i primärvård, och när ADA+ (ArbetsplatsDialog för Arbetsåtergång) används, ofta av rehabkoordinator. Men det är enstaka mottagningar, inte vardag. Berör även rehabkoordinator-rådgivaren.',
        status: 'skattad av rådgivare' },

      { id: 'at-arbetsinriktat-uppdrag',
        fraga: 'Ingår arbetsinriktade insatser i primärvårdsarbetsterapeutens uppdrag?',
        bakgrund: 'Hela arbetsterapeutens roll i LESS bygger på arbetsinriktat arbete. Alternativet är att tyngdpunkten i praktiken är ADL, hjälpmedel, kognitivt stöd och äldre.',
        berorFall: ['arb-carina', 'arb-gunilla'],
        skattning: 30,
        sakerhet: 'medel',
        motivering: 'Jag skattar det arbetsinriktade som en namngiven del av uppdraget, inte ergonomiska råd som råkar handla om jobbet. Sådana råd ges hela tiden – de ingår i handrehabilitering och i stress- och utmattningsspåret – och den siffran skulle vara hög. Men att ta emot en yrkesverksam person med arbetsåtergång som mål, och beskriva aktivitetsförmåga i förhållande till arbetsuppgifter, är i flera regioner uttryckligen bortavgränsat. Bemanningen pekar åt samma håll: en arbetsterapeut på deltid med lång kö prioriterar efter medicinskt behov, och yrkesverksamma med handbesvär hamnar sällan högst. Det här är den fråga i listan där jag helst vill bli motbevisad – blir svaret lågt vilar hela arbetsterapeutrollen i LESS på en resurs som inte finns.',
        status: 'skattad av rådgivare' },

      { id: 'at-ortos-utprovning',
        fraga: 'Provas tumortoser ut och lämnas ut vid besöket på vårdcentralen?',
        bakgrund: 'I arb-carina känner patienten skillnaden i rummet, vilket förutsätter att ortosen finns på plats.',
        berorFall: ['arb-carina'],
        skattning: 55,
        sakerhet: 'medel',
        motivering: 'Två frågor i en, och det är där osäkerheten sitter. Kommer patienten till en arbetsterapeut som har handrehabilitering i uppdraget är utprovning vid besöket nästan självklar – ortos är grundbehandling vid tumbasartros, prefabricerade mjuka tumortoser brukar finnas i skåpet och en hård ortos tillverkas på plats. Där skulle jag skatta 85. Men handrehabilitering ligger i flera regioner på en central enhet, inte på vårdcentralen, och sortiment och kostnadsansvar varierar. 55 är min sammanvägning. Delfrågan som avgör: har din mottagning ortoser i skåpet?',
        status: 'skattad av rådgivare' },

      { id: 'at-skriftligt-underlag-arbetsgivare',
        fraga: 'Skriver arbetsterapeuten en skriftlig beskrivning av aktivitetsbegränsningar som patienten själv tar med till sin chef?',
        bakgrund: 'Det är den realistiska ersättningen för "arbetsplatsbedömning bokad" i arb-carina, och det ligger redan i bästa alternativet i arb-gunilla. Om inte heller detta görs står båda fallen utan sin viktigaste åtgärd.',
        berorFall: ['arb-carina', 'arb-gunilla'],
        skattning: 35,
        sakerhet: 'låg',
        motivering: 'Det är den åtgärd som är billigast, mest juridiskt renhårig och mest i linje med att inte ta över patientens ansvar – patienten bär själv informationen till arbetsgivaren, så ingen sekretessprövning behövs. Men jag har inte sett någon regional mall för det, och utan mall blir det något var och en hittar på. Min gissning är att det görs av en del, ofta som en utskriven journalanteckning eller ett par punkter på ett papper, och att det inte är rutin någonstans. Låg säkerhet – det här är den fråga där jag tror att spridningen mellan mottagningar är störst.',
        status: 'skattad av rådgivare' },

      { id: 'at-nybesok-hinner-med',
        fraga: 'Ryms vardagskartläggning, aktivitetsanalys och ortosutprovning inom ett och samma nybesök?',
        bakgrund: 'arb-carina har 25 minuters budget och innehåller alla tre momenten plus ett underlag till läkare.',
        berorFall: ['arb-carina'],
        skattning: 40,
        sakerhet: 'medel',
        motivering: 'Ett arbetsterapeutiskt nybesök med handrehabilitering är i min erfarenhet bokat 45–60 minuter, inte 25, och då hinns det mesta med. Frågan är om alltihop ryms i ett besök eller måste delas på två – och om utprovningen görs samma dag eller vid återbesöket. Jag tror att det oftast blir två besök när dygnsgenomgången också ska hinnas med. Skatta det du faktiskt hinner en vanlig tisdag, inte det du hinner en bra dag.',
        status: 'skattad av rådgivare' }
    ],

    lakare: [
      { id: 'lak-jourpass-schemalagt',
        fraga: 'Finns det på din mottagning en läkare som en förmiddag i veckan är schemalagd utan egna bokade patienter?',
        bakgrund: 'Hela LESS-upplägget står och faller med det. Utan en läkare som är fri när utredningen blir klar blir modellen en inkorg i stället för ett möte.',
        berorFall: ['lak-anna', 'lak-bengt'],
        skattning: 15,
        sakerhet: 'medel',
        motivering: 'Dela frågan i två. Att det finns ett pass utan förbokade patienter i schemat är inte ovanligt – dagjour, akutslinga och administrativ tid finns på de flesta vårdcentraler. Men den tiden är inte fri. Dagjouren fylls av akuta besök inom timmen, och adm-tiden går åt till provsvar, receptförnyelser, telefonlistan och de intyg som redan ligger. En läkare som är schemalagd för att vara tillgänglig när en kollega knackar, och som får sitta av tiden om ingen knackar, är något annat. Jag har svårt att se en verksamhetschef med två vakanta läkartjänster försvara en obokad läkarförmiddag i veckan mot tillgänglighetskraven – och hyrläkartid köps per producerad besökstid, vilket gör just den timmen dyrast av alla. Blir svaret här under 20 vilar LESS på en resurs som måste beslutas fram, inte på en som finns. Då är det nästa fråga i listan som modellen måste bäras av i stället.',
        status: 'skattad av rådgivare' },

      { id: 'lak-avbryta-passet',
        fraga: 'Kan du avbrytas 10–15 minuter mitt i ditt pass för att gå in till en kollegas patient?',
        bakgrund: 'Den realistiska varianten av jourupplägget, om ingen fri jourläkare går att bemanna. Det är den lägre ribba LESS i så fall måste konstrueras för.',
        berorFall: ['lak-anna', 'lak-bengt'],
        skattning: 45,
        sakerhet: 'medel',
        motivering: 'Att bli hämtad av en sjuksköterska för en akut bedömning sker dagligen och ifrågasätts inte. Att bli hämtad av en psykolog eller fysioterapeut för en försäkringsmedicinsk föredragning är ovanligare, men hindret är kulturellt snarare än schematekniskt – tiden finns lika lite och lika mycket i båda fallen. Priset är att nästa patient får vänta ett kvart, och det priset betalas redan varje dag. Osäkerheten sitter i om det går att göra planerat och återkommande, eller bara när det råkar passa. Skatta det som faktiskt går, inte det som borde gå.',
        status: 'skattad av rådgivare' },

      { id: 'lak-trepartsmote',
        fraga: 'Förekommer trepartsmöten där utredare, läkare och patient träffas samtidigt?',
        bakgrund: 'I LESS hämtar utredaren läkaren, föredrar ärendet och går sedan in tillsammans med patienten kvar i rummet.',
        berorFall: ['lak-anna', 'lak-bengt'],
        skattning: 20,
        sakerhet: 'medel',
        motivering: 'Formen finns och är inte främmande. Den vanligaste varianten är intern: AT- eller ST-läkare föredrar ett ärende för sin handledare, som sedan går in till patienten – strukturellt exakt det LESS beskriver, och det görs varje dag på varje mottagning med utbildningsuppdrag. Rehabkoordinator, läkare och patient sitter ibland tillsammans i långa ärenden, och gemensam bedömning läkare–fysioterapeut förekommer där det finns MMR-uppdrag. Men som rutin i ett vanligt sjukskrivningsärende, med två professioner och patienten samtidigt, är det ovanligt: det kostar dubbel personaltid för ett besök. Att handledningsvarianten är så etablerad är samtidigt det starkaste argumentet för att modellen är genomförbar – den bryter inte mot något, den är bara ovanlig.',
        status: 'skattad av rådgivare' },

      { id: 'lak-signera-annans-underlag',
        fraga: 'Skriver du intyg där bedömningen i huvudsak bygger på en annan professions anteckning?',
        bakgrund: 'LESS-modellens juridiska kärna. Frågan gäller vad som faktiskt görs i dag, inte vad LESS föreslår.',
        berorFall: ['lak-anna', 'lak-bengt', 'lak-brist'],
        skattning: 55,
        sakerhet: 'medel',
        motivering: 'Omskattad efter modellförtydligandet, och uppåt. Jag tog tidigare ett medelvärde av två olika saker, vilket var fel sätt att svara. Den informella varianten är vanlig och underskattas: fysioterapeuten skriver i journalen att hon föreslår 50 procent, psykologen ringer, rehabkoordinatorn lägger en lapp – och läkaren skriver intyget utan att ha träffat patienten den dagen. Vid förlängningar är det snarare regel än undantag, särskilt när kontinuiteten är bruten och den som signerar är en hyrläkare som aldrig sett personen. Det är just det som gör LESS-frågan skarp: underlaget kommer redan från någon annan i dag, men utan struktur, utan källangivelse och utan att patienten träffar läkaren. Modellen formaliserar en praxis som redan finns, den skapar den inte. Den formaliserade varianten – ett skrivet försäkringsmedicinskt underlag som läkaren granskar – skattar jag däremot till omkring 10.',
        status: 'omskattad av rådgivare' },

      { id: 'lak-kalla-per-uppgift',
        fraga: 'Framgår det av dina intyg vem som iakttagit vad, när uppgiften kommer från någon annan?',
        bakgrund: 'Kravet i 6 kap. 3 § HSLF-FS 2018:54, och det som gör att en läkare kan stå bakom ett underlag hon inte själv tagit fram. Det tränas i FÖREDRAGNING-beaten i lak-anna.',
        berorFall: ['lak-anna', 'lak-bengt', 'lak-brist'],
        skattning: 15,
        sakerhet: 'medel',
        motivering: 'Föreskriften kräver att det ska framgå varifrån en uppgift kommer, och att intygsutfärdarens egna bedömningar går att skilja från annat. Fälten i FK 7804 är byggda för det. Min gissning är ändå att det görs sällan: i bästa fall står det "enligt fysioterapeut nedsatt rörlighet", i sämsta fall står patientens ord, kollegans fynd och läkarens slutsats i samma mening utan att någon kan säga vilket som är vilket. Det är också den brist som oftast genererar en kompletteringsförfrågan – och den kostar patientens försörjning, inte läkarens kalender. Är siffran låg är det ett av de starkaste skälen att LESS ska träna just det här.',
        status: 'skattad av rådgivare' },

      { id: 'lak-intyg-signeras-i-rummet',
        fraga: 'Hur ofta är intyget skrivet och signerat innan patienten lämnat rummet?',
        bakgrund: 'Både lak-anna och lak-bengt bygger på att patienten går därifrån med saken avgjord samma förmiddag.',
        berorFall: ['lak-anna', 'lak-bengt'],
        skattning: 20,
        sakerhet: 'medel',
        motivering: 'Två saker som fallen just nu låter smälta ihop. Att ge beskedet muntligt i rummet – grad, längd, vad som gäller och när det omprövas – är fullt realistiskt och görs ofta. Att intyget är formulerat, signerat och skickat innan patienten reser sig är något annat: intyget skrivs i regel efteråt, i en lucka som inte finns, ofta samma kväll och ibland tre dagar senare. Delfrågan som avgör: hur många osignerade intyg står i Webcert vid dagens slut? Blir siffran låg ska fallen skilja tydligare på beskedet, som ges i rummet, och handlingen, som blir klar sedan – annars lär de ut en tidsbudget som inte finns.',
        status: 'skattad av rådgivare' },

      { id: 'lak-somatisk-utredning-f43',
        fraga: 'Görs somatisk screening innan första sjukskrivningen vid utmattning eller ångest?',
        bakgrund: 'Den lucka LESS-flödet strukturellt riskerar att skapa: när läkaren inte är förstakontakt tilldelas den somatiska frågan ingen. I jourupplägget hamnar den hos läkaren i rummet.',
        berorFall: ['lak-anna', 'lak-brist'],
