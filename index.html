<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LESS – Vårdcentralen</title>
<meta name="description" content="Ett litet läromedelsspel om sjukskrivningsprocessen enligt LESS i primärvården.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2016%2016%27%3E%3Ccircle%20cx%3D%278%27%20cy%3D%278%27%20r%3D%278%27%20fill%3D%27%2375d8c7%27%2F%3E%3Cg%20fill%3D%27%2300443c%27%3E%3Crect%20x%3D%275%27%20y%3D%273%27%20width%3D%272%27%20height%3D%271%27%2F%3E%3Crect%20x%3D%277%27%20y%3D%272%27%20width%3D%272%27%20height%3D%271%27%2F%3E%3Crect%20x%3D%279%27%20y%3D%273%27%20width%3D%272%27%20height%3D%271%27%2F%3E%3Crect%20x%3D%276%27%20y%3D%275%27%20width%3D%275%27%20height%3D%272%27%2F%3E%3Crect%20x%3D%276%27%20y%3D%275%27%20width%3D%272%27%20height%3D%278%27%2F%3E%3Crect%20x%3D%274%27%20y%3D%278%27%20width%3D%276%27%20height%3D%272%27%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="frame">
  <div id="stage">
    <canvas id="screen" width="160" height="144"></canvas>

    <div id="ui">

      <!-- Rumsetikett och uppdrag: syns i vårdcentralen -->
      <div id="worldbar" class="hidden">
        <div id="roomlabel">KORRIDOR</div>
        <div id="objective"></div>
      </div>

      <!-- HUD: syns under möten -->
      <div id="hud" class="hidden">
        <div id="hud-name">PATIENT</div>
        <div id="hud-clock">
          <span id="hud-clock-label">20:00</span>
          <div id="hud-bar"><i id="hud-bar-fill"></i></div>
        </div>
      </div>

      <!-- Dialogruta -->
      <div id="dialog" class="gbbox hidden">
        <p id="dialog-text"></p>
        <span id="dialog-more" class="hidden">▼</span>
      </div>

      <!-- Menyval -->
      <div id="menu" class="gbbox hidden"></div>

      <!-- Hörnbanner (t.ex. "FAKTAKONTROLL") -->
      <div id="banner" class="hidden"></div>

      <!-- Flyktig reaktionssignal -->
      <div id="cue" class="hidden"></div>

      <!-- Overlay-panel: journal, handbok, meny -->
      <div id="panel" class="hidden">
        <div id="panel-box" class="gbbox">
          <h2 id="panel-title">JOURNAL</h2>
          <div id="panel-body"></div>
          <div class="panel-foot">B / X = tillbaka</div>
        </div>
      </div>

      <!-- Debrief / handledarens återkoppling -->
      <div id="debrief" class="hidden">
        <div id="debrief-box">
          <div id="debrief-body"></div>
        </div>
        <div id="debrief-foot">A = fortsätt &nbsp;·&nbsp; ↑↓ = bläddra</div>
      </div>

      <!-- Titelskärm -->
      <div id="title" class="hidden">
        <div id="title-logo">
          <span class="t-less">LESS</span>
          <span class="t-sub">VÅRDCENTRALEN</span>
        </div>
        <div id="title-press">TRYCK PÅ START</div>
        <div id="title-brand"><span class="mark" aria-hidden="true"></span>FORSÅKER VÅRDCENTRAL</div>
        <div id="title-foot">ETT LÄROMEDEL OM SJUKSKRIVNING</div>
      </div>

      <!-- Fade -->
      <div id="fade"></div>
    </div>
  </div>

  <!-- Pekkontroller för mobil -->
  <div id="pad" aria-hidden="true">
    <div id="dpad">
      <button class="pb" data-key="up">▲</button>
      <button class="pb" data-key="left">◀</button>
      <button class="pb" data-key="right">▶</button>
      <button class="pb" data-key="down">▼</button>
    </div>
    <div id="btns">
      <button class="pb round" data-key="b">B</button>
      <button class="pb round" data-key="a">A</button>
    </div>
    <div id="sysbtns">
      <button class="pb wide" data-key="journal">JOURNAL</button>
      <button class="pb wide" data-key="handbok">HANDBOK</button>
      <button class="pb wide" data-key="meny">MENY</button>
    </div>
  </div>
</div>

<noscript><p style="color:#fff;font:14px sans-serif;padding:1em">Spelet kräver JavaScript.</p></noscript>

<!-- Motor -->
<script src="js/util.js"></script>
<script src="js/audio.js"></script>
<script src="js/art.js"></script>
<script src="js/map.js"></script>
<script src="js/ui.js"></script>
<script src="js/state.js"></script>
<!-- Innehåll (patientfall) -->
<script src="content/glossary.js"></script>
<script src="content/people.js"></script>
<script src="content/cases-ssk.js"></script>
<script src="content/cases-psykolog.js"></script>
<script src="content/cases-fysio.js"></script>
<script src="content/cases-arbetsterapeut.js"></script>
<script src="content/cases-lakare.js"></script>
<script src="content/cases-rehabkoordinator.js"></script>
<script src="content/campaign.js"></script>
<!-- Scener -->
<script src="js/encounter.js"></script>
<script src="js/debrief.js"></script>
<script src="js/overworld.js"></script>
<script src="js/main.js"></script>
</body>
</html>
